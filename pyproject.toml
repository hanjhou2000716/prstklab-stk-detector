[project]
name = "prstk-stock-detector"
version = "0.1.0"
description = "Public, read-only market intelligence and research platform"
requires-python = ">=3.11,<3.14"
dependencies = [
  "requests>=2.32,<3",
  "python-dotenv>=1.0,<2",
  "yfinance>=0.2",
  "pandas-market-calendars>=4.4",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5.0,<7",
  "html5lib>=1.1,<2",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "Pillow>=10,<13",
  # NumPy 2.4 ships stubs using Python 3.12-only syntax.  CI and scheduled
  # jobs still support Python 3.11, so keep the type/runtime matrix aligned.
  "numpy>=1.26,<2.4",
  "playwright>=1.52,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-requests>=2.32,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".venv", "site/data", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
pretty = true
exclude = "^(tests|site/data|data)/"

[tool.coverage.run]
# Keep the CI baseline compatible with subprocesses that do not inherit
# pytest-cov's branch configuration. Branch coverage can be measured by the
# dedicated coverage-debt job without making the release smoke test flaky.
branch = false
source = ["src"]
# CLI-only wrappers are verified by the offline subprocess/E2E jobs below;
# they are not imported by the library coverage run.  Core decision and
# delivery modules remain included in the 80% project floor.
omit = [
  "src/main.py",
  "src/configure_mini_app.py",
  "src/market_history.py",
  "src/run_*.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
