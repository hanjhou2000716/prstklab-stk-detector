name: Scheduled brief slot receipt audit

on:
  repository_dispatch:
    types: [scheduled-slot-receipt-audit]
  schedule:
    # UTC triggers correspond to the exchange-local read-only receipt deadlines.
    - cron: "45 22 * * *"
    - cron: "30 1 * * 1-5"
    - cron: "5 7 * * 1-5"
    # NYSE daylight and standard-time candidates; the non-applicable one exits quietly.
    - cron: "45 13 * * 1-5"
    - cron: "45 14 * * 1-5"

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: scheduled-brief-slot-audit-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  audit:
    name: Verify scheduled slot receipt (read-only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Validate external audit timestamp and wait until due
        id: audit_timing
        if: github.event_name == 'repository_dispatch'
        env:
          AUDIT_SLOT: ${{ github.event.client_payload.slot || '' }}
          AUDIT_SLOT_DATE: ${{ github.event.client_payload.slot_date || '' }}
          AUDIT_SCHEDULED_FOR_AT: ${{ github.event.client_payload.scheduled_for_at || '' }}
          AUDIT_DISPATCH_UNIX: ${{ github.event.client_payload.dispatch_unix || '' }}
          AUDIT_REQUESTED_AT: ${{ github.event.client_payload.dispatch_unix || '' }}
        run: >-
          python -m src.scheduled_slot_audit --wait-until-due
          --slot "$AUDIT_SLOT"
          --slot-date "$AUDIT_SLOT_DATE"
          --scheduled-for-at "$AUDIT_SCHEDULED_FOR_AT"
          --dispatch-unix "$AUDIT_DISPATCH_UNIX"
          --requested-at "$AUDIT_REQUESTED_AT"
      - name: Install read-only audit dependencies
        run: python -m pip install -r requirements-production.txt
      - name: Checkout published receipt ledger after audit deadline (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: data-release
          path: receipt-ledger
          fetch-depth: 1
          persist-credentials: false
      - name: Capture immutable audit run creation time
        id: run_context
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python -m src.workflow_run_context >> "$GITHUB_OUTPUT"
      - name: Capture audit start and immutable ledger revision
        id: audit_context
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "ledger_commit_sha=$(git -C receipt-ledger rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Audit scheduled slot receipt without dispatch or mutation
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          RUN_CREATED_AT: ${{ steps.run_context.outputs.created_at }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          TRIGGER_SOURCE: ${{ github.event_name }}
          AUDIT_STARTED_AT: ${{ steps.audit_context.outputs.started_at }}
          LEDGER_COMMIT_SHA: ${{ steps.audit_context.outputs.ledger_commit_sha }}
          SCHEDULED_RECIPIENT_SET_MANIFEST: ${{ vars.SCHEDULED_RECIPIENT_SET_MANIFEST || '' }}
          AUDIT_SLOT: ${{ github.event.client_payload.slot || '' }}
          AUDIT_SLOT_DATE: ${{ github.event.client_payload.slot_date || '' }}
          AUDIT_SCHEDULED_FOR_AT: ${{ github.event.client_payload.scheduled_for_at || '' }}
          AUDIT_DISPATCH_UNIX: ${{ github.event.client_payload.dispatch_unix || '' }}
          AUDIT_REQUESTED_AT: ${{ github.event.client_payload.dispatch_unix || steps.run_context.outputs.created_at || '' }}
          SCHEDULED_SLOT_AUDIT_RESULT_PATH: ${{ runner.temp }}/scheduled-slot-audit-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: >-
          python -m src.scheduled_slot_audit
          --ledger receipt-ledger/site/data/event-ledger.json
          --schedule "$GITHUB_EVENT_SCHEDULE"
          --run-created-at "$RUN_CREATED_AT"
          --ledger-source data-release
          --ledger-commit-sha "$LEDGER_COMMIT_SHA"
          --trigger-source "$TRIGGER_SOURCE"
          --audit-started-at "$AUDIT_STARTED_AT"
          --slot "$AUDIT_SLOT"
          --slot-date "$AUDIT_SLOT_DATE"
          --scheduled-for-at "$AUDIT_SCHEDULED_FOR_AT"
          --requested-at "$AUDIT_REQUESTED_AT"
          --dispatch-unix "$AUDIT_DISPATCH_UNIX"
          --result-output "$SCHEDULED_SLOT_AUDIT_RESULT_PATH"
      - name: Preserve audit result artifact on every exit path
        if: always()
        env:
          SCHEDULED_SLOT_AUDIT_RESULT_PATH: ${{ runner.temp }}/scheduled-slot-audit-${{ github.run_id }}-${{ github.run_attempt }}.json
          AUDIT_RUN_ID: ${{ github.run_id }}
          AUDIT_RUN_ATTEMPT: ${{ github.run_attempt }}
          AUDIT_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["SCHEDULED_SLOT_AUDIT_RESULT_PATH"])
          if not path.exists():
              payload = {
                  "schema_version": "scheduled-slot-audit-result-v1",
                  "run_id": os.environ["AUDIT_RUN_ID"],
                  "attempt": int(os.environ["AUDIT_RUN_ATTEMPT"]),
                  "workflow_sha": os.environ["AUDIT_WORKFLOW_SHA"],
                  "original_slot": {"slot": "", "date": "", "anchor": "", "scheduled_slot_at": ""},
                  "audit_due_at": "",
                  "audited_at": "",
                  "ledger_sha": "",
                  "recipient_set_version": "unknown",
                  "execution_status": "INCOMPLETE",
                  "report_receipt_status": "unknown",
                  "incident_handoff_status": "pending",
                  "diagnostic_complete": False,
                  "first_failure_reason": "audit_result_not_produced",
                  "result": {"status": "blocked", "reason": "audit_result_not_produced"},
              }
              path.write_text(json.dumps(payload, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload immutable scheduled slot audit result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scheduled-slot-audit-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scheduled-slot-audit-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 14
