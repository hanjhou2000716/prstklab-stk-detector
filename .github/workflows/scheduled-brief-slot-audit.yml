name: Scheduled brief slot receipt audit

on:
  schedule:
    # Exactly 09:45 America/New_York across DST, 15 minutes after the send
    # deadline to allow durable receipt publication. The non-applicable UTC
    # candidate exits read-only without evaluating a different local time.
    - cron: "45 13 * * 1-5"
    - cron: "45 14 * * 1-5"

permissions:
  actions: read
  contents: read

concurrency:
  group: scheduled-brief-slot-audit-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  audit:
    name: Verify durable premarket receipt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Checkout published receipt ledger (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: data-release
          path: receipt-ledger
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install calendar dependency
        run: pip install "pandas-market-calendars>=4.4"
      - name: Audit this NYSE premarket slot
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: >-
          python -m src.scheduled_slot_audit
          --ledger receipt-ledger/site/data/event-ledger.json
          --schedule "$GITHUB_EVENT_SCHEDULE"
