name: Four-strategy walk-forward research

on:
  workflow_dispatch:
    inputs:
      market:
        description: Archived market dataset to validate
        required: true
        type: choice
        default: taiwan
        options: [taiwan, us]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: Audit archived point-in-time study inputs
        id: archive_audit
        run: |
          set +e
          python -m src.run_backtest_archive_audit \
            --market '${{ inputs.market }}' \
            --output data/backtest-archive-audit-${{ inputs.market }}.json
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Backtest archive is not ready; the audit artifact lists the blockers."
          fi
          exit 0
      - name: Upload archive audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backtest-archive-audit-${{ inputs.market }}
          path: data/backtest-archive-audit-${{ inputs.market }}.json
      - name: Explain blocked backtest
        if: steps.archive_audit.outputs.ready != 'true'
        run: echo "Formal walk-forward metrics were not produced because the point-in-time archive is incomplete."
      - name: Run research-only walk-forward validation
        if: steps.archive_audit.outputs.ready == 'true'
        run: >-
          python -m src.run_four_strategy_walk_forward
          --market '${{ inputs.market }}'
          --bars-dir data/backtest/${{ inputs.market }}/bars
          --benchmark-csv data/backtest/${{ inputs.market }}/benchmark.csv
          --universe-snapshots data/backtest/${{ inputs.market }}/universe_snapshots.json
          --fundamental-snapshots data/backtest/${{ inputs.market }}/fundamental_snapshots.json
          --output data/four-strategy-walk-forward-${{ inputs.market }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.archive_audit.outputs.ready == 'true'
        with:
          name: four-strategy-walk-forward-${{ inputs.market }}
          path: data/four-strategy-walk-forward-${{ inputs.market }}.json
