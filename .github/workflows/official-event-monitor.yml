name: Official macro and price monitor

on:
  workflow_dispatch:
    inputs:
      notify:
        description: Allow Telegram delivery for this monitor run
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [official-event-check]
  schedule:
    # FJ recovery and 24-hour assets must not stop at the Taiwan Friday UTC
    # boundary; market-specific freshness gates decide whether a row is
    # actually eligible.
    - cron: "*/5 * * * *"

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: main-data-writer-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  monitor-send-deploy:
    # Serialize scheduled and repository-dispatch monitors on the same main
    # release stream.  A second run must not publish a newer Pages release
    # between Telegram send and the recipient opening its deep link.
    concurrency:
      group: official-event-monitor-${{ github.ref }}
      cancel-in-progress: false
    # A transient Pages outage is exposed by the retry action.  Contract and
    # release-gate failures remain hard failures and block Telegram delivery.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      RAILWAY_STATUS_URL: ${{ vars.RAILWAY_STATUS_URL }}
      RAILWAY_STATUS_SHARED_SECRET: ${{ secrets.RAILWAY_STATUS_SHARED_SECRET || secrets.DELIVERY_STATUS_SHARED_SECRET }}
      PUBLIC_OBSERVATIONS_URL: ${{ vars.PUBLIC_OBSERVATIONS_URL }}
      PUBLIC_OBSERVATIONS_SHARED_SECRET: ${{ secrets.PUBLIC_OBSERVATIONS_SHARED_SECRET || secrets.DELIVERY_RECEIPT_SHARED_SECRET || secrets.RAILWAY_STATUS_SHARED_SECRET || secrets.DELIVERY_STATUS_SHARED_SECRET }}
      NEWS_CACHE_PATH: site/data/news-cache.json
      MANIFEST_PATH: site/data/release-manifest.json
      DATA_RELEASE_BRANCH: data-release
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MARKET_BACKUP_ENABLED: 'true'
      NOTIFY: ${{ github.event_name == 'workflow_dispatch' && (inputs.notify == true && 'true' || 'false') || github.event_name == 'repository_dispatch' && (github.event.client_payload.notify == false || github.event.client_payload.notify == 'false') && 'false' || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Restore last immutable data release
        run: python -m src.data_release --restore --branch "$DATA_RELEASE_BRANCH" --include site/data
      - name: Capture prepared release base
        id: prepared_base
        run: |
          git fetch --no-tags origin "refs/heads/${DATA_RELEASE_BRANCH}:refs/remotes/origin/${DATA_RELEASE_BRANCH}"
          echo "data_release_sha=$(git rev-parse "refs/remotes/origin/${DATA_RELEASE_BRANCH}")" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install production text-delivery dependencies
        run: pip install -r requirements-production.txt
      - name: Install Chromium for formal card renderer
        run: python -m playwright install --with-deps chromium
      - name: Restore official-source baseline
        id: baseline
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: .official-event-baseline
          key: official-event-baseline-v1
      - name: Check current official releases and threshold price signals
        id: status
        env:
          OFFICIAL_EVENT_BASELINE_READY: ${{ steps.baseline.outputs.cache-hit == 'true' }}
          DISPATCH_PRIORITY_CANDIDATE_DETECTED: ${{ github.event.client_payload.priority_candidate_detected || '0' }}
          DISPATCH_PRIORITY_PENDING_REFS: ${{ github.event.client_payload.priority_pending_refs || '[]' }}
          DISPATCH_PRIORITY_EVENT_REFS: ${{ github.event.client_payload.priority_event_refs || '[]' }}
        run: python -m src.official_event_monitor --write-status
      - name: Fail on priority candidate contract mismatch
        if: steps.status.outputs.hard_failure == 'true'
        run: |
          echo "Priority candidate contract mismatch: no safe delivery decision was produced."
          exit 1
      - name: Wait for production writer queue
        id: writer_queue
        if: steps.status.outputs.ledger_changed == 'true' || steps.status.outputs.should_send == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m src.writer_queue
      - name: Revalidate prepared release base
        id: prepared_release
        if: steps.writer_queue.outputs.should_continue == 'true'
        run: |
          git fetch --no-tags origin "refs/heads/${DATA_RELEASE_BRANCH}:refs/remotes/origin/${DATA_RELEASE_BRANCH}"
          current_sha="$(git rev-parse "refs/remotes/origin/${DATA_RELEASE_BRANCH}")"
          if [ "$current_sha" != "${{ steps.prepared_base.outputs.data_release_sha }}" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "reason=stale_prepared_release" >> "$GITHUB_OUTPUT"
            echo "::notice::Prepared snapshot was based on an older immutable release; publication deferred to the next monitor run."
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "reason=prepared_release_current" >> "$GITHUB_OUTPUT"
          fi
      - name: Save official-source baseline
        if: success() && steps.baseline.outputs.cache-hit != 'true' && (steps.writer_queue.outcome == 'skipped' || (steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true'))
        run: touch .official-event-baseline
      - name: Persist official-source baseline
        if: success() && steps.baseline.outputs.cache-hit != 'true' && (steps.writer_queue.outcome == 'skipped' || (steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true'))
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: .official-event-baseline
          key: official-event-baseline-v1
      - name: Restore event delivery lock
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.status.outputs.should_send == 'true'
        id: idempotency
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: .official-event-lock
          key: official-event-${{ steps.status.outputs.key }}
      - name: Build and publish event release
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && (steps.status.outputs.ledger_changed == 'true' || (steps.status.outputs.should_send == 'true' && steps.idempotency.outputs.cache-hit != 'true'))
        run: |
          python -m src.release_manifest \
            --allow-stale-research \
            --research-fallback-reason "research scan incomplete; preserving last-known-good research snapshot"
          python -m src.data_release --publish --branch "$DATA_RELEASE_BRANCH" --include site/data \
            --message "chore: refresh official event snapshot"
      - name: Build and validate cache-busted static assets
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && (steps.status.outputs.ledger_changed == 'true' || (steps.status.outputs.should_send == 'true' && steps.idempotency.outputs.cache-hit != 'true'))
        run: |
          python -m src.build_assets --root site --build-sha "$GITHUB_SHA"
          python -m src.asset_contract --root site
      - name: Configure GitHub Pages
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && (steps.status.outputs.ledger_changed == 'true' || (steps.status.outputs.should_send == 'true' && steps.idempotency.outputs.cache-hit != 'true'))
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload Pages artifact
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && (steps.status.outputs.ledger_changed == 'true' || (steps.status.outputs.should_send == 'true' && steps.idempotency.outputs.cache-hit != 'true'))
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
      - name: Deploy Pages
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && (steps.status.outputs.ledger_changed == 'true' || (steps.status.outputs.should_send == 'true' && steps.idempotency.outputs.cache-hit != 'true'))
        id: deployment
        uses: ./.github/actions/deploy-pages-retry
        with:
          fallback_url: ${{ env.DASHBOARD_URL }}
      - name: Verify deployed release before delivery
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.status.outputs.should_send == 'true' && steps.idempotency.outputs.cache-hit != 'true' && steps.deployment.outputs.available == 'true'
        id: release_gate
        run: |
          python -m src.release_gate \
            --manifest "$MANIFEST_PATH" \
            --expected-snapshot-id "${{ steps.status.outputs.snapshot_id }}" \
            --public-url "${{ steps.deployment.outputs.page_url }}" \
            --expected-notification-id "${{ steps.status.outputs.notification_id }}" \
            --expected-alert-snapshot-id "${{ steps.status.outputs.snapshot_id }}" \
            --expected-alert-observation-id "${{ steps.status.outputs.observation_id }}" \
            --public-attempts 12 \
            --public-delay 5 \
            >> "$GITHUB_OUTPUT"
      - name: Record delivery gate when Pages is unavailable
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.status.outputs.should_send == 'true' && steps.idempotency.outputs.cache-hit != 'true' && steps.deployment.outputs.available != 'true'
        run: echo "Pages unavailable; Telegram delivery intentionally skipped (fail closed)."
      - name: Send new official event
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.release_gate.outputs.allowed == 'true' && env.NOTIFY == 'true'
        id: send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PUBLIC_RELEASE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_ID: ${{ steps.release_gate.outputs.release_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_SUBSCRIPTIONS_ENABLED: "true"
        run: python -m src.official_event_monitor --send --prepared --expected-key "${{ steps.status.outputs.key }}"
      - name: Publish official notification decision
        if: always()
        env:
          SCAN_STATUS: ${{ steps.status.outcome }}
          NOTIFICATION_REQUESTED: ${{ env.NOTIFY }}
          CANDIDATE_TYPE: ${{ steps.status.outputs.candidate_type || 'none' }}
          NOTIFICATION_EXPECTED: ${{ steps.status.outputs.notification_expected || 'false' }}
          NOTIFICATION_STATUS: ${{ steps.send.outputs.notification_status || steps.status.outputs.notification_status || 'not_attempted' }}
          NOTIFICATION_REASON: ${{ steps.send.outputs.reason || steps.status.outputs.notification_reason || 'not_attempted' }}
          QUEUE_STATUS: ${{ steps.writer_queue.outputs.queue_status || 'not_required' }}
          QUEUE_REASON: ${{ steps.writer_queue.outputs.reason || '' }}
          PREPARED_RELEASE_STATUS: ${{ steps.prepared_release.outputs.reason || 'not_required' }}
          SHOULD_SEND: ${{ steps.status.outputs.should_send || 'false' }}
          IDEMPOTENCY_CACHE_HIT: ${{ steps.idempotency.outputs.cache-hit || 'false' }}
          DEPLOYMENT_AVAILABLE: ${{ steps.deployment.outputs.available || 'false' }}
          DEPLOYMENT_ERROR_CODE: ${{ steps.deployment.outputs.error_code || '' }}
          RELEASE_GATE_ALLOWED: ${{ steps.release_gate.outputs.allowed || 'false' }}
          SEND_OUTCOME: ${{ steps.send.outcome || 'skipped' }}
          SEND_STATUS: ${{ steps.send.outputs.notification_status || '' }}
          DELIVERY_STATUS: ${{ steps.send.outputs.delivery_status || '' }}
          DELIVERED_COUNT: ${{ steps.send.outputs.delivered_count || '0' }}
          FAILED_COUNT: ${{ steps.send.outputs.failed_count || '0' }}
        run: |
          scan_status="${SCAN_STATUS:-unknown}"
          if [ "${QUEUE_STATUS:-}" = "superseded" ]; then
            scan_status="not_run"
          fi
          notification_status="${NOTIFICATION_STATUS:-not_attempted}"
          notification_reason="${NOTIFICATION_REASON:-not_attempted}"
          if [ "${NOTIFICATION_REQUESTED:-false}" = "true" ] && [ "${SHOULD_SEND:-false}" = "true" ] \
            && [ "${QUEUE_STATUS:-}" != "superseded" ] && [ "${PREPARED_RELEASE_STATUS:-}" = "prepared_release_current" ]; then
            if [ "${IDEMPOTENCY_CACHE_HIT:-false}" = "true" ]; then
              notification_status="already_delivered"
              notification_reason="successful_prior_idempotency_receipt"
            elif [ "${DEPLOYMENT_AVAILABLE:-false}" != "true" ]; then
              notification_status="failed"
              notification_reason="pages_deployment_${DEPLOYMENT_ERROR_CODE:-unavailable}"
            elif [ "${RELEASE_GATE_ALLOWED:-false}" != "true" ]; then
              notification_status="failed"
              notification_reason="public_release_gate_blocked"
            elif [ "${SEND_OUTCOME:-skipped}" != "success" ] || [ "${DELIVERY_STATUS:-}" != "delivered" ] \
              || [ "${DELIVERED_COUNT:-0}" -le 0 ] || [ "${FAILED_COUNT:-0}" -ne 0 ]; then
              notification_status="failed"
              notification_reason="expected_delivery_or_recipient_receipt_missing"
            else
              notification_status="delivery_submitted"
              notification_reason="telegram_delivery_waiting_for_persistent_receipt"
            fi
          fi
          {
            echo "## Official event / price notification decision"
            echo "- scan_status: ${scan_status}"
            echo "- candidate_type: ${CANDIDATE_TYPE:-none}"
            if [ "${NOTIFICATION_REQUESTED:-false}" != "true" ]; then
              echo "- notification_expected: false"
              echo "- notification_status: not_requested"
              echo "- notification_reason: manual_notification_opt_in_required"
            else
              if [ "${QUEUE_STATUS:-}" = "superseded" ]; then
                echo "- notification_expected: false"
                echo "- notification_status: suppressed"
                echo "- notification_reason: stale_workflow_superseded"
              elif [ "${PREPARED_RELEASE_STATUS:-}" = "stale_prepared_release" ]; then
                echo "- notification_expected: false"
                echo "- notification_status: suppressed"
                echo "- notification_reason: stale_prepared_release"
              else
                echo "- notification_expected: ${NOTIFICATION_EXPECTED:-false}"
                echo "- notification_status: ${notification_status}"
                echo "- notification_reason: ${notification_reason}"
              fi
            fi
            echo "- delivered_count: ${DELIVERED_COUNT:-unknown}"
            echo "- failed_count: ${FAILED_COUNT:-unknown}"
            echo "- writer_queue_status: ${QUEUE_STATUS:-not_required}"
            echo "- writer_queue_reason: ${QUEUE_REASON:-none}"
            echo "- prepared_release_status: ${PREPARED_RELEASE_STATUS:-not_required}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Persist Telegram delivery receipt
        id: persist_receipt
        # A failed recipient attempt must still reach the receipt backend so
        # the next run can retry only pending recipients and the dashboard can
        # distinguish a transport failure from a skipped send.
        if: always() && steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.release_gate.outputs.allowed == 'true' && steps.send.outcome != 'skipped' && steps.send.outputs.trace_id != '' && steps.send.outputs.delivery_status != ''
        continue-on-error: true
        env:
          RECEIPT_CALLBACK_URL: ${{ vars.RECEIPT_CALLBACK_URL }}
          DELIVERY_RECEIPT_SHARED_SECRET: ${{ secrets.DELIVERY_RECEIPT_SHARED_SECRET || secrets.RAILWAY_STATUS_SHARED_SECRET || secrets.DELIVERY_STATUS_SHARED_SECRET }}
          RAILWAY_STATUS_URL: ${{ vars.RAILWAY_STATUS_URL }}
          RAILWAY_STATUS_SHARED_SECRET: ${{ secrets.RAILWAY_STATUS_SHARED_SECRET || secrets.DELIVERY_STATUS_SHARED_SECRET }}
          TRACE_ID: ${{ steps.send.outputs.trace_id }}
          RELEASE_ID: ${{ steps.send.outputs.release_id || steps.release_gate.outputs.release_id }}
          SNAPSHOT_ID: ${{ steps.send.outputs.snapshot_id || steps.release_gate.outputs.snapshot_id }}
          ALERT_ID: ${{ steps.send.outputs.alert_id }}
          DELIVERY_MODE: ${{ steps.send.outputs.delivery_mode }}
          DELIVERY_STATUS: ${{ steps.send.outputs.delivery_status }}
          DELIVERED_COUNT: ${{ steps.send.outputs.delivered_count }}
          FAILED_COUNT: ${{ steps.send.outputs.failed_count }}
          FAILED_RECIPIENT_HASHES: ${{ steps.send.outputs.failed_recipient_hashes }}
          FINANCIALJUICE_TRACE: ${{ steps.send.outputs.financialjuice_delivery_trace }}
        run: python -m src.delivery_callback
      - name: Persist notification ledger state after delivery
        id: persist_notification_ledger
        if: always() && steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.release_gate.outputs.allowed == 'true' && steps.send.outcome != 'skipped'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m src.release_manifest \
            --allow-stale-research \
            --research-fallback-reason "research scan incomplete; preserving last-known-good research snapshot"
          python -m src.data_release --publish --branch "$DATA_RELEASE_BRANCH" --include site/data \
            --message "chore: persist official notification ledger state"
      - name: Prepare reconciled Pages artifact
        if: always() && steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.release_gate.outputs.allowed == 'true' && steps.send.outcome != 'skipped' && steps.persist_notification_ledger.outcome == 'success'
        run: |
          python -m src.build_assets --root site --build-sha "$GITHUB_SHA"
          python -m src.asset_contract --root site
      - name: Upload reconciled Pages artifact
        if: always() && steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.release_gate.outputs.allowed == 'true' && steps.send.outcome != 'skipped' && steps.persist_notification_ledger.outcome == 'success'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          name: github-pages-reconciled
          path: site
      - name: Deploy reconciled Pages release
        if: always() && steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.release_gate.outputs.allowed == 'true' && steps.send.outcome != 'skipped' && steps.persist_notification_ledger.outcome == 'success'
        id: reconciled_deployment
        uses: ./.github/actions/deploy-pages-retry
        with:
          artifact_name: github-pages-reconciled
          fallback_url: ${{ env.DASHBOARD_URL }}
      - name: Verify reconciled public release
        id: reconciled_release_gate
        if: always() && steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.release_gate.outputs.allowed == 'true' && steps.send.outcome != 'skipped' && steps.persist_notification_ledger.outcome == 'success' && steps.reconciled_deployment.outputs.available == 'true'
        run: >-
          python -m src.release_gate
          --manifest "$MANIFEST_PATH"
          --expected-snapshot-id "${{ steps.status.outputs.snapshot_id }}"
          --public-url "${{ steps.reconciled_deployment.outputs.page_url }}"
          --public-attempts 12
          --public-delay 5
      - name: Save event delivery lock
        if: success() && steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.send.outputs.sent == 'true'
        run: touch .official-event-lock
      - name: Persist event delivery lock
        if: success() && steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.send.outputs.sent == 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: .official-event-lock
          key: official-event-${{ steps.status.outputs.key }}
      - name: Save official event diagnostic
        if: always()
        env:
          EVENT_KEY: ${{ steps.status.outputs.key || '' }}
          SCAN_OUTCOME: ${{ steps.status.outcome || 'not_run' }}
          HARD_FAILURE: ${{ steps.status.outputs.hard_failure || 'false' }}
          NOTIFICATION_EXPECTED: ${{ steps.status.outputs.notification_expected || 'false' }}
          NOTIFICATION_STATUS: ${{ steps.send.outputs.notification_status || steps.status.outputs.notification_status || 'not_attempted' }}
          NOTIFICATION_REASON: ${{ steps.send.outputs.reason || steps.status.outputs.notification_reason || 'not_attempted' }}
          NOTIFICATION_REQUESTED: ${{ env.NOTIFY }}
          SHOULD_SEND: ${{ steps.status.outputs.should_send || 'false' }}
          QUEUE_STATUS: ${{ steps.writer_queue.outputs.queue_status || 'not_required' }}
          PREPARED_RELEASE_STATUS: ${{ steps.prepared_release.outputs.reason || 'not_required' }}
          IDEMPOTENCY_CACHE_HIT: ${{ steps.idempotency.outputs.cache-hit || 'false' }}
          PENDING_COUNT: ${{ steps.status.outputs.priority_pending_count || '0' }}
          DISPATCH_REF_COUNT: ${{ steps.status.outputs.priority_dispatch_ref_count || '0' }}
          EVENT_REF_COUNT: ${{ steps.status.outputs.priority_event_ref_count || '0' }}
          MISSING_REF_COUNT: ${{ steps.status.outputs.priority_dispatch_missing_ref_count || '0' }}
          DEPLOYMENT_AVAILABLE: ${{ steps.deployment.outputs.available || 'false' }}
          DEPLOYMENT_ERROR_CODE: ${{ steps.deployment.outputs.error_code || '' }}
          RELEASE_GATE_ALLOWED: ${{ steps.release_gate.outputs.allowed || 'false' }}
          SEND_OUTCOME: ${{ steps.send.outcome || 'skipped' }}
          DELIVERY_STATUS: ${{ steps.send.outputs.delivery_status || '' }}
          DELIVERED_COUNT: ${{ steps.send.outputs.delivered_count || '' }}
          FAILED_COUNT: ${{ steps.send.outputs.failed_count || '' }}
          RECEIPT_OUTCOME: ${{ steps.persist_receipt.outcome || 'skipped' }}
          SEND_SENT: ${{ steps.send.outputs.sent || 'false' }}
          LEDGER_OUTCOME: ${{ steps.persist_notification_ledger.outcome || 'skipped' }}
          RECONCILED_DEPLOYMENT_AVAILABLE: ${{ steps.reconciled_deployment.outputs.available || 'false' }}
          RECONCILED_RELEASE_GATE_OUTCOME: ${{ steps.reconciled_release_gate.outcome || 'skipped' }}
        run: |
          python - <<'PY'
          from datetime import UTC, datetime
          import hashlib
          import json
          import os
          from pathlib import Path

          def value(name: str, default: str = "") -> str:
              return str(os.environ.get(name, default) or default)[:160]

          def count(name: str) -> int | None:
              raw = value(name)
              try:
                  return max(0, int(raw))
              except (TypeError, ValueError):
                return None

          notification_status = value("NOTIFICATION_STATUS", "not_attempted")
          notification_reason = value("NOTIFICATION_REASON", "not_attempted")
          if value("NOTIFICATION_REQUESTED") == "true" and value("SHOULD_SEND") == "true":
              if value("QUEUE_STATUS") == "superseded" or value("PREPARED_RELEASE_STATUS") != "prepared_release_current":
                  notification_status = "suppressed_or_deferred"
                  notification_reason = "writer_queue_or_prepared_release_guard"
              elif value("IDEMPOTENCY_CACHE_HIT") == "true":
                  notification_status = "already_delivered"
                  notification_reason = "successful_prior_idempotency_receipt"
              elif value("DEPLOYMENT_AVAILABLE") != "true":
                  notification_status = "failed"
                  notification_reason = f"pages_deployment_{value('DEPLOYMENT_ERROR_CODE', 'unavailable')}"
              elif value("RELEASE_GATE_ALLOWED") != "true":
                  notification_status = "failed"
                  notification_reason = "public_release_gate_blocked"
              elif (
                  value("SEND_OUTCOME", "skipped") != "success"
                  or value("DELIVERY_STATUS") != "delivered"
                  or (count("DELIVERED_COUNT") or 0) <= 0
                  or (count("FAILED_COUNT") or 0) != 0
                  or value("RECEIPT_OUTCOME", "skipped") != "success"
              ):
                  notification_status = "failed"
                  notification_reason = "expected_delivery_or_recipient_receipt_missing"
              elif value("SEND_SENT") == "true" and (
                  value("LEDGER_OUTCOME", "skipped") != "success"
                  or value("RECONCILED_DEPLOYMENT_AVAILABLE") != "true"
                  or value("RECONCILED_RELEASE_GATE_OUTCOME", "skipped") != "success"
              ):
                  notification_status = "delivered_reconciliation_incomplete"
                  notification_reason = "post_send_public_release_not_reconciled_do_not_resend"
              else:
                  notification_status = "delivered"
                  notification_reason = "recipient_receipt_and_public_release_reconciled"

          event_key = value("EVENT_KEY")
          diagnostic = {
              "schema_version": "official-event-diagnostic-v1",
              "workflow_run_id": value("GITHUB_RUN_ID"),
              "workflow_sha": value("GITHUB_SHA"),
              "event_name": value("GITHUB_EVENT_NAME"),
              "recorded_at": datetime.now(UTC).isoformat(),
              "event_key_fingerprint": hashlib.sha256(event_key.encode("utf-8")).hexdigest()[:16] if event_key else "",
              "scan": {
                  "outcome": value("SCAN_OUTCOME", "not_run"),
                  "hard_failure": value("HARD_FAILURE", "false"),
              },
              "priority": {
                  "notification_expected": value("NOTIFICATION_EXPECTED", "false"),
                  "notification_status": notification_status,
                  "notification_reason": notification_reason,
                  "pending_count": count("PENDING_COUNT"),
                  "dispatch_ref_count": count("DISPATCH_REF_COUNT"),
                  "event_ref_count": count("EVENT_REF_COUNT"),
                  "missing_ref_count": count("MISSING_REF_COUNT"),
              },
              "delivery": {
                  "deployment_available": value("DEPLOYMENT_AVAILABLE", "false"),
                  "release_gate_allowed": value("RELEASE_GATE_ALLOWED", "false"),
                  "sender_outcome": value("SEND_OUTCOME", "skipped"),
                  "delivered_count": count("DELIVERED_COUNT"),
                  "failed_count": count("FAILED_COUNT"),
                  "pages_error_code": value("DEPLOYMENT_ERROR_CODE"),
                  "receipt_callback_outcome": value("RECEIPT_OUTCOME", "skipped"),
              },
          }
          Path("official-event-diagnostic.json").write_text(
              json.dumps(diagnostic, ensure_ascii=False, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload official event diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-event-diagnostic-${{ github.run_id }}
          path: official-event-diagnostic.json
          if-no-files-found: error
          retention-days: 14
      - name: Fail expected official notification without delivered receipt
        if: always() && env.NOTIFY == 'true' && steps.status.outputs.should_send == 'true'
        env:
          QUEUE_STATUS: ${{ steps.writer_queue.outputs.queue_status || 'not_required' }}
          PREPARED_CURRENT: ${{ steps.prepared_release.outputs.current || 'false' }}
          CACHE_HIT: ${{ steps.idempotency.outputs.cache-hit || 'false' }}
          DEPLOYMENT_AVAILABLE: ${{ steps.deployment.outputs.available || 'false' }}
          DEPLOYMENT_ERROR_CODE: ${{ steps.deployment.outputs.error_code || 'pages_deployment_unavailable' }}
          GATE_ALLOWED: ${{ steps.release_gate.outputs.allowed || 'false' }}
          SEND_OUTCOME: ${{ steps.send.outcome || 'skipped' }}
          DELIVERY_STATUS: ${{ steps.send.outputs.delivery_status || '' }}
          DELIVERED_COUNT: ${{ steps.send.outputs.delivered_count || '0' }}
          FAILED_COUNT: ${{ steps.send.outputs.failed_count || '0' }}
          RECEIPT_OUTCOME: ${{ steps.persist_receipt.outcome || 'skipped' }}
          SEND_SENT: ${{ steps.send.outputs.sent || 'false' }}
          LEDGER_OUTCOME: ${{ steps.persist_notification_ledger.outcome || 'skipped' }}
          RECONCILED_AVAILABLE: ${{ steps.reconciled_deployment.outputs.available || 'false' }}
          RECONCILED_GATE_OUTCOME: ${{ steps.reconciled_release_gate.outcome || 'skipped' }}
        run: |
          set -euo pipefail
          if [ "$CACHE_HIT" = "true" ]; then
            echo "- notification_terminal_status: already_delivered" >> "$GITHUB_STEP_SUMMARY"
            echo "A prior successful delivery lock exists; no additional send was made."
            exit 0
          fi
          if [ "$QUEUE_STATUS" = "superseded" ] || [ "$PREPARED_CURRENT" != "true" ]; then
            echo "- notification_terminal_status: failed" >> "$GITHUB_STEP_SUMMARY"
            echo "- notification_terminal_reason: expected_notification_superseded_or_stale_without_prior_receipt" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Expected official notification was not delivered; this run was superseded or its prepared release became stale."
            exit 1
          fi
          if [ "$DEPLOYMENT_AVAILABLE" != "true" ] || [ "$GATE_ALLOWED" != "true" ]; then
            echo "- notification_terminal_status: failed" >> "$GITHUB_STEP_SUMMARY"
            echo "- notification_terminal_reason: pages_deployment_or_release_gate_failed" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Expected official notification was not delivered: Pages deployment or release verification failed (${DEPLOYMENT_ERROR_CODE})."
            exit 1
          fi
          if [ "$SEND_OUTCOME" != "success" ] || [ "$DELIVERY_STATUS" != "delivered" ] \
            || [ "$DELIVERED_COUNT" -le 0 ] || [ "$FAILED_COUNT" -ne 0 ] \
            || [ "$RECEIPT_OUTCOME" != "success" ]; then
            echo "- notification_terminal_status: failed" >> "$GITHUB_STEP_SUMMARY"
            echo "- notification_terminal_reason: missing_delivery_or_persistent_recipient_receipt" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Expected official notification has no complete delivered recipient receipt."
            exit 1
          fi
          if [ "$SEND_SENT" = "true" ] && { [ "$LEDGER_OUTCOME" != "success" ] || [ "$RECONCILED_AVAILABLE" != "true" ] || [ "$RECONCILED_GATE_OUTCOME" != "success" ]; }; then
            echo "- notification_terminal_status: delivered_reconciliation_incomplete" >> "$GITHUB_STEP_SUMMARY"
            echo "- notification_terminal_reason: post_send_public_release_not_reconciled_do_not_resend" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Telegram delivered, but the post-send public release was not reconciled. Do not resend this event."
            exit 1
          fi
          echo "- notification_terminal_status: delivered" >> "$GITHUB_STEP_SUMMARY"
          echo "- notification_terminal_reason: recipient_receipt_and_public_release_reconciled" >> "$GITHUB_STEP_SUMMARY"

