name: Official macro and price monitor

on:
  workflow_dispatch:
  repository_dispatch:
    types: [official-event-check]
  schedule:
    - cron: "*/5 * * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  monitor-send-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Restore official-source baseline
        id: baseline
        uses: actions/cache/restore@v4
        with:
          path: .official-event-baseline
          key: official-event-baseline-v1
      - name: Check current official releases and threshold price signals
        id: status
        env:
          OFFICIAL_EVENT_BASELINE_READY: ${{ steps.baseline.outputs.cache-hit == 'true' }}
        run: python -m src.official_event_monitor --write-status
      - name: Save official-source baseline
        if: success() && steps.baseline.outputs.cache-hit != 'true'
        run: touch .official-event-baseline
      - name: Persist official-source baseline
        if: success() && steps.baseline.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .official-event-baseline
          key: official-event-baseline-v1
      - name: Restore event delivery lock
        if: steps.status.outputs.should_send == 'true'
        id: idempotency
        uses: actions/cache/restore@v4
        with:
          path: .official-event-lock
          key: official-event-${{ steps.status.outputs.key }}
      - name: Send new official event
        id: send
        if: steps.status.outputs.should_send == 'true' && steps.idempotency.outputs.cache-hit != 'true'
        run: python -m src.official_event_monitor --send --expected-key "${{ steps.status.outputs.key }}"
      - name: Report Telegram delivery outcome
        if: always() && steps.status.outputs.should_send == 'true' && steps.idempotency.outputs.cache-hit != 'true'
        run: |
          echo "trace_id=${{ steps.send.outputs.trace_id }}"
          echo "delivery_status=${{ steps.send.outputs.delivery_status }}"
          echo "delivered_count=${{ steps.send.outputs.delivered_count }} failed_count=${{ steps.send.outputs.failed_count }}"
      - name: Persist Telegram delivery receipt to Railway
        if: always() && steps.status.outputs.should_send == 'true' && steps.idempotency.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          RAILWAY_STATUS_URL: ${{ vars.RAILWAY_STATUS_URL }}
          RAILWAY_STATUS_SHARED_SECRET: ${{ secrets.RAILWAY_STATUS_SHARED_SECRET }}
          TRACE_ID: ${{ steps.send.outputs.trace_id }}
          DELIVERY_STATUS: ${{ steps.send.outputs.delivery_status }}
          DELIVERED_COUNT: ${{ steps.send.outputs.delivered_count }}
          FAILED_COUNT: ${{ steps.send.outputs.failed_count }}
          FAILED_RECIPIENT_HASHES: ${{ steps.send.outputs.failed_recipient_hashes }}
        run: python -m src.delivery_callback
      - name: Commit event snapshot
        if: steps.status.outputs.ledger_changed == 'true' || steps.send.outputs.sent == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/market.json site/data/event-ledger.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh official event snapshot"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git fetch origin main
            git rebase -X theirs origin/main
          done
      - name: Configure GitHub Pages
        if: steps.send.outputs.sent == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.send.outputs.sent == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        if: steps.send.outputs.sent == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Save event delivery lock
        if: success() && steps.send.outputs.sent == 'true'
        run: touch .official-event-lock
      - name: Persist event delivery lock
        if: success() && steps.send.outputs.sent == 'true'
        uses: actions/cache/save@v4
        with:
          path: .official-event-lock
          key: official-event-${{ steps.status.outputs.key }}
