name: Production acceptance photo (single recipient)

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "I confirm this sends exactly one controlled Telegram photo"
        required: true
        type: choice
        options: [false, true]
        default: false
      test_chat_id:
        description: "Exactly one Telegram chat ID that has started the private Bot"
        required: true
        type: string

permissions:
  contents: read

jobs:
  acceptance:
    if: ${{ inputs.confirm_production == 'true' }}
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      RECEIPT_CALLBACK_URL: ${{ vars.RECEIPT_CALLBACK_URL }}
      DELIVERY_RECEIPT_SHARED_SECRET: ${{ secrets.DELIVERY_RECEIPT_SHARED_SECRET || secrets.RAILWAY_STATUS_SHARED_SECRET || secrets.DELIVERY_STATUS_SHARED_SECRET }}
      RAILWAY_STATUS_URL: ${{ vars.RAILWAY_STATUS_URL }}
      RAILWAY_STATUS_SHARED_SECRET: ${{ secrets.RAILWAY_STATUS_SHARED_SECRET || secrets.DELIVERY_STATUS_SHARED_SECRET }}
    steps:
      - name: Mask the single recipient before any job output
        run: echo "::add-mask::${{ inputs.test_chat_id }}"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install production renderer dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium
      - name: Restore the latest immutable data release
        run: |
          # The photo gate must validate the same release that Pages serves.
          # A main checkout intentionally carries only a placeholder site/data
          # tree, so restore the latest data-release snapshot before checking
          # the public manifest. This step has no Telegram credentials and does
          # not publish or mutate the data-release branch.
          git fetch --no-tags origin refs/heads/data-release:refs/remotes/origin/data-release
          python -m src.data_release --restore --branch data-release --include site/data
          git restore --source=origin/data-release --worktree -- site/data/
      - name: Verify release and send one photo
        id: photo
        env:
          TELEGRAM_CHAT_IDS: ${{ inputs.test_chat_id }}
        run: python -m src.production_photo_smoke_test --manifest site/data/release-manifest.json --public-url "$DASHBOARD_URL" --chat-id "$TELEGRAM_CHAT_IDS"
      - name: Persist the scoped delivery receipt
        if: always() && steps.photo.outputs.sent == 'true'
        env:
          RECEIPT_CALLBACK_URL: ${{ vars.RECEIPT_CALLBACK_URL }}
          DELIVERY_RECEIPT_SHARED_SECRET: ${{ secrets.DELIVERY_RECEIPT_SHARED_SECRET || secrets.RAILWAY_STATUS_SHARED_SECRET || secrets.DELIVERY_STATUS_SHARED_SECRET }}
          DELIVERY_RECEIPT_KIND: photo_smoke
          TRACE_ID: ${{ steps.photo.outputs.trace_id }}
          ALERT_ID: ${{ steps.photo.outputs.alert_id }}
          RELEASE_ID: ${{ steps.photo.outputs.release_id }}
          SNAPSHOT_ID: ${{ steps.photo.outputs.snapshot_id }}
          DELIVERY_MODE: ${{ steps.photo.outputs.delivery_mode }}
          DELIVERY_STATUS: ${{ steps.photo.outputs.delivery_status }}
          DELIVERED_COUNT: ${{ steps.photo.outputs.delivered_count }}
          FAILED_COUNT: ${{ steps.photo.outputs.failed_count }}
          RENDERER_ERROR_TYPE: ${{ steps.photo.outputs.renderer_error_type }}
          FAILED_RECIPIENT_HASHES: ""
        run: python -m src.delivery_callback

