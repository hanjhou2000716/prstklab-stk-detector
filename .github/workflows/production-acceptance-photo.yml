name: Production acceptance text (single recipient)

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "I confirm this sends exactly one controlled Telegram text"
        required: true
        type: choice
        options: [false, true]
        default: false
      test_chat_id:
        description: "Exactly one Telegram chat ID that has started the private Bot"
        required: true
        type: string

permissions:
  contents: read

jobs:
  acceptance:
    if: ${{ inputs.confirm_production == 'true' }}
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      RECEIPT_CALLBACK_URL: ${{ vars.RECEIPT_CALLBACK_URL }}
      DELIVERY_RECEIPT_SHARED_SECRET: ${{ secrets.DELIVERY_RECEIPT_SHARED_SECRET || secrets.RAILWAY_STATUS_SHARED_SECRET || secrets.DELIVERY_STATUS_SHARED_SECRET }}
    steps:
      - name: Mask the single recipient before any job output
        run: echo "::add-mask::${{ inputs.test_chat_id }}"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install acceptance dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore and verify the exact release selected for Pages
        run: |
          git fetch --no-tags origin refs/heads/data-release:refs/remotes/origin/data-release
          python -m src.pages_release --branch data-release --max-commits 100 --require-production-research --preserve-public-url "$DASHBOARD_URL"
      - name: Verify release and send one text
        id: text
        env:
          TELEGRAM_CHAT_IDS: ${{ inputs.test_chat_id }}
        run: python -m src.production_text_acceptance --manifest site/data/release-manifest.json --public-url "$DASHBOARD_URL" --chat-id "$TELEGRAM_CHAT_IDS"
      - name: Persist the scoped text receipt
        if: always() && steps.text.outputs.sent == 'true'
        env:
          RECEIPT_CALLBACK_URL: ${{ vars.RECEIPT_CALLBACK_URL }}
          DELIVERY_RECEIPT_SHARED_SECRET: ${{ secrets.DELIVERY_RECEIPT_SHARED_SECRET || secrets.RAILWAY_STATUS_SHARED_SECRET || secrets.DELIVERY_STATUS_SHARED_SECRET }}
          # The durable receipt contract classifies controlled text acceptance
          # as a production delivery.  Keep this aligned with the Worker,
          # Supabase schema, and Railway rollback store.
          DELIVERY_RECEIPT_KIND: production
          TRACE_ID: ${{ steps.text.outputs.trace_id }}
          ALERT_ID: ${{ steps.text.outputs.alert_id }}
          RELEASE_ID: ${{ steps.text.outputs.release_id }}
          SNAPSHOT_ID: ${{ steps.text.outputs.snapshot_id }}
          DELIVERY_MODE: ${{ steps.text.outputs.delivery_mode }}
          DELIVERY_STATUS: ${{ steps.text.outputs.delivery_status }}
          DELIVERED_COUNT: ${{ steps.text.outputs.delivered_count }}
          FAILED_COUNT: ${{ steps.text.outputs.failed_count }}
          RENDERER_ERROR_TYPE: not_applicable
          FAILED_RECIPIENT_HASHES: ""
        run: python -m src.delivery_callback
