name: Refresh market dashboard

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  # Keep every refresh pending; src.writer_queue enforces the shared writer
  # order instead of GitHub's one-pending-run replacement behaviour.
  group: main-data-writer-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    # The Pages retry action reports transient control-plane degradation without
    # throwing.  Data contract and manifest failures must still fail this job.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      NEWS_CACHE_PATH: site/data/news-cache.json
      DATA_RELEASE_BRANCH: data-release
      RAW_OBSERVATION_ROOT: data/raw-observations
      RAW_OBSERVATION_REQUIRED: "true"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MARKET_BACKUP_ENABLED: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Record publication admission
        id: publication_admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m src.writer_queue --create-admission
      - name: Upload publication admission evidence
        id: publication_admission_artifact
        if: steps.publication_admission.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: writer-publication-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: writer-publication-admission.json
          if-no-files-found: error
          retention-days: 14
      - name: Wait for production writer queue
        id: writer_queue
        if: steps.publication_admission_artifact.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m src.writer_queue
      - name: Set up Python
        if: steps.writer_queue.outputs.should_continue == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install dependencies
        if: steps.writer_queue.outputs.should_continue == 'true'
        run: pip install -r requirements.txt
      - name: Restore last immutable data release
        if: steps.writer_queue.outputs.should_continue == 'true'
        id: restore_release
        run: |
          python -m src.data_release --restore --branch "$DATA_RELEASE_BRANCH" --include site/data --include data/raw-observations
          git fetch --no-tags origin "refs/heads/${DATA_RELEASE_BRANCH}:refs/remotes/origin/${DATA_RELEASE_BRANCH}"
          echo "data_release_sha=$(git rev-parse "refs/remotes/origin/${DATA_RELEASE_BRANCH}")" >> "$GITHUB_OUTPUT"
      - name: Refresh public market data
        if: steps.writer_queue.outputs.should_continue == 'true'
        run: python -m src.refresh_market_data
      - name: Build and publish immutable data release
        if: steps.writer_queue.outputs.should_continue == 'true'
        run: |
          arguments=(
            --allow-stale-research \
            --research-fallback-reason "research scan incomplete; preserving last-known-good research snapshot"
          )
          # Feed the same reviewed, privacy-safe Creator record boundary used
          # by scheduled-brief into the canonical release builder.  Missing or
          # invalid input remains fail-soft; it must never block the market
          # release or invent a current-day episode.
          if [ -f "creator/public-records.json" ]; then
            arguments+=(--creator-records "creator/public-records.json")
          fi
          python -m src.release_manifest "${arguments[@]}"
          python -m src.data_release --publish --branch "$DATA_RELEASE_BRANCH" --include site/data --include data/raw-observations \
            --expected-base-sha "${{ steps.restore_release.outputs.data_release_sha }}" \
            --message "chore: refresh public market snapshot"
      - name: Build and validate cache-busted static assets
        if: steps.writer_queue.outputs.should_continue == 'true'
        run: |
          python -m src.build_assets --root site --build-sha "$GITHUB_SHA"
          python -m src.asset_contract --root site
      - name: Configure GitHub Pages
        if: steps.writer_queue.outputs.should_continue == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload Pages artifact
        if: steps.writer_queue.outputs.should_continue == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
      - name: Deploy Pages
        if: steps.writer_queue.outputs.should_continue == 'true'
        id: deployment
        uses: ./.github/actions/deploy-pages-retry
        with:
          phase: refresh_dashboard
      - name: Verify public release after deployment
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.deployment.outputs.available == 'true'
        id: public_release_gate
        run: >-
          python -m src.release_gate
          --manifest site/data/release-manifest.json
          --public-url "${{ steps.deployment.outputs.page_url }}"
          --public-timeout-seconds 180
          --public-delay 2
          --public-max-delay 20
          >> "$GITHUB_OUTPUT"
      - name: Finalize Pages deployment public observation
        if: always() && steps.deployment.outputs.binding_path != ''
        uses: ./.github/actions/finalize-pages-deployment-binding
        with:
          binding_path: ${{ steps.deployment.outputs.binding_path }}
          phase: refresh_dashboard
          gate_outcome: ${{ steps.public_release_gate.outcome || 'not_run' }}
          gate_allowed: ${{ steps.public_release_gate.outputs.allowed || 'false' }}
          gate_status: ${{ steps.public_release_gate.outputs.gate_status || 'not_run' }}
          expected_release_id: ${{ steps.public_release_gate.outputs.expected_release_id || steps.public_release_gate.outputs.release_id || '' }}
          actual_release_id: ${{ steps.public_release_gate.outputs.actual_release_id || steps.public_release_gate.outputs.release_id || '' }}
          expected_snapshot_id: ${{ steps.public_release_gate.outputs.expected_snapshot_id || steps.public_release_gate.outputs.snapshot_id || '' }}
          actual_snapshot_id: ${{ steps.public_release_gate.outputs.actual_snapshot_id || steps.public_release_gate.outputs.snapshot_id || '' }}
          http_status: ${{ steps.public_release_gate.outputs.http_status || '' }}
          attempts: ${{ steps.public_release_gate.outputs.attempts || '[]' }}
      - name: Publish writer queue decision
        if: always()
        env:
          QUEUE_STATUS: ${{ steps.writer_queue.outputs.queue_status || 'failed_or_unavailable' }}
          QUEUE_REASON: ${{ steps.writer_queue.outputs.reason || 'queue_step_failed' }}
          WAITED_SECONDS: ${{ steps.writer_queue.outputs.waited_seconds || 'unknown' }}
        run: |
          {
            echo "## Writer queue decision"
            echo "- queue_status: ${QUEUE_STATUS}"
            echo "- reason: ${QUEUE_REASON}"
            echo "- waited_seconds: ${WAITED_SECONDS}"
            if [ "${QUEUE_STATUS}" = "superseded" ]; then
              echo "- notification_status: suppressed"
              echo "- notification_reason: stale_workflow_superseded"
            else
              echo "- notification_status: not_applicable"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
