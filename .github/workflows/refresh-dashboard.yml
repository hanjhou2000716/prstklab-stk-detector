name: Refresh market dashboard

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: main-data-writer
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    # The Pages retry action reports transient control-plane degradation without
    # throwing.  Data contract and manifest failures must still fail this job.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      NEWS_CACHE_PATH: site/data/news-cache.json
      DATA_RELEASE_BRANCH: data-release
      RAW_OBSERVATION_ROOT: data/raw-observations
      RAW_OBSERVATION_REQUIRED: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore last immutable data release
        run: python -m src.data_release --restore --branch "$DATA_RELEASE_BRANCH" --include site/data --include data/raw-observations
      - name: Refresh public market data
        run: python -m src.refresh_market_data
      - name: Build and publish immutable data release
        run: |
          python -m src.release_manifest \
            --allow-stale-research \
            --research-fallback-reason "research scan incomplete; preserving last-known-good research snapshot"
          python -m src.data_release --publish --branch "$DATA_RELEASE_BRANCH" --include site/data --include data/raw-observations \
            --message "chore: refresh public market snapshot"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: ./.github/actions/deploy-pages-retry
