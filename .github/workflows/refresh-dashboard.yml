name: Refresh market dashboard

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: main-data-writer
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      NEWS_CACHE_PATH: site/data/news-cache.json
      DATA_RELEASE_BRANCH: data-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore last immutable data release
        run: python -m src.data_release --restore --branch "$DATA_RELEASE_BRANCH" --include site/data
      - name: Refresh public market data
        run: python -m src.refresh_market_data
      - name: Build and publish immutable data release
        run: |
          python -m src.release_manifest || test $? -eq 1
          python -m src.data_release --publish --branch "$DATA_RELEASE_BRANCH" --include site/data \
            --message "chore: refresh public market snapshot"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
