name: Incident coordinator health heartbeat

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: prstk-incident-ops-heartbeat
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted coordinator health reader
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Read coordinator health without exposing secrets
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          INCIDENT_OPS_URL: ${{ vars.INCIDENT_OPS_URL }}
          INCIDENT_OPS_AUDIENCE: https://prstk-incident-ops
          INCIDENT_OPS_MODE: ${{ vars.INCIDENT_OPS_MODE || 'shadow' }}
          INCIDENT_OPS_HEALTH_RESULT_PATH: ${{ runner.temp }}/incident-ops-health.json
        run: python -m scripts.incident_ops_watchdog
      - name: Upload immutable coordinator health evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: incident-ops-health-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/incident-ops-health.json
          if-no-files-found: error
          retention-days: 90
