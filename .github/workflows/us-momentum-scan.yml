name: Manual US momentum scan
on:
  workflow_dispatch:
    inputs:
      limit: { description: 'US large-cap symbols to scan', required: true, default: '100' }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - run: python -m src.run_us_momentum_scan --limit ${{ inputs.limit }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: us-momentum-scan, path: data/us-momentum-* }
