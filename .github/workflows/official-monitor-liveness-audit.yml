name: Official monitor liveness audit

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: official-monitor-liveness-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Audit monitor startup independently from Gmail sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          MONITOR_LIVENESS_RESULT_PATH: ${{ runner.temp }}/official-monitor-liveness.json
        run: python scripts/monitor_liveness.py
      - name: Preserve bounded liveness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-monitor-liveness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/official-monitor-liveness.json
          if-no-files-found: warn
          retention-days: 14
