name: Migrate Telegram subscribers

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      migration_status:
        description: "Safe migration outcome"
        value: ${{ jobs.migrate.outputs.migration_status }}
      prerequisite_status:
        description: "Subscription schema prerequisite outcome"
        value: ${{ jobs.migrate.outputs.prerequisite_status }}
      migrated_count:
        description: "Number of newly inserted validated recipients"
        value: ${{ jobs.migrate.outputs.migrated_count }}
      reason:
        description: "Safe machine-readable outcome reason"
        value: ${{ jobs.migrate.outputs.reason }}

permissions:
  contents: read

concurrency:
  group: telegram-subscription-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      migration_status: ${{ steps.migration.outputs.migration_status }}
      prerequisite_status: ${{ steps.migration.outputs.prerequisite_status }}
      migrated_count: ${{ steps.migration.outputs.migrated_count }}
      reason: ${{ steps.migration.outputs.reason }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Verify prerequisites and migrate legacy recipients without sending Telegram
        id: migration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          TELEGRAM_EDITOR_CHAT_ID: "8869592162"
          PRODUCTION_SHA: ${{ vars.PRODUCTION_SHA || github.sha }}
        run: python -m src.migrate_telegram_subscribers
