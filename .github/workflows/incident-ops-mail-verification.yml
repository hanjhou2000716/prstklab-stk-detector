name: Owner-triggered incident mail verification

on:
  workflow_dispatch:
    inputs:
      confirm_send:
        description: Confirm one link-verification email to the fixed PRStK administrator mailbox
        required: true
        type: choice
        options: [no, yes]
        default: no
      verification_id:
        description: Unique 16–64 character id; reuse the same value to safely resume this verification
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: prstk-owner-mail-verification-${{ inputs.verification_id }}
  cancel-in-progress: false

jobs:
  verify-mail:
    if: inputs.confirm_send == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the trusted verification client
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Send one fixed-recipient verification email
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          INPUT_CONFIRM_SEND: ${{ inputs.confirm_send }}
          INPUT_VERIFICATION_ID: ${{ inputs.verification_id }}
          INCIDENT_OPS_URL: ${{ vars.INCIDENT_OPS_URL }}
          INCIDENT_OPS_AUDIENCE: https://prstk-incident-ops
          INCIDENT_MAIL_VERIFICATION_RESULT_PATH: ${{ runner.temp }}/incident-mail-verification.json
        run: python -m scripts.incident_ops_verify_mail
      - name: Preserve verification outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: incident-mail-verification-${{ inputs.verification_id }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/incident-mail-verification.json
          if-no-files-found: error
          retention-days: 90
