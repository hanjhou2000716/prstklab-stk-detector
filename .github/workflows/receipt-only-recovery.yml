name: Receipt-only recovery (no Telegram send)

on:
  workflow_dispatch:
    inputs:
      confirm_recovery:
        description: "I confirm this only persists an already-delivered receipt"
        required: true
        type: choice
        options: [false, true]
        default: false
      trace_id:
        description: "Existing delivery trace ID"
        required: true
        type: string
      alert_id:
        description: "Existing alert ID"
        required: true
        type: string
      release_id:
        description: "Existing release ID"
        required: true
        type: string
      snapshot_id:
        description: "Existing snapshot ID"
        required: true
        type: string
      delivery_status:
        description: "Existing delivery status"
        required: true
        type: choice
        options: [delivered, partial, failed]
        default: delivered
      delivered_count:
        description: "Existing delivered recipient count"
        required: true
        type: string
        default: "1"
      failed_count:
        description: "Existing failed recipient count"
        required: true
        type: string
        default: "0"

permissions:
  contents: read

jobs:
  recover:
    if: ${{ inputs.confirm_recovery == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RECEIPT_CALLBACK_URL: ${{ vars.RECEIPT_CALLBACK_URL }}
      DELIVERY_RECEIPT_SHARED_SECRET: ${{ secrets.DELIVERY_RECEIPT_SHARED_SECRET || secrets.RAILWAY_STATUS_SHARED_SECRET || secrets.DELIVERY_STATUS_SHARED_SECRET }}
      DELIVERY_RECEIPT_KIND: production
      TRACE_ID: ${{ inputs.trace_id }}
      ALERT_ID: ${{ inputs.alert_id }}
      RELEASE_ID: ${{ inputs.release_id }}
      SNAPSHOT_ID: ${{ inputs.snapshot_id }}
      DELIVERY_MODE: text
      DELIVERY_STATUS: ${{ inputs.delivery_status }}
      DELIVERED_COUNT: ${{ inputs.delivered_count }}
      FAILED_COUNT: ${{ inputs.failed_count }}
      FAILED_RECIPIENT_HASHES: ""
      NOTIFICATION_KEYS: ""
      RENDERER_ERROR_TYPE: not_applicable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install callback dependency
        run: python -m pip install requests
      - name: Persist existing receipt without Telegram transport
        run: python -m src.delivery_callback
