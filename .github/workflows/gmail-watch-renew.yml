name: Gmail Watch renewal (Supabase)

on:
  workflow_dispatch:
    inputs:
      force:
        description: Renew immediately even when the lease is healthy
        required: false
        default: false
        type: boolean
  schedule:
    # Gmail leases are short-lived; renew with a wide safety margin.
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: gmail-watch-renewal
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GMAIL_WATCH_TOPIC: ${{ vars.GMAIL_WATCH_TOPIC }}
      GMAIL_WATCH_LABEL_IDS: ${{ vars.GMAIL_WATCH_LABEL_IDS || 'INBOX' }}
      GMAIL_OAUTH_STATE: ${{ vars.GMAIL_OAUTH_STATE || 'configured' }}
      GMAIL_PUBSUB_AUDIENCE: ${{ vars.GMAIL_PUBSUB_AUDIENCE }}
      GMAIL_PUBSUB_SERVICE_ACCOUNT: ${{ vars.GMAIL_PUBSUB_SERVICE_ACCOUNT }}
      GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
      GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      GMAIL_WATCH_RENEWAL_MARGIN_HOURS: "24"
      GMAIL_WATCH_RETRY_COOLDOWN_MINUTES: "30"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: railway-monitor/requirements.txt
      - name: Install Gmail gateway dependencies
        run: python -m pip install -r railway-monitor/requirements.txt
      - name: Renew Watch without Railway storage
        env:
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          args=()
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python scripts/renew_gmail_watch_supabase.py "${args[@]}" | tee gmail-watch-result.json
      - name: Publish safe summary
        if: always()
        run: |
          echo "## Gmail Watch (Supabase state)" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path("gmail-watch-result.json")
          if path.is_file():
              value = json.loads(path.read_text(encoding="utf-8"))
              print(f"- status: {value.get('status', 'unknown')}")
              print(f"- renewed: {value.get('renewed', False)}")
              print(f"- expiration: {value.get('watch_expiration', 'none')}")
              if value.get("missing"): print("- configuration: incomplete (names only)")
              if value.get("error"): print(f"- error class: {value['error']}")
          else:
              print("- result: unavailable")
          PY
