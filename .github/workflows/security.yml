name: Security and supply-chain checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@85689a103d1234521562bbb736b2c4a31c9a85d5 # v4.37.5
        with:
          languages: python
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@85689a103d1234521562bbb736b2c4a31c9a85d5 # v4.37.5
        with:
          category: "/language:python"

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate SBOM
        # v0.24.0 uses the maintained Node 24 runner and current Syft
        # bootstrap path.  Keep the commit pinned so supply-chain checks
        # remain reproducible while avoiding the retired v0.17 bootstrap.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: prstk-sbom.cdx.json
          output-file: prstk-sbom.cdx.json
