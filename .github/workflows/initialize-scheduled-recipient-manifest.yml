name: Initialize scheduled recipient manifest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initialize:
    name: Read active subscribers and print sanitized manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install the shared subscription resolver dependency
        run: python -m pip install -r requirements-production.txt
      - name: Generate hashed recipient manifest (read-only; no Telegram credentials)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CURRENT_SCHEDULED_RECIPIENT_SET_MANIFEST: ${{ vars.SCHEDULED_RECIPIENT_SET_MANIFEST || '' }}
        run: python -m scripts.initialize_scheduled_recipient_manifest
