name: Price Action walk-forward backtest
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: Yahoo Finance symbol, for example 2330.TW or NVDA
        required: true
        default: '2330.TW'
      market:
        description: Cost model market
        type: choice
        required: true
        default: taiwan
        options: [taiwan, us]
      period:
        description: Public daily-history range
        required: true
        default: '5y'
      max_holding_days:
        description: Maximum research holding days per signal
        required: true
        default: '60'
      free_roll:
        description: Enable 5R half-exit and cost-boundary research mode
        type: boolean
        required: true
        default: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - run: python -m src.run_price_action_backtest --symbol '${{ inputs.symbol }}' --market '${{ inputs.market }}' --period '${{ inputs.period }}' --max-holding-days '${{ inputs.max_holding_days }}' ${{ inputs.free_roll && '--free-roll' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: price-action-backtest-${{ inputs.symbol }}
          path: data/price-action-backtest*
