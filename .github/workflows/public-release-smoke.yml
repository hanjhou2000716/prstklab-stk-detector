name: Public release smoke check

on:
  workflow_dispatch:
    inputs:
      public_url:
        description: "Public Pages base URL"
        required: true
        type: string
      expected_snapshot_id:
        description: "Optional prepared market snapshot ID"
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install release-gate dependencies
        run: pip install -r requirements.txt
      - name: Restore immutable data release for local gate
        run: |
          # The workflow checks the exact release that is publicly served.  A
          # checkout of main only contains a placeholder site/data tree, so
          # seed the local gate from the same immutable data-release branch
          # used by the Pages publisher.  This step is read-only with respect
          # to GitHub and never has Telegram credentials or delivery steps.
          git fetch --no-tags origin refs/heads/data-release:refs/remotes/origin/data-release
          python -m src.data_release --restore --branch data-release --include site/data
          git restore --source=origin/data-release --worktree -- site/data/
      - name: Verify public release (no delivery)
        run: >-
          python -m src.public_release_smoke
          --public-url "${{ inputs.public_url }}"
          ${{ inputs.expected_snapshot_id != '' && format('--expected-snapshot-id "{0}"', inputs.expected_snapshot_id) || '' }}
