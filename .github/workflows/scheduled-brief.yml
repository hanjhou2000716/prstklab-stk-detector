name: Scheduled market brief

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "快報時段；auto 依台灣時間判斷"
        required: false
        default: auto
        type: choice
        options: [auto, morning, pre_open, intraday, midday, afternoon, post_close, us_premarket, us_open]
      force:
        description: "略過同時段重複推播保護（僅供人工測試）"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [scheduled-brief]
  schedule:
    # UTC；以下時間均對應台灣時間週一至週五。
    - cron: "0 22 * * 0-4"  # 06:00 晨報（前一日 UTC）
    - cron: "45 0 * * 1-5"  # 08:45 盤前
    - cron: "0 2 * * 1-5"   # 10:00 盤中
    - cron: "45 3 * * 1-5"  # 11:45 午報
    - cron: "15 5 * * 1-5"  # 13:15 午盤
    - cron: "45 6 * * 1-5"  # 14:45 盤後，保留完整全市場研究處理窗口
    - cron: "0 13 * * 1-5"  # 21:00，美股盤前（全年固定台灣時間）

permissions:
  contents: write
  pages: write
  id-token: write

# All workflows that refresh committed dashboard data share one writer lock.
# This prevents concurrent runs from racing on pushes to main.
concurrency:
  group: main-data-writer
  cancel-in-progress: false

# Serialize all runs and all other workflows that write committed dashboard
# data. The immutable cache below still records a completed date/slot, so an
# external Cron retry cannot send a second message after the primary run.

jobs:
  refresh-notify-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      RAILWAY_STATUS_URL: ${{ vars.RAILWAY_STATUS_URL }}
      RAILWAY_STATUS_SHARED_SECRET: ${{ secrets.RAILWAY_STATUS_SHARED_SECRET }}
      SLOT: ${{ inputs.slot || github.event.client_payload.slot || 'auto' }}
      FORCE: ${{ inputs.force || github.event.client_payload.force || 'false' }}
      STRICT_WINDOW: ${{ github.event_name == 'workflow_dispatch' && 'false' || 'true' }}
      NEWS_CACHE_PATH: site/data/news-cache.json
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安裝相依套件
        run: pip install -r requirements.txt
      - name: 建立快報時段識別碼
        id: window
        run: |
          arguments=(--slot "$SLOT" --print-window)
          if [ "$STRICT_WINDOW" = "true" ]; then
            arguments+=(--strict-window)
          fi
          python -m src.scheduled_brief "${arguments[@]}" >> "$GITHUB_OUTPUT"
      - name: 讀取同時段推播紀錄
        if: steps.window.outputs.should_run == 'true' && env.FORCE != 'true'
        id: idempotency
        uses: actions/cache/restore@v4
        with:
          path: .scheduled-brief-lock
          key: scheduled-brief-${{ steps.window.outputs.key }}
      - name: 更新資料並發送快報
        id: send_brief
        if: steps.window.outputs.should_run == 'true' && (env.FORCE == 'true' || steps.idempotency.outputs.cache-hit != 'true')
        run: |
          arguments=(--slot "$SLOT")
          if [ "$STRICT_WINDOW" = "true" ]; then
            arguments+=(--strict-window)
          fi
          python -m src.scheduled_brief "${arguments[@]}"
      - name: Persist scheduled-brief delivery receipt to Railway
        if: always() && steps.send_brief.outputs.sent == 'true'
        continue-on-error: true
        env:
          TRACE_ID: ${{ steps.send_brief.outputs.trace_id }}
          DELIVERY_STATUS: ${{ steps.send_brief.outputs.delivery_status }}
          DELIVERED_COUNT: ${{ steps.send_brief.outputs.delivered_count }}
          FAILED_COUNT: ${{ steps.send_brief.outputs.failed_count }}
          FAILED_RECIPIENT_HASHES: ""
        run: python -m src.delivery_callback
      - name: 建立價格／事件共用去重紀錄
        if: success() && steps.send_brief.outputs.event_key != ''
        run: touch .official-event-lock
      - name: 保存價格／事件共用去重紀錄
        if: success() && steps.send_brief.outputs.event_key != ''
        uses: actions/cache/save@v4
        with:
          path: .official-event-lock
          key: official-event-${{ steps.send_brief.outputs.event_key }}
      - name: 保存最新市場快照
        if: steps.window.outputs.should_run == 'true' && (env.FORCE == 'true' || steps.idempotency.outputs.cache-hit != 'true')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m src.release_manifest || test $? -eq 1
          git add site/data/market.json site/data/news-cache.json site/data/release-manifest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh public market snapshot"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "無法在三次嘗試內回存市場快照。"
              exit 1
            fi

            git fetch origin main
            git rebase --autostash -X theirs origin/main
          done
      - name: 建立同時段推播紀錄
        if: success() && steps.window.outputs.should_run == 'true' && env.FORCE != 'true' && steps.idempotency.outputs.cache-hit != 'true'
        run: touch .scheduled-brief-lock
      - name: 保存同時段推播紀錄
        if: success() && steps.window.outputs.should_run == 'true' && env.FORCE != 'true' && steps.idempotency.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .scheduled-brief-lock
          key: scheduled-brief-${{ steps.window.outputs.key }}
      # The lock deduplicates the Telegram notification, not the dashboard
      # deployment. A research report may have been committed after the first
      # same-slot brief, so every accepted run must publish current main.
      - name: 設定 GitHub Pages
        if: steps.window.outputs.should_run == 'true'
        uses: actions/configure-pages@v5
      - name: 上傳儀表板
        if: steps.window.outputs.should_run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: 部署
        if: steps.window.outputs.should_run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
