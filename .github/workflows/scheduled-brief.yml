name: Scheduled market brief

on:
  workflow_dispatch:
    inputs:
      slot:
        description: Briefing slot
        required: false
        default: auto
        type: choice
        options: [auto, morning, pre_open, intraday, midday, afternoon, post_close, us_premarket, us_open]
      force:
        description: Force a duplicate slot run
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [scheduled-brief]
  schedule:
    - cron: "0 22 * * 0-4"
    - cron: "45 0 * * 1-5"
    - cron: "0 2 * * 1-5"
    - cron: "45 3 * * 1-5"
    - cron: "15 5 * * 1-5"
    - cron: "45 6 * * 1-5"
    - cron: "0 13 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: main-data-writer
  cancel-in-progress: false

# The lock deduplicates the Telegram notification, not the dashboard publication.

jobs:
  refresh-notify-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      RAILWAY_STATUS_URL: ${{ vars.RAILWAY_STATUS_URL }}
      RAILWAY_STATUS_SHARED_SECRET: ${{ secrets.RAILWAY_STATUS_SHARED_SECRET }}
      SLOT: ${{ inputs.slot || github.event.client_payload.slot || 'auto' }}
      FORCE: ${{ inputs.force || github.event.client_payload.force || 'false' }}
      STRICT_WINDOW: ${{ github.event_name == 'workflow_dispatch' && 'false' || 'true' }}
      NEWS_CACHE_PATH: site/data/news-cache.json
      SNAPSHOT_PATH: site/data/market.json
      MANIFEST_PATH: site/data/release-manifest.json
      DATA_RELEASE_BRANCH: data-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last immutable data release
        run: python -m src.data_release --restore --branch "$DATA_RELEASE_BRANCH" --include site/data
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Resolve scheduled slot
        id: window
        run: |
          arguments=(--slot "$SLOT" --print-window)
          if [ "$STRICT_WINDOW" = "true" ]; then arguments+=(--strict-window); fi
          python -m src.scheduled_brief "${arguments[@]}" >> "$GITHUB_OUTPUT"
      - name: Restore scheduled idempotency lock
        if: steps.window.outputs.should_run == 'true' && env.FORCE != 'true'
        id: idempotency
        uses: actions/cache/restore@v4
        with:
          path: .scheduled-brief-lock
          key: scheduled-brief-${{ steps.window.outputs.key }}
      - name: Prepare immutable market snapshot
        if: steps.window.outputs.should_run == 'true' && (env.FORCE == 'true' || steps.idempotency.outputs.cache-hit != 'true')
        id: prepare
        run: python -m src.scheduled_delivery --slot "${{ steps.window.outputs.slot }}" --prepare-only --snapshot "$SNAPSHOT_PATH" >> "$GITHUB_OUTPUT"
      - name: Build release manifest
        if: steps.prepare.outputs.prepared == 'true'
        run: python -m src.release_manifest
      - name: Publish snapshot and manifest
        if: steps.prepare.outputs.prepared == 'true'
        run: |
          python -m src.data_release --publish --branch "$DATA_RELEASE_BRANCH" --include site/data \
            --message "chore: refresh public market snapshot"
      - name: Configure GitHub Pages
        if: steps.prepare.outputs.prepared == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.prepare.outputs.prepared == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        if: steps.prepare.outputs.prepared == 'true'
        id: deployment
        uses: ./.github/actions/deploy-pages-retry
      - name: Verify deployed release before delivery
        if: steps.prepare.outputs.prepared == 'true' && steps.deployment.outputs.available == 'true'
        continue-on-error: true
        id: release_gate
        run: |
          python -m src.release_gate \
            --manifest "$MANIFEST_PATH" \
            --expected-snapshot-id "${{ steps.prepare.outputs.snapshot_id }}" \
            --public-url "${{ steps.deployment.outputs.page_url }}" \
            --public-attempts 12 \
            --public-delay 5 \
            >> "$GITHUB_OUTPUT"
      - name: Record delivery gate when Pages is unavailable
        if: steps.prepare.outputs.prepared == 'true' && steps.deployment.outputs.available != 'true'
        run: echo "Pages unavailable; Telegram delivery intentionally skipped (fail closed)."
      - name: Send Telegram brief after successful publication
        if: steps.release_gate.outputs.allowed == 'true'
        id: send_brief
        run: python -m src.scheduled_delivery --slot "${{ steps.window.outputs.slot }}" --send-only --snapshot "$SNAPSHOT_PATH" --manifest "$MANIFEST_PATH" --public-url "${{ steps.deployment.outputs.page_url }}"
      - name: Persist scheduled-brief delivery receipt to Railway
        if: always() && steps.send_brief.outputs.sent == 'true'
        continue-on-error: true
        env:
          TRACE_ID: ${{ steps.send_brief.outputs.trace_id }}
          RELEASE_ID: ${{ steps.send_brief.outputs.release_id }}
          SNAPSHOT_ID: ${{ steps.send_brief.outputs.snapshot_id }}
          DELIVERY_STATUS: ${{ steps.send_brief.outputs.delivery_status }}
          DELIVERED_COUNT: ${{ steps.send_brief.outputs.delivered_count }}
          FAILED_COUNT: ${{ steps.send_brief.outputs.failed_count }}
          FAILED_RECIPIENT_HASHES: ""
        run: python -m src.delivery_callback
      - name: Save event delivery lock
        if: success() && steps.send_brief.outputs.event_key != ''
        run: touch .official-event-lock
      - name: Persist event delivery lock
        if: success() && steps.send_brief.outputs.event_key != ''
        uses: actions/cache/save@v4
        with:
          path: .official-event-lock
          key: official-event-${{ steps.send_brief.outputs.event_key }}
      - name: Save scheduled idempotency lock
        if: success() && steps.prepare.outputs.prepared == 'true' && (env.FORCE == 'true' || steps.idempotency.outputs.cache-hit != 'true') && steps.send_brief.outputs.sent == 'true'
        run: touch .scheduled-brief-lock
      - name: Persist scheduled idempotency lock
        if: success() && steps.prepare.outputs.prepared == 'true' && (env.FORCE == 'true' || steps.idempotency.outputs.cache-hit != 'true') && steps.send_brief.outputs.sent == 'true'
        uses: actions/cache/save@v4
        with:
          path: .scheduled-brief-lock
          key: scheduled-brief-${{ steps.window.outputs.key }}

# - name: 設定 GitHub Pages
