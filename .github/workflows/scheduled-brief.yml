name: Scheduled market brief

on:
  workflow_dispatch:
    inputs:
      slot:
        description: Briefing slot
        required: false
        default: auto
        type: choice
        options: [auto, morning, pre_open, post_close, us_premarket]
      force:
        description: Force a duplicate slot run
        required: false
        default: false
        type: boolean
      notify:
        description: Allow Telegram/Creator notifications for this manual run
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [scheduled-brief]
  schedule:
    - cron: "0 22 * * *"
    - cron: "45 0 * * 1-5"
    - cron: "20 6 * * 1-5"
    - cron: "0 13 * * 1-5"
    - cron: "0 14 * * 1-5"

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  # GitHub keeps only one pending run per concurrency group.  A unique key
  # avoids silently replacing a pending writer; the queue step below provides
  # deterministic single-writer serialization across all production writers.
  group: main-data-writer-${{ github.run_id }}
  cancel-in-progress: false

# The lock deduplicates the Telegram notification, not the dashboard publication.

jobs:
  refresh-notify-deploy:
    # The Pages retry action exposes temporary unavailability through outputs;
    # release-gate failures remain hard failures and block notification.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      RECEIPT_CALLBACK_URL: ${{ vars.RECEIPT_CALLBACK_URL }}
      RAILWAY_STATUS_URL: ${{ vars.RAILWAY_STATUS_URL }}
      # Optional authenticated sanitized Gmail/FJ export.  When omitted,
      # the client derives /external-observations from RAILWAY_STATUS_URL.
      RAILWAY_OBSERVATIONS_URL: ${{ vars.RAILWAY_OBSERVATIONS_URL }}
      # Canonical zero-cost replacement; takes precedence over Railway.
      PUBLIC_OBSERVATIONS_URL: ${{ vars.PUBLIC_OBSERVATIONS_URL }}
      SLOT: ${{ inputs.slot || github.event.client_payload.scheduled_slot || github.event.client_payload.slot || 'auto' }}
      SCHEDULE_CRON: ${{ github.event.schedule || '' }}
      SCHEDULED_FOR_AT: ${{ github.event.client_payload.scheduled_for_at || '' }}
      DISPATCH_UNIX: ${{ github.event.client_payload.dispatch_unix || '' }}
      DISPATCH_TRACE_ID: ${{ github.event.client_payload.trace_id || '' }}
      SCHEDULE_CONTRACT_VERSION: ${{ github.event.client_payload.schedule_contract_version || github.event.client_payload.contract_version || '' }}
      SCHEDULE_TIME_ZONE: ${{ github.event.client_payload.time_zone || '' }}
      FORCE: ${{ inputs.force || github.event.client_payload.force || 'false' }}
      # Manual runs publish and verify by default but never send production
      # notifications unless the operator explicitly opts in. Scheduled runs
      # retain the established notification behavior.
      # Scheduled cron and trusted backup repository_dispatch runs are both
      # automatic notification intents.  Manual workflow_dispatch remains
      # opt-in through inputs.notify.
      NOTIFY: ${{ github.event_name == 'workflow_dispatch' && (inputs.notify == true && 'true' || 'false') || github.event_name == 'repository_dispatch' && (github.event.client_payload.notify == false || github.event.client_payload.notify == 'false') && 'false' || 'true' }}
      # Automatic runs resolve the slot from github.event.schedule.  The
      # runner start time is not a valid reason to suppress a delayed cron.
      # Manual runs resolve to the most recent fixed Taipei-time boundary;
      # stale workflow inputs must not publish the wrong report name.
      STRICT_WINDOW: 'false'
      NEWS_CACHE_PATH: site/data/news-cache.json
      SNAPSHOT_PATH: site/data/market.json
      MANIFEST_PATH: site/data/release-manifest.json
      DATA_RELEASE_BRANCH: data-release
      # Optional path to an already-sanitized Creator Insight records file.
      # Keep it outside site/ so raw ingress material can never be uploaded
      # as part of the Pages artifact.
      CREATOR_RECORDS_PATH: ${{ vars.CREATOR_RECORDS_PATH || 'creator/public-records.json' }}
      # Creator feeds are retired.  Keep the variable name for compatibility,
      # but make the production workflow hard-stop even if a stale repository
      # variable or an older in-flight run still says true.
      CREATOR_NOTIFICATION_ENABLED: 'false'
      CREATOR_MEDIA_ROOT: ${{ vars.CREATOR_MEDIA_ROOT }}
      CREATOR_DELIVERY_RECEIPTS_PATH: /tmp/prstk-creator-delivery-receipts.json
      # Railway/Gmail may publish only a reviewed, sanitized observation
      # bundle. Raw mail and transport identifiers are rejected by the
      # scheduled publisher and never enter site/data.
      EXTERNAL_OBSERVATIONS_PATH: ${{ vars.EXTERNAL_OBSERVATIONS_PATH }}
      # Private market last-known-good store. Collection may read/write only
      # normalized observations; it is never uploaded to Pages.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MARKET_BACKUP_ENABLED: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install production text-delivery dependencies
        run: pip install -r requirements-production.txt
      - name: Install Chromium for formal card renderer
        run: python -m playwright install --with-deps chromium
      - name: Resolve scheduled slot
        id: window
        run: |
          arguments=(--slot "$SLOT" --print-window)
          arguments+=(--trigger-kind "$GITHUB_EVENT_NAME")
          if [ "$STRICT_WINDOW" = "true" ]; then arguments+=(--strict-window); fi
          if [ -n "$SCHEDULE_CRON" ]; then arguments+=(--scheduled-cron "$SCHEDULE_CRON"); fi
          if [ -n "$SCHEDULED_FOR_AT" ]; then arguments+=(--scheduled-for "$SCHEDULED_FOR_AT"); fi
          if [ -n "$DISPATCH_UNIX" ]; then arguments+=(--dispatch-unix "$DISPATCH_UNIX"); fi
          if [ -n "$DISPATCH_TRACE_ID" ]; then arguments+=(--dispatch-trace-id "$DISPATCH_TRACE_ID"); fi
          arguments+=(--schedule-contract-version "$SCHEDULE_CONTRACT_VERSION" --time-zone "$SCHEDULE_TIME_ZONE")
          python -m src.scheduled_brief "${arguments[@]}" >> "$GITHUB_OUTPUT"
      - name: Wait for production writer queue
        id: writer_queue
        if: steps.window.outputs.should_run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m src.writer_queue
      - name: Prepare immutable market snapshot
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.window.outputs.should_run == 'true'
        id: prepare
        continue-on-error: true
        env:
          PUBLIC_OBSERVATIONS_SHARED_SECRET: ${{ secrets['DELIVERY_RECEIPT_SHARED_SECRET'] || secrets['RAILWAY_STATUS_SHARED_SECRET'] || secrets['DELIVERY_STATUS_SHARED_SECRET'] }}
          SLOT_CONTEXT: ${{ steps.window.outputs.context_json }}
        run: |
          set -euo pipefail
          attempt_output="$(mktemp)"
          trap 'rm -f "$attempt_output"' EXIT
          restore_latest() {
            python -m src.data_release --restore --branch "$DATA_RELEASE_BRANCH" --include site/data
            git fetch --no-tags origin "refs/heads/${DATA_RELEASE_BRANCH}:refs/remotes/origin/${DATA_RELEASE_BRANCH}"
          }
          for attempt in 1 2; do
            : > "$attempt_output"
            restore_latest
            base_sha="$(git rev-parse "refs/remotes/origin/${DATA_RELEASE_BRANCH}")"
            GITHUB_OUTPUT="$attempt_output" python -m src.scheduled_delivery \
              --slot "${{ steps.window.outputs.slot }}" --prepare-only \
              --slot-context "$SLOT_CONTEXT" --notification-requested "$NOTIFY" \
              --snapshot "$SNAPSHOT_PATH"
            git fetch --no-tags origin "refs/heads/${DATA_RELEASE_BRANCH}:refs/remotes/origin/${DATA_RELEASE_BRANCH}"
            current_sha="$(git rev-parse "refs/remotes/origin/${DATA_RELEASE_BRANCH}")"
            if [ "$current_sha" = "$base_sha" ]; then
              cat "$attempt_output" >> "$GITHUB_OUTPUT"
              {
                echo "data_release_sha=$base_sha"
                echo "base_current=true"
                echo "rebuild_attempts=$((attempt - 1))"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Base revision changed during same-slot preparation (attempt $attempt/2)."
            if [ "$attempt" -eq 2 ]; then
              {
                echo "data_release_sha=$base_sha"
                echo "base_current=false"
                echo "rebuild_attempts=1"
                echo "prepared=false"
                echo "reason=base_changed_twice_during_prepare"
                echo "notification_expected=true"
              } >> "$GITHUB_OUTPUT"
              exit 1
            fi
          done
      - name: Revalidate prepared release base
        id: prepared_release
        if: steps.writer_queue.outputs.should_continue == 'true'
        run: |
          git fetch --no-tags origin "refs/heads/${DATA_RELEASE_BRANCH}:refs/remotes/origin/${DATA_RELEASE_BRANCH}"
          current_sha="$(git rev-parse "refs/remotes/origin/${DATA_RELEASE_BRANCH}")"
          if [ "${{ steps.prepare.outputs.base_current }}" != "true" ] || [ "$current_sha" != "${{ steps.prepare.outputs.data_release_sha }}" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "reason=prepared_base_changed_after_bounded_rebuild" >> "$GITHUB_OUTPUT"
            echo "::error::Prepared snapshot did not retain the current immutable base after one bounded rebuild."
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "reason=prepared_release_current" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore scheduled idempotency lock
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.window.outputs.should_run == 'true' && env.FORCE != 'true'
        id: idempotency
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: .scheduled-brief-lock
          key: scheduled-brief-${{ steps.window.outputs.key }}
      - name: Build release manifest
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.prepare.outputs.prepared == 'true'
        id: release_manifest
        run: |
          arguments=(
            --allow-stale-research
            --research-fallback-reason "research scan incomplete; preserving last-known-good research snapshot"
          )
          # Prefer the sanitized Creator projection bound into the prepared
          # snapshot.  This lets reviewed Railway/Gmail Creator rows reach the
          # same release gate as the checked-in fallback without copying raw
          # mail or private transport identifiers into Pages.
          creator_records_path="/tmp/prstk-creator-records.json"
          python - "$SNAPSHOT_PATH" "$creator_records_path" <<'PY'
          import json
          import sys
          from pathlib import Path
          snapshot = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          rows = snapshot.get("creator_insights") if isinstance(snapshot, dict) else None
          if not isinstance(rows, list):
              rows = []
          Path(sys.argv[2]).write_text(json.dumps({"records": rows}, ensure_ascii=False), encoding="utf-8")
          PY
          if [ -s "$creator_records_path" ]; then
            arguments+=(--creator-records "$creator_records_path")
          elif [ -n "${CREATOR_RECORDS_PATH:-}" ] && [ -f "$CREATOR_RECORDS_PATH" ]; then
            arguments+=(--creator-records "$CREATOR_RECORDS_PATH")
          fi
          if [ "${{ steps.window.outputs.slot }}" = "morning" ]; then
            arguments+=(--creator-morning-batch)
          fi
          set +e
          python -m src.release_manifest "${arguments[@]}"
          manifest_status=$?
          set -e
          if [ -f "$MANIFEST_PATH" ]; then
            python - "$MANIFEST_PATH" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path
          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(f"manifest_status={manifest.get('status', 'invalid')}")
          print(f"release_id={manifest.get('release_id', '')}")
          print(f"market_snapshot_id={manifest.get('market_snapshot_id', '')}")
          print(f"alert_projection_status={manifest.get('alert_projection_status', 'unknown')}")
          print(f"quarantined_alert_count={manifest.get('quarantined_alert_count', 0)}")
          print("quarantined_alert_reasons=" + ",".join(str(item) for item in manifest.get("quarantined_alert_reasons", []) if str(item).strip()))
          print("fatal_alert_contract_errors=" + ";".join(str(item) for item in manifest.get("fatal_alert_contract_errors", []) if str(item).strip()))
          PY
          fi
          exit "$manifest_status"
      - name: Capture private release preflight diagnostics
        if: always()
        env:
          PRODUCTION_SHA: ${{ steps.prepare.outputs.data_release_sha }}
        run: >-
          python -m src.release_diagnostics
          --snapshot "$SNAPSHOT_PATH"
          --manifest "$MANIFEST_PATH"
          --output "/tmp/prstk-release-preflight-${GITHUB_RUN_ID}.json"
          --slot "${{ steps.window.outputs.slot || env.SLOT }}"
      - name: Upload private release preflight diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scheduled-release-preflight-${{ github.run_id }}
          path: /tmp/prstk-release-preflight-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Resolve release publication policy
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.prepare.outputs.prepared == 'true'
        id: release_policy
        env:
          RELEASE_MANIFEST_PATH: ${{ env.MANIFEST_PATH }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path(os.environ["RELEASE_MANIFEST_PATH"]).read_text(encoding="utf-8"))
          # Publication and research delivery are separate gates.  A ready
          # release may safely publish fresh market/event/creator artifacts
          # while carrying an explicitly marked stale research fallback.  The
          # research policy below still blocks Telegram research delivery
          # unless the research artifact is fresh.
          publish = manifest.get("status") in {"ready", "ready_with_quarantine"}
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"publish={'true' if publish else 'false'}\n")
          if not publish:
              print("::warning::Release manifest is not ready; preserving the previous immutable release.")
          PY
      - name: Publish snapshot and manifest
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.prepare.outputs.prepared == 'true' && steps.release_policy.outputs.publish == 'true'
        id: publish_snapshot
        env:
          RELEASE_ID: ${{ steps.release_manifest.outputs.release_id }}
        run: |
          python -m src.data_release --publish --branch "$DATA_RELEASE_BRANCH" --include site/data \
            --message "chore: refresh public market snapshot"
          git fetch --no-tags origin "refs/heads/${DATA_RELEASE_BRANCH}:refs/remotes/origin/${DATA_RELEASE_BRANCH}"
          printf 'data_release_sha=%s\n' "$(git rev-parse "refs/remotes/origin/${DATA_RELEASE_BRANCH}")" >> "$GITHUB_OUTPUT"
          python -m src.pages_deployment \
            --mode derive-version \
            --source-revision "$GITHUB_SHA" \
            --release-id "$RELEASE_ID" \
            >> "$GITHUB_OUTPUT"
      - name: Build and validate cache-busted static assets
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.prepare.outputs.prepared == 'true' && steps.release_policy.outputs.publish == 'true'
        run: |
          python -m src.build_assets --root site --build-sha "$GITHUB_SHA"
          python -m src.asset_contract --root site
      - name: Verify immutable local release bundle before upload
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.prepare.outputs.prepared == 'true' && steps.release_policy.outputs.publish == 'true'
        run: python -m src.release_manifest --verify-only --root . --output "$MANIFEST_PATH"
      - name: Configure GitHub Pages
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.prepare.outputs.prepared == 'true' && steps.release_policy.outputs.publish == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload Pages artifact
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.prepare.outputs.prepared == 'true' && steps.release_policy.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
      - name: Deploy Pages
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.prepare.outputs.prepared == 'true' && steps.release_policy.outputs.publish == 'true'
        id: deployment
        uses: ./.github/actions/deploy-pages-retry
        with:
          build_version: ${{ steps.publish_snapshot.outputs.pages_build_version }}
          fallback_url: ${{ env.DASHBOARD_URL }}
      - name: Verify completed Pages deployment identity
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.prepare.outputs.prepared == 'true' && steps.release_policy.outputs.publish == 'true' && steps.deployment.outputs.available == 'true'
        id: deployment_identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -m src.pages_deployment
          --mode verify
          --expected-build-version "${{ steps.publish_snapshot.outputs.pages_build_version }}"
          --deployment-id "${{ steps.deployment.outputs.deployment_id }}"
          --status-url "${{ steps.deployment.outputs.deployment_status_url }}"
          >> "$GITHUB_OUTPUT"
      - name: Resolve research delivery policy
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.prepare.outputs.prepared == 'true' && steps.release_policy.outputs.publish == 'true'
        id: research_policy
        env:
          RELEASE_MANIFEST_PATH: ${{ env.MANIFEST_PATH }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path(os.environ["RELEASE_MANIFEST_PATH"]).read_text(encoding="utf-8"))
          freshness = manifest.get("research_freshness")
          include_research = freshness == "fresh"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"research_freshness={freshness or 'unknown'}\n")
              output.write(f"include_research={'true' if include_research else 'false'}\n")
              output.write("allow_telegram=true\n")
          if not include_research:
              print("::warning::Research is stale or unverified; market delivery continues without research claims.")
          PY
      - name: Verify deployed release before delivery
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.prepare.outputs.prepared == 'true' && steps.release_policy.outputs.publish == 'true' && steps.deployment.outputs.available == 'true' && steps.deployment_identity.outputs.verified == 'true'
        id: release_gate
        run: |
          arguments=(--manifest "$MANIFEST_PATH" --expected-release-id "${{ steps.release_manifest.outputs.release_id }}" --expected-snapshot-id "${{ steps.prepare.outputs.snapshot_id }}" --public-url "${{ steps.deployment.outputs.page_url }}" --deployment-id "${{ steps.deployment_identity.outputs.deployment_id }}" --expected-notification-id "${{ steps.prepare.outputs.notification_id }}" --expected-alert-snapshot-id "${{ steps.prepare.outputs.snapshot_id }}" --expected-alert-observation-id "${{ steps.prepare.outputs.observation_id }}" --public-timeout-seconds 180 --public-delay 2 --public-max-delay 20)
          python -m src.release_gate "${arguments[@]}" >> "$GITHUB_OUTPUT"
      - name: Record release gate diagnostics
        if: always()
        env:
          RELEASE_GATE_OUTCOME: ${{ steps.release_gate.outcome || 'not_run' }}
          RELEASE_GATE_ALLOWED: ${{ steps.release_gate.outputs.allowed || 'false' }}
          RELEASE_GATE_STATUS: ${{ steps.release_gate.outputs.gate_status || 'not_run' }}
          RELEASE_GATE_ERROR_CATEGORY: ${{ steps.release_gate.outputs.error_category || '' }}
          RELEASE_GATE_ERRORS: ${{ steps.release_gate.outputs.errors || '' }}
          RELEASE_GATE_EXPECTED_RELEASE_ID: ${{ steps.release_gate.outputs.expected_release_id || '' }}
          RELEASE_GATE_ACTUAL_RELEASE_ID: ${{ steps.release_gate.outputs.actual_release_id || '' }}
          RELEASE_GATE_EXPECTED_SNAPSHOT_ID: ${{ steps.release_gate.outputs.expected_snapshot_id || '' }}
          RELEASE_GATE_ACTUAL_SNAPSHOT_ID: ${{ steps.release_gate.outputs.actual_snapshot_id || '' }}
          RELEASE_GATE_DEPLOYMENT_ID: ${{ steps.release_gate.outputs.deployment_id || steps.deployment_identity.outputs.deployment_id || '' }}
          RELEASE_GATE_MANIFEST_URL: ${{ steps.release_gate.outputs.manifest_url || '' }}
          RELEASE_GATE_HTTP_STATUS: ${{ steps.release_gate.outputs.http_status || '' }}
          RELEASE_GATE_ATTEMPTS: ${{ steps.release_gate.outputs.attempts || '[]' }}
          RELEASE_GATE_ELAPSED_SECONDS: ${{ steps.release_gate.outputs.elapsed_seconds || '0' }}
        run: |
          {
            echo "## Release gate diagnostics"
            echo "- outcome: ${RELEASE_GATE_OUTCOME}"
            echo "- allowed: ${RELEASE_GATE_ALLOWED}"
            echo "- gate_status: ${RELEASE_GATE_STATUS}"
            echo "- error_category: ${RELEASE_GATE_ERROR_CATEGORY:-none}"
            echo "- expected_release_id: ${RELEASE_GATE_EXPECTED_RELEASE_ID:-unknown}"
            echo "- actual_release_id: ${RELEASE_GATE_ACTUAL_RELEASE_ID:-unknown}"
            echo "- expected_snapshot_id: ${RELEASE_GATE_EXPECTED_SNAPSHOT_ID:-unknown}"
            echo "- actual_snapshot_id: ${RELEASE_GATE_ACTUAL_SNAPSHOT_ID:-unknown}"
            echo "- pages_deployment_id: ${RELEASE_GATE_DEPLOYMENT_ID:-unknown}"
            echo "- manifest_url: ${RELEASE_GATE_MANIFEST_URL:-unknown}"
            echo "- http_status: ${RELEASE_GATE_HTTP_STATUS:-unknown}"
            echo "- attempts: ${RELEASE_GATE_ATTEMPTS}"
            echo "- elapsed_seconds: ${RELEASE_GATE_ELAPSED_SECONDS}"
            echo "- errors: ${RELEASE_GATE_ERRORS:-none}"
            echo "- delivery policy: claim and sender require allowed=true"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save release gate diagnostics
        if: always()
        env:
          RELEASE_GATE_OUTCOME: ${{ steps.release_gate.outcome || 'not_run' }}
          RELEASE_GATE_ALLOWED: ${{ steps.release_gate.outputs.allowed || 'false' }}
          RELEASE_GATE_STATUS: ${{ steps.release_gate.outputs.gate_status || 'not_run' }}
          RELEASE_GATE_ERROR_CATEGORY: ${{ steps.release_gate.outputs.error_category || '' }}
          RELEASE_GATE_ERRORS: ${{ steps.release_gate.outputs.errors || '' }}
          RELEASE_GATE_RELEASE_ID: ${{ steps.release_gate.outputs.release_id || '' }}
          RELEASE_GATE_SNAPSHOT_ID: ${{ steps.release_gate.outputs.snapshot_id || '' }}
          RELEASE_GATE_EXPECTED_RELEASE_ID: ${{ steps.release_gate.outputs.expected_release_id || '' }}
          RELEASE_GATE_ACTUAL_RELEASE_ID: ${{ steps.release_gate.outputs.actual_release_id || '' }}
          RELEASE_GATE_EXPECTED_SNAPSHOT_ID: ${{ steps.release_gate.outputs.expected_snapshot_id || '' }}
          RELEASE_GATE_ACTUAL_SNAPSHOT_ID: ${{ steps.release_gate.outputs.actual_snapshot_id || '' }}
          RELEASE_GATE_DEPLOYMENT_ID: ${{ steps.release_gate.outputs.deployment_id || steps.deployment_identity.outputs.deployment_id || '' }}
          RELEASE_GATE_MANIFEST_URL: ${{ steps.release_gate.outputs.manifest_url || '' }}
          RELEASE_GATE_HTTP_STATUS: ${{ steps.release_gate.outputs.http_status || '' }}
          RELEASE_GATE_ATTEMPTS: ${{ steps.release_gate.outputs.attempts || '[]' }}
          RELEASE_GATE_ELAPSED_SECONDS: ${{ steps.release_gate.outputs.elapsed_seconds || '0' }}
          RELEASE_GATE_RETRYABLE: ${{ steps.release_gate.outputs.retryable || 'false' }}
          RELEASE_GATE_SUPERSEDED: ${{ steps.release_gate.outputs.superseded || 'false' }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": "1",
              "stage": "release_gate",
              "outcome": os.environ.get("RELEASE_GATE_OUTCOME", "not_run"),
              "allowed": os.environ.get("RELEASE_GATE_ALLOWED", "false") == "true",
              "gate_status": os.environ.get("RELEASE_GATE_STATUS", "not_run"),
              "error_category": os.environ.get("RELEASE_GATE_ERROR_CATEGORY", ""),
              "errors": [item for item in os.environ.get("RELEASE_GATE_ERRORS", "").split(";") if item],
              "release_id": os.environ.get("RELEASE_GATE_RELEASE_ID", ""),
              "snapshot_id": os.environ.get("RELEASE_GATE_SNAPSHOT_ID", ""),
              "expected_release_id": os.environ.get("RELEASE_GATE_EXPECTED_RELEASE_ID", ""),
              "actual_release_id": os.environ.get("RELEASE_GATE_ACTUAL_RELEASE_ID", ""),
              "expected_snapshot_id": os.environ.get("RELEASE_GATE_EXPECTED_SNAPSHOT_ID", ""),
              "actual_snapshot_id": os.environ.get("RELEASE_GATE_ACTUAL_SNAPSHOT_ID", ""),
              "deployment_id": os.environ.get("RELEASE_GATE_DEPLOYMENT_ID", ""),
              "manifest_url": os.environ.get("RELEASE_GATE_MANIFEST_URL", ""),
              "http_status": os.environ.get("RELEASE_GATE_HTTP_STATUS", ""),
              "attempts": json.loads(os.environ.get("RELEASE_GATE_ATTEMPTS", "[]")),
              "elapsed_seconds": os.environ.get("RELEASE_GATE_ELAPSED_SECONDS", "0"),
              "retryable": os.environ.get("RELEASE_GATE_RETRYABLE", "false") == "true",
              "superseded": os.environ.get("RELEASE_GATE_SUPERSEDED", "false") == "true",
              "workflow_run_id": os.environ.get("WORKFLOW_RUN_ID", ""),
              "delivery_policy": "claim_and_sender_require_allowed",
          }
          Path("release-gate-diagnostics.json").write_text(
              json.dumps(payload, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload release gate diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-gate-diagnostics-${{ github.run_id }}
          path: release-gate-diagnostics.json
          if-no-files-found: warn
          retention-days: 14
      - name: Record delivery gate when Pages is unavailable
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.prepare.outputs.prepared == 'true' && (steps.release_policy.outputs.publish != 'true' || steps.deployment.outputs.available != 'true')
        run: echo "Release is not fresh or Pages is unavailable; Telegram delivery intentionally skipped (fail closed)."
      - name: Send Telegram brief after successful publication
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.release_gate.outputs.allowed == 'true' && env.NOTIFY == 'true' && steps.window.outputs.delivery_intent == 'notify_candidate'
        id: send_brief
        env:
          # Notification credentials are scoped to this step; collection and
          # publication steps above never receive Telegram secrets.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SUBSCRIPTIONS_ENABLED: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m src.scheduled_delivery --slot "${{ steps.window.outputs.slot }}" --send-only --slot-key "${{ steps.window.outputs.key }}" --snapshot "$SNAPSHOT_PATH" --manifest "$MANIFEST_PATH" --public-url "${{ steps.deployment.outputs.page_url }}"
      - name: Publish scheduled notification decision
        if: always()
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          CANDIDATE_TYPE: ${{ steps.prepare.outputs.candidate_type || 'none' }}
          NOTIFICATION_EXPECTED_VALUE: ${{ steps.prepare.outputs.notification_expected || 'false' }}
          NOTIFICATION_REQUESTED: ${{ env.NOTIFY }}
          PUBLISH_REQUESTED: ${{ steps.release_policy.outputs.publish || 'false' }}
          SEND_STATUS: ${{ steps.send_brief.outputs.notification_status || '' }}
          SEND_REASON: ${{ steps.send_brief.outputs.reason || '' }}
          WINDOW_CONTRACT_STATUS: ${{ steps.window.outputs.contract_status || 'not_applicable' }}
          WINDOW_DELIVERY_INTENT: ${{ steps.window.outputs.delivery_intent || '' }}
          WINDOW_NOTIFICATION_STATUS: ${{ steps.window.outputs.notification_status || '' }}
          WINDOW_NOTIFICATION_REASON: ${{ steps.window.outputs.notification_reason || '' }}
          WINDOW_RESOLUTION_REASON: ${{ steps.window.outputs.resolution_reason || '' }}
          SCHEDULE_CONTRACT_VERSION: ${{ steps.window.outputs.schedule_contract_version || '' }}
          SCHEDULED_SLOT: ${{ steps.window.outputs.scheduled_slot || '' }}
          EFFECTIVE_MARKET_PHASE: ${{ steps.window.outputs.effective_market_phase || '' }}
          SCHEDULED_FOR_AT: ${{ steps.window.outputs.scheduled_for_at || '' }}
          RUN_STARTED_AT: ${{ steps.window.outputs.run_started_at || '' }}
          DELAY_SECONDS: ${{ steps.window.outputs.delay_seconds || '0' }}
          TRIGGER_KIND: ${{ steps.window.outputs.trigger_kind || github.event_name }}
          DELIVERED_COUNT: ${{ steps.send_brief.outputs.delivered_count || '' }}
          FAILED_COUNT: ${{ steps.send_brief.outputs.failed_count || '' }}
          QUEUE_STATUS: ${{ steps.writer_queue.outputs.queue_status || 'not_required' }}
          QUEUE_REASON: ${{ steps.writer_queue.outputs.reason || '' }}
          PREPARED_RELEASE_STATUS: ${{ steps.prepared_release.outputs.reason || 'not_required' }}
          PAGES_DEPLOYMENT_AVAILABLE: ${{ steps.deployment.outputs.available || 'false' }}
          PAGES_DEPLOYMENT_VERIFIED: ${{ steps.deployment_identity.outputs.verified || 'false' }}
          PAGES_DEPLOYMENT_ID: ${{ steps.deployment_identity.outputs.deployment_id || steps.deployment.outputs.deployment_id || '' }}
          PAGES_DEPLOYMENT_RUN_ID: ${{ steps.deployment_identity.outputs.workflow_run_id || github.run_id }}
          PAGES_DEPLOYMENT_ERROR: ${{ steps.deployment_identity.outputs.error || '' }}
          PAGES_DEPLOYMENT_ERROR_CODE: ${{ steps.deployment.outputs.error_code || steps.deployment_identity.outputs.error_code || '' }}
          RELEASE_GATE_OUTCOME: ${{ steps.release_gate.outcome || 'not_run' }}
          RELEASE_GATE_STATUS: ${{ steps.release_gate.outputs.gate_status || 'not_run' }}
          RELEASE_GATE_ERROR_CATEGORY: ${{ steps.release_gate.outputs.error_category || '' }}
          RELEASE_GATE_EXPECTED_RELEASE_ID: ${{ steps.release_gate.outputs.expected_release_id || steps.release_manifest.outputs.release_id || '' }}
          RELEASE_GATE_ACTUAL_RELEASE_ID: ${{ steps.release_gate.outputs.actual_release_id || '' }}
          RELEASE_GATE_DEPLOYMENT_ID: ${{ steps.release_gate.outputs.deployment_id || steps.deployment_identity.outputs.deployment_id || '' }}
          RELEASE_MANIFEST_OUTCOME: ${{ steps.release_manifest.outcome || 'not_run' }}
          RELEASE_MANIFEST_STATUS: ${{ steps.release_manifest.outputs.manifest_status || '' }}
          ALERT_PROJECTION_STATUS: ${{ steps.release_manifest.outputs.alert_projection_status || '' }}
          QUARANTINED_ALERT_COUNT: ${{ steps.release_manifest.outputs.quarantined_alert_count || '0' }}
          QUARANTINED_ALERT_REASONS: ${{ steps.release_manifest.outputs.quarantined_alert_reasons || '' }}
        run: |
          scan_status="unknown"
          if [ "$PREPARE_OUTCOME" = "success" ]; then
            scan_status="completed"
          elif [ "$PREPARE_OUTCOME" = "failure" ]; then
            scan_status="production_failed"
          elif [ "$WINDOW_CONTRACT_STATUS" = "invalid" ]; then
            scan_status="contract_error"
          elif [ "$PREPARE_OUTCOME" = "skipped" ]; then
            scan_status="not_run"
          fi
          notification_status="$SEND_STATUS"
          notification_reason="$SEND_REASON"
          notification_expected="$NOTIFICATION_EXPECTED_VALUE"
          if [ "$NOTIFICATION_REQUESTED" = "true" ] && [ "$WINDOW_DELIVERY_INTENT" = "notify_candidate" ]; then
            notification_expected="true"
          fi
          if [ "$NOTIFICATION_REQUESTED" != "true" ]; then
            notification_expected="false"
          fi
          if [ -z "$notification_status" ]; then
            if [ "$WINDOW_CONTRACT_STATUS" = "invalid" ]; then
              notification_status="blocked"
            elif [ "$PREPARE_OUTCOME" = "failure" ]; then
              notification_status="failed"
            elif [ "$NOTIFICATION_REQUESTED" != "true" ] && [ "$WINDOW_DELIVERY_INTENT" = "notify_candidate" ]; then
              notification_status="not_requested"
            elif [ -n "$WINDOW_NOTIFICATION_STATUS" ]; then
              notification_status="$WINDOW_NOTIFICATION_STATUS"
            elif [ "$NOTIFY" = "true" ]; then
              notification_status="not_attempted"
            else
              notification_status="not_requested"
            fi
          fi
          if [ -z "$notification_reason" ]; then
            if [ "$WINDOW_CONTRACT_STATUS" = "invalid" ]; then
              notification_reason="$WINDOW_NOTIFICATION_REASON"
            elif [ "$PREPARE_OUTCOME" = "failure" ]; then
              notification_reason="production_failed"
            elif [ "$NOTIFICATION_REQUESTED" != "true" ] && [ "$WINDOW_DELIVERY_INTENT" = "notify_candidate" ]; then
              notification_reason="manual_notification_opt_in_required"
            elif [ -n "$WINDOW_NOTIFICATION_REASON" ]; then
              notification_reason="$WINDOW_NOTIFICATION_REASON"
            elif [ -n "$WINDOW_RESOLUTION_REASON" ]; then
              notification_reason="$WINDOW_RESOLUTION_REASON"
            elif [ "$NOTIFY" = "true" ]; then
              notification_reason="not_attempted"
            else
              notification_reason="manual_notification_opt_in_required"
            fi
          fi
          if [ "$RELEASE_MANIFEST_OUTCOME" = "failure" ]; then
            scan_status="release_manifest_failed"
            notification_status="failed"
            if [ -n "$QUARANTINED_ALERT_REASONS" ] || [ "$ALERT_PROJECTION_STATUS" = "invalid" ]; then
              notification_reason="fj_alert_contract_invalid"
            else
              notification_reason="release_manifest_failed"
            fi
          elif [ "$RELEASE_MANIFEST_STATUS" = "ready_with_quarantine" ]; then
            echo "::warning::Optional FJ alert quarantined; core scheduled release continues (${QUARANTINED_ALERT_COUNT} row(s))."
            if [ -z "$notification_reason" ] || [ "$notification_reason" = "not_attempted" ]; then
              notification_reason="optional_fj_alert_quarantined"
            fi
          fi
          if [ "$NOTIFICATION_REQUESTED" = "true" ] && [ "$WINDOW_DELIVERY_INTENT" = "notify_candidate" ] && [ "$PAGES_DEPLOYMENT_AVAILABLE" != "true" ]; then
            scan_status="delivery_blocked"
            notification_status="failed"
            notification_reason="pages_deployment_${PAGES_DEPLOYMENT_ERROR_CODE:-unavailable}"
          elif [ "$NOTIFICATION_REQUESTED" = "true" ] && [ "$WINDOW_DELIVERY_INTENT" = "notify_candidate" ] && [ "$PAGES_DEPLOYMENT_VERIFIED" != "true" ]; then
            scan_status="release_gate_failed"
            notification_status="failed"
            notification_reason="pages_deployment_identity_unverified"
          elif [ "$PUBLISH_REQUESTED" = "true" ] && [ "$PAGES_DEPLOYMENT_AVAILABLE" != "true" ]; then
            scan_status="published_unverified"
            if [ "$notification_expected" != "true" ]; then
              notification_status="not_applicable"
              notification_reason="pages_publication_${PAGES_DEPLOYMENT_ERROR_CODE:-unavailable}"
            fi
          elif [ "$RELEASE_GATE_STATUS" = "superseded" ]; then
            scan_status="published_superseded"
            notification_status="superseded"
            notification_reason="release_superseded_by_newer_valid_version"
          elif [ "$RELEASE_GATE_OUTCOME" = "failure" ]; then
            scan_status="release_gate_failed"
            notification_status="failed"
            notification_reason="release_gate_${RELEASE_GATE_ERROR_CATEGORY:-verification_failed}"
          fi
          if [ "$QUEUE_STATUS" = "superseded" ]; then
            scan_status="not_run"
            notification_status="superseded"
            notification_reason="stale_workflow_superseded"
          elif [ "$PREPARED_RELEASE_STATUS" != "prepared_release_current" ] && [ "$WINDOW_DELIVERY_INTENT" = "notify_candidate" ] && [ "$NOTIFICATION_REQUESTED" = "true" ]; then
            scan_status="prepared_release_failed"
            notification_status="failed"
            notification_reason="${PREPARED_RELEASE_STATUS:-prepared_release_not_verified}"
          fi
          {
            echo "## Scheduled brief notification decision"
            echo "- scan_status: ${scan_status}"
            echo "- candidate_type: ${CANDIDATE_TYPE:-none}"
            echo "- notification_expected: ${notification_expected:-false}"
            echo "- notification_status: ${notification_status}"
            echo "- notification_reason: ${notification_reason:-unknown}"
            echo "- release_manifest_status: ${RELEASE_MANIFEST_STATUS:-unknown}"
            echo "- alert_projection_status: ${ALERT_PROJECTION_STATUS:-unknown}"
            echo "- quarantined_alert_count: ${QUARANTINED_ALERT_COUNT:-0}"
            echo "- quarantined_alert_reasons: ${QUARANTINED_ALERT_REASONS:-none}"
            echo "- schedule_contract_status: ${WINDOW_CONTRACT_STATUS:-unknown}"
            echo "- schedule_contract_version: ${SCHEDULE_CONTRACT_VERSION:-unknown}"
            echo "- scheduled_slot: ${SCHEDULED_SLOT:-unknown}"
            echo "- effective_market_phase: ${EFFECTIVE_MARKET_PHASE:-unknown}"
            echo "- scheduled_for_at: ${SCHEDULED_FOR_AT:-unknown}"
            echo "- run_started_at: ${RUN_STARTED_AT:-unknown}"
            echo "- delay_seconds: ${DELAY_SECONDS:-unknown}"
            echo "- trigger_kind: ${TRIGGER_KIND:-unknown}"
            echo "- delivered_count: ${DELIVERED_COUNT:-unknown}"
            echo "- failed_count: ${FAILED_COUNT:-unknown}"
            echo "- writer_queue_status: ${QUEUE_STATUS:-not_required}"
            echo "- writer_queue_reason: ${QUEUE_REASON:-none}"
            echo "- prepared_release_status: ${PREPARED_RELEASE_STATUS:-not_required}"
            echo "- pages_deployment_verified: ${PAGES_DEPLOYMENT_VERIFIED}"
            echo "- pages_deployment_id: ${PAGES_DEPLOYMENT_ID:-unknown}"
            echo "- pages_deployment_run_id: ${PAGES_DEPLOYMENT_RUN_ID:-unknown}"
            echo "- pages_deployment_error: ${PAGES_DEPLOYMENT_ERROR:-none}"
            echo "- pages_deployment_error_code: ${PAGES_DEPLOYMENT_ERROR_CODE:-none}"
            echo "- pages_publication_status: $([ "$PAGES_DEPLOYMENT_VERIFIED" = "true" ] && echo published_and_verified || echo not_published_or_unverified)"
            echo "- release_gate_outcome: ${RELEASE_GATE_OUTCOME}"
            echo "- release_gate_status: ${RELEASE_GATE_STATUS}"
            echo "- release_gate_error_category: ${RELEASE_GATE_ERROR_CATEGORY:-none}"
            echo "- expected_release_id: ${RELEASE_GATE_EXPECTED_RELEASE_ID:-unknown}"
            echo "- actual_release_id: ${RELEASE_GATE_ACTUAL_RELEASE_ID:-unknown}"
            echo "- release_gate_deployment_id: ${RELEASE_GATE_DEPLOYMENT_ID:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Persist scheduled-brief delivery receipt
        # Persist failed attempts as well as successful attempts.  This keeps
        # the existing claim/receipt chain aware of retryable recipients.
        # A suppressed/idempotent decision has no Telegram attempt and hence
        # no trace to persist.  Attempted deliveries always emit trace_id,
        # including failed attempts, so the receipt callback remains durable
        # without producing a false callback failure on dedup suppression.
        if: always() && steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.release_gate.outputs.allowed == 'true' && steps.send_brief.outcome != 'skipped' && steps.send_brief.outputs.trace_id != ''
        continue-on-error: true
        env:
          DELIVERY_RECEIPT_SHARED_SECRET: ${{ secrets.DELIVERY_RECEIPT_SHARED_SECRET || secrets.RAILWAY_STATUS_SHARED_SECRET || secrets.DELIVERY_STATUS_SHARED_SECRET }}
          RAILWAY_STATUS_SHARED_SECRET: ${{ secrets.RAILWAY_STATUS_SHARED_SECRET || secrets.DELIVERY_STATUS_SHARED_SECRET }}
          TRACE_ID: ${{ steps.send_brief.outputs.trace_id }}
          RELEASE_ID: ${{ steps.send_brief.outputs.release_id }}
          SNAPSHOT_ID: ${{ steps.send_brief.outputs.snapshot_id }}
          ALERT_ID: ${{ steps.send_brief.outputs.alert_id }}
          DELIVERY_MODE: ${{ steps.send_brief.outputs.delivery_mode }}
          DELIVERY_STATUS: ${{ steps.send_brief.outputs.delivery_status }}
          DELIVERED_COUNT: ${{ steps.send_brief.outputs.delivered_count || '0' }}
          FAILED_COUNT: ${{ steps.send_brief.outputs.failed_count || '0' }}
          RENDERER_ERROR_TYPE: ${{ steps.send_brief.outputs.renderer_error_type }}
          FAILED_RECIPIENT_HASHES: ${{ steps.send_brief.outputs.failed_recipient_hashes }}
          FINANCIALJUICE_TRACE: ${{ steps.send_brief.outputs.financialjuice_delivery_trace }}
        run: python -m src.delivery_callback
      - name: Persist notification ledger state after delivery
        id: persist_notification_ledger
        if: always() && steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.release_gate.outputs.allowed == 'true' && steps.send_brief.outputs.sent == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          arguments=(
            --allow-stale-research
            --research-fallback-reason "research scan incomplete; preserving last-known-good research snapshot"
          )
          creator_records_path="/tmp/prstk-creator-records.json"
          if [ -s "$creator_records_path" ]; then
            arguments+=(--creator-records "$creator_records_path")
          fi
          python -m src.release_manifest "${arguments[@]}"
          python -m src.data_release --publish --branch "$DATA_RELEASE_BRANCH" --include site/data \
            --message "chore: persist scheduled notification ledger state"
          git fetch --no-tags origin "refs/heads/${DATA_RELEASE_BRANCH}:refs/remotes/origin/${DATA_RELEASE_BRANCH}"
          data_release_sha="$(git rev-parse "refs/remotes/origin/${DATA_RELEASE_BRANCH}")"
          {
          python - "$MANIFEST_PATH" <<'PY'
          import json
          import sys
          from pathlib import Path
          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(f"reconciled_release_id={manifest.get('release_id', '')}")
          print(f"reconciled_snapshot_id={manifest.get('market_snapshot_id', '')}")
          PY
          printf 'reconciled_data_release_sha=%s\n' "$data_release_sha"
          python -m src.pages_deployment \
            --mode derive-version \
            --source-revision "$GITHUB_SHA" \
            --manifest "$MANIFEST_PATH"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare reconciled Pages artifact
        if: always() && steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.release_gate.outputs.allowed == 'true' && steps.send_brief.outputs.sent == 'true' && steps.persist_notification_ledger.outcome == 'success'
        run: |
          python -m src.build_assets --root site --build-sha "$GITHUB_SHA"
          python -m src.asset_contract --root site
      - name: Upload reconciled Pages artifact
        if: always() && steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.release_gate.outputs.allowed == 'true' && steps.send_brief.outputs.sent == 'true' && steps.persist_notification_ledger.outcome == 'success'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          name: github-pages-reconciled
          path: site
      - name: Deploy reconciled Pages release
        if: always() && steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.release_gate.outputs.allowed == 'true' && steps.send_brief.outcome != 'skipped' && steps.persist_notification_ledger.outcome == 'success'
        id: reconciled_deployment
        uses: ./.github/actions/deploy-pages-retry
        with:
          artifact_name: github-pages-reconciled
          build_version: ${{ steps.persist_notification_ledger.outputs.pages_build_version }}
          fallback_url: ${{ env.DASHBOARD_URL }}
      - name: Verify reconciled Pages deployment identity
        if: always() && steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.release_gate.outputs.allowed == 'true' && steps.send_brief.outputs.sent == 'true' && steps.persist_notification_ledger.outcome == 'success' && steps.reconciled_deployment.outputs.available == 'true'
        id: reconciled_deployment_identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -m src.pages_deployment
          --mode verify
          --expected-build-version "${{ steps.persist_notification_ledger.outputs.pages_build_version }}"
          --deployment-id "${{ steps.reconciled_deployment.outputs.deployment_id }}"
          --status-url "${{ steps.reconciled_deployment.outputs.deployment_status_url }}"
          >> "$GITHUB_OUTPUT"
      - name: Verify reconciled public release
        if: always() && steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.release_gate.outputs.allowed == 'true' && steps.send_brief.outputs.sent == 'true' && steps.persist_notification_ledger.outcome == 'success' && steps.reconciled_deployment.outputs.available == 'true' && steps.reconciled_deployment_identity.outputs.verified == 'true'
        id: reconciled_release_gate
        run: >-
          python -m src.release_gate
          --manifest "$MANIFEST_PATH"
          --expected-release-id "${{ steps.persist_notification_ledger.outputs.reconciled_release_id }}"
          --expected-snapshot-id "${{ steps.prepare.outputs.snapshot_id }}"
          --public-url "${{ steps.reconciled_deployment.outputs.page_url }}"
          --deployment-id "${{ steps.reconciled_deployment_identity.outputs.deployment_id }}"
          --public-timeout-seconds 180
          --public-delay 2
          --public-max-delay 20
          >> "$GITHUB_OUTPUT"
      - name: Send release-gated Creator notifications
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.release_gate.outputs.allowed == 'true' && steps.reconciled_release_gate.outputs.allowed == 'true' && env.NOTIFY == 'true' && steps.window.outputs.delivery_intent == 'notify_candidate'
        id: creator_dispatch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SUBSCRIPTIONS_ENABLED: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DELIVERY_RECEIPT_SHARED_SECRET: ${{ secrets.DELIVERY_RECEIPT_SHARED_SECRET || secrets.RAILWAY_STATUS_SHARED_SECRET || secrets.DELIVERY_STATUS_SHARED_SECRET }}
          RAILWAY_STATUS_URL: ${{ vars.RAILWAY_STATUS_URL }}
          RAILWAY_STATUS_SHARED_SECRET: ${{ secrets.RAILWAY_STATUS_SHARED_SECRET || secrets.DELIVERY_STATUS_SHARED_SECRET }}
          RECEIPT_CALLBACK_URL: ${{ vars.RECEIPT_CALLBACK_URL }}
        run: |
          python -m src.creator_dispatch \
            --manifest "$MANIFEST_PATH" \
            --public-url "${{ steps.reconciled_deployment.outputs.page_url || steps.deployment.outputs.page_url }}" \
            >> "$GITHUB_OUTPUT"
      - name: Summarize Creator notification decision
        if: always() && steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.release_gate.outputs.allowed == 'true' && env.NOTIFY == 'true'
        env:
          CREATOR_STATUS: ${{ steps.creator_dispatch.outputs.creator_status || 'not_run' }}
          CREATOR_SENT: ${{ steps.creator_dispatch.outputs.creator_sent || '0' }}
          CREATOR_BLOCKED: ${{ steps.creator_dispatch.outputs.creator_blocked || '0' }}
          CREATOR_REASON: ${{ steps.creator_dispatch.outputs.creator_blocking_reason || '' }}
          CREATOR_REMOTE_HISTORY: ${{ steps.creator_dispatch.outputs.creator_remote_history_status || 'unknown' }}
          CREATOR_DELIVERY_STATUS: ${{ steps.creator_dispatch.outputs.creator_delivery_status || 'not_recorded' }}
          CREATOR_RELEASE_ID: ${{ steps.creator_dispatch.outputs.creator_release_id || '' }}
          RECONCILED_GATE_STATUS: ${{ steps.reconciled_release_gate.outputs.gate_status || 'not_run' }}
          RECONCILED_GATE_ERROR_CATEGORY: ${{ steps.reconciled_release_gate.outputs.error_category || '' }}
          RECONCILED_GATE_ALLOWED: ${{ steps.reconciled_release_gate.outputs.allowed || 'false' }}
        run: |
          {
            echo "## Creator notification decision"
            echo "- status: ${CREATOR_STATUS}"
            echo "- sent episodes: ${CREATOR_SENT}"
            echo "- blocked episodes: ${CREATOR_BLOCKED}"
            echo "- delivery status: ${CREATOR_DELIVERY_STATUS}"
            echo "- remote history: ${CREATOR_REMOTE_HISTORY}"
            echo "- reconciled release gate: ${RECONCILED_GATE_STATUS} (allowed=${RECONCILED_GATE_ALLOWED})"
            echo "- reconciled release gate error category: ${RECONCILED_GATE_ERROR_CATEGORY:-none}"
            if [ -n "${CREATOR_RELEASE_ID}" ]; then echo "- creator release: ${CREATOR_RELEASE_ID}"; fi
            if [ -n "${CREATOR_REASON}" ]; then echo "- blocking reason: ${CREATOR_REASON}"; fi
            if [ "${CREATOR_SENT}" = "0" ]; then
              echo "- no Creator Telegram message was sent in this run; fail-closed policy remained active"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Persist Creator delivery receipt
        if: always() && steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.reconciled_release_gate.outputs.allowed == 'true' && steps.creator_dispatch.outcome == 'success' && steps.creator_dispatch.outputs.creator_delivery_status != '' && steps.creator_dispatch.outputs.creator_sent != '0'
        continue-on-error: true
        env:
          RAILWAY_STATUS_URL: ${{ vars.RAILWAY_STATUS_URL }}
          RAILWAY_STATUS_SHARED_SECRET: ${{ secrets.RAILWAY_STATUS_SHARED_SECRET || secrets.DELIVERY_STATUS_SHARED_SECRET }}
          DELIVERY_RECEIPT_KIND: creator
          TRACE_ID: ${{ steps.creator_dispatch.outputs.creator_trace_id }}
          RELEASE_ID: ${{ steps.creator_dispatch.outputs.creator_release_id }}
          SNAPSHOT_ID: ${{ steps.creator_dispatch.outputs.creator_snapshot_id }}
          ALERT_ID: ${{ steps.creator_dispatch.outputs.creator_alert_id }}
          DELIVERY_MODE: ${{ steps.creator_dispatch.outputs.creator_delivery_mode }}
          DELIVERY_STATUS: ${{ steps.creator_dispatch.outputs.creator_delivery_status }}
          DELIVERED_COUNT: ${{ steps.creator_dispatch.outputs.creator_delivered_count }}
          FAILED_COUNT: ${{ steps.creator_dispatch.outputs.creator_failed_count }}
          FAILED_RECIPIENT_HASHES: ""
          NOTIFICATION_KEYS: ${{ steps.creator_dispatch.outputs.creator_notification_keys }}
          RENDERER_ERROR_TYPE: ""
        run: python -m src.delivery_callback
      - name: Save event delivery lock
        if: success() && steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.send_brief.outputs.event_key != ''
        run: touch .official-event-lock
      - name: Persist event delivery lock
        if: success() && steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.send_brief.outputs.event_key != ''
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: .official-event-lock
          key: official-event-${{ steps.send_brief.outputs.event_key }}
      - name: Save scheduled idempotency lock
        if: success() && steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.prepare.outputs.prepared == 'true' && steps.send_brief.outputs.sent == 'true'
        run: touch .scheduled-brief-lock
      - name: Persist scheduled idempotency lock
        if: success() && steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.prepare.outputs.prepared == 'true' && steps.send_brief.outputs.sent == 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: .scheduled-brief-lock
          key: scheduled-brief-${{ steps.window.outputs.key }}

      - name: Fail closed for invalid schedule context
        if: always() && steps.window.outputs.contract_status == 'invalid'
        run: |
          echo "Invalid scheduled-brief contract: ${{ steps.window.outputs.resolution_reason || steps.window.outputs.notification_reason }}"
          exit 1
      - name: Fail scheduled run when an expected report has no delivered receipt
        if: always() && env.NOTIFY == 'true' && steps.window.outputs.delivery_intent == 'notify_candidate'
        env:
          SEND_OUTCOME: ${{ steps.send_brief.outcome || 'skipped' }}
          SEND_STATUS: ${{ steps.send_brief.outputs.notification_status || '' }}
          SEND_REASON: ${{ steps.send_brief.outputs.reason || '' }}
          DELIVERY_STATUS: ${{ steps.send_brief.outputs.delivery_status || '' }}
          DELIVERED_COUNT: ${{ steps.send_brief.outputs.delivered_count || '0' }}
          FAILED_COUNT: ${{ steps.send_brief.outputs.failed_count || '0' }}
          PREPARED_CURRENT: ${{ steps.prepared_release.outputs.current || 'false' }}
          PREPARE_READY: ${{ steps.prepare.outputs.prepared || 'false' }}
          GATE_ALLOWED: ${{ steps.release_gate.outputs.allowed || 'false' }}
        run: |
          set -euo pipefail
          if [ "$SEND_STATUS" = "already_delivered" ] && [ "$SEND_REASON" = "already_delivered" ]; then
            echo "The fixed anchor already has a durable successful receipt; no new send was made."
            exit 0
          fi
          if [ "$SEND_OUTCOME" = "success" ] && [ "$SEND_STATUS" = "ready" ] \
            && [ "$DELIVERY_STATUS" = "delivered" ] && [ "$DELIVERED_COUNT" -gt 0 ] \
            && [ "$FAILED_COUNT" -eq 0 ] && [ "$PREPARED_CURRENT" = "true" ] \
            && [ "$PREPARE_READY" = "true" ] && [ "$GATE_ALLOWED" = "true" ]; then
            echo "Expected scheduled report has a complete delivered receipt."
            exit 0
          fi
          echo "::error::Expected scheduled report did not reach a complete delivered receipt (status=${SEND_STATUS:-not_run}, reason=${SEND_REASON:-none}, delivery=${DELIVERY_STATUS:-none}, delivered=${DELIVERED_COUNT}, failed=${FAILED_COUNT}, prepared=${PREPARE_READY}, gate=${GATE_ALLOWED})."
          exit 1

