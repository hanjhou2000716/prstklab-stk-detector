name: Deploy canonical Cloudflare Worker

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      migration_status:
        description: "Telegram subscription migration outcome"
        value: ${{ jobs.migrate_subscriptions.outputs.migration_status }}
      prerequisite_status:
        description: "Telegram subscription schema prerequisite outcome"
        value: ${{ jobs.migrate_subscriptions.outputs.prerequisite_status }}
      reason:
        description: "Telegram subscription migration reason"
        value: ${{ jobs.migrate_subscriptions.outputs.reason }}

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

jobs:
  migrate_subscriptions:
    name: Verify and migrate Telegram subscribers
    uses: ./.github/workflows/migrate-telegram-subscribers.yml
    secrets: inherit

  deploy:
    needs: migrate_subscriptions
    if: needs.migrate_subscriptions.outputs.migration_status != 'blocked_prerequisite'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Install and validate Worker dependencies
        working-directory: worker
        run: |
          npm ci
          npm run typecheck
          npx wrangler deploy --dry-run

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2; exit 1; }
          test -n "$TELEGRAM_WEBHOOK_SECRET" || { echo "TELEGRAM_WEBHOOK_SECRET is not configured" >&2; exit 1; }
          # Wrangler v4 reads the account from CLOUDFLARE_ACCOUNT_ID; the
          # account is deliberately not committed to the Worker source.
          # Keep dashboard-managed vars while deploying the canonical bundle.
          # Expose the exact deployed source revision through /health so an
          # accepted Gmail push can be tied to the Worker actually serving it.
          npx wrangler deploy --keep-vars --var "VERSION:${GITHUB_SHA}"
          # Keep the webhook credential out of source and synchronize it only
          # through the authenticated deployment path.
          printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET
