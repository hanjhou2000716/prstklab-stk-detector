name: PRStK Notification

on:
  workflow_dispatch:
    inputs:
      message:
        description: "30 字內測試快報（留空使用預設訊息）"
        required: false
        type: string
      test_chat_id:
        description: "Optional single recipient for an explicitly requested smoke test"
        required: false
        type: string
      photo_test:
        description: "Run one release-gated text acceptance to the scoped test recipient (legacy input name)"
        required: false
        type: boolean
        default: false
  # 第一階段先只提供手動執行；確認後才加入正式排程。

permissions:
  contents: read

jobs:
  send-test-message:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: 設定 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: 安裝相依套件
        run: pip install -r requirements.txt
      - name: Mask scoped smoke-test recipient
        if: ${{ inputs.test_chat_id != '' }}
        run: echo "::add-mask::${{ inputs.test_chat_id }}"

      - name: 發送測試快報
        id: text_acceptance
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # A supplied test_chat_id is scoped to this one run; otherwise use
          # the normal plural broadcast configuration.
          TELEGRAM_CHAT_IDS: ${{ inputs.test_chat_id || secrets.TELEGRAM_CHAT_IDS }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          if [ "${{ inputs.photo_test }}" = "true" ]; then
            if [ -z "${{ inputs.test_chat_id }}" ]; then
              echo "text acceptance requires an explicit single test_chat_id" >&2
              exit 2
            fi
            python -m src.production_text_acceptance --manifest site/data/release-manifest.json --public-url "$DASHBOARD_URL" --chat-id "$TELEGRAM_CHAT_IDS"
          elif [ -n "${{ inputs.message }}" ]; then
            python -m src.main --send --message "${{ inputs.message }}"
          else
            python -m src.main --send
          fi
      - name: Persist text acceptance delivery receipt to Railway/Worker
        if: always() && inputs.photo_test == true && steps.text_acceptance.outputs.sent == 'true'
        env:
          # Prefer the zero-cost Cloudflare Worker; Railway remains an optional rollback.
          RECEIPT_CALLBACK_URL: ${{ vars.RECEIPT_CALLBACK_URL }}
          DELIVERY_RECEIPT_SHARED_SECRET: ${{ secrets.DELIVERY_RECEIPT_SHARED_SECRET || secrets.RAILWAY_STATUS_SHARED_SECRET || secrets.DELIVERY_STATUS_SHARED_SECRET }}
          RAILWAY_STATUS_URL: ${{ vars.RAILWAY_STATUS_URL }}
          RAILWAY_STATUS_SHARED_SECRET: ${{ secrets.RAILWAY_STATUS_SHARED_SECRET || secrets.DELIVERY_STATUS_SHARED_SECRET }}
          # Controlled text acceptance is stored under the existing
          # production receipt contract; the delivery mode remains text.
          DELIVERY_RECEIPT_KIND: production
          TRACE_ID: ${{ steps.text_acceptance.outputs.trace_id }}
          ALERT_ID: ${{ steps.text_acceptance.outputs.alert_id }}
          RELEASE_ID: ${{ steps.text_acceptance.outputs.release_id }}
          SNAPSHOT_ID: ${{ steps.text_acceptance.outputs.snapshot_id }}
          DELIVERY_MODE: ${{ steps.text_acceptance.outputs.delivery_mode }}
          DELIVERY_STATUS: ${{ steps.text_acceptance.outputs.delivery_status }}
          DELIVERED_COUNT: ${{ steps.text_acceptance.outputs.delivered_count }}
          FAILED_COUNT: ${{ steps.text_acceptance.outputs.failed_count }}
          RENDERER_ERROR_TYPE: not_applicable
          FAILED_RECIPIENT_HASHES: ""
        run: python -m src.delivery_callback
