name: PRStK Notification

on:
  workflow_dispatch:
    inputs:
      message:
        description: "30 字內測試快報（留空使用預設訊息）"
        required: false
        type: string
      test_chat_id:
        description: "Optional single recipient for an explicitly requested smoke test"
        required: false
        type: string
      photo_test:
        description: "Send one fixed 1080x1350 photo card to the scoped test recipient"
        required: false
        type: boolean
        default: false
  # 第一階段先只提供手動執行；確認後才加入正式排程。

permissions:
  contents: read

jobs:
  send-test-message:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: 設定 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: 安裝相依套件
        run: pip install -r requirements.txt
      - name: Install Chromium for formal card renderer
        timeout-minutes: 10
        run: |
          # ubuntu-latest already provides the shared libraries required by
          # Playwright Chromium.  Avoid the apt-based --with-deps path here:
          # it can stall indefinitely on the hosted runner and prevents the
          # scoped smoke test from ever reaching Telegram delivery.
          python -m playwright install chromium

      - name: Mask scoped smoke-test recipient
        if: ${{ inputs.test_chat_id != '' }}
        run: echo "::add-mask::${{ inputs.test_chat_id }}"

      - name: 發送測試快報
        id: photo_smoke
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # A supplied test_chat_id is scoped to this one run; otherwise use
          # the normal plural broadcast configuration.
          TELEGRAM_CHAT_IDS: ${{ inputs.test_chat_id || secrets.TELEGRAM_CHAT_IDS }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          if [ "${{ inputs.photo_test }}" = "true" ]; then
            if [ -z "${{ inputs.test_chat_id }}" ]; then
              echo "photo_test requires an explicit single test_chat_id" >&2
              exit 2
            fi
            python -m src.photo_smoke_test
          elif [ -n "${{ inputs.message }}" ]; then
            python -m src.main --send --message "${{ inputs.message }}"
          else
            python -m src.main --send
          fi
      - name: Persist photo smoke delivery receipt to Railway
        if: always() && inputs.photo_test == true && steps.photo_smoke.outputs.sent == 'true'
        env:
          RAILWAY_STATUS_URL: ${{ vars.RAILWAY_STATUS_URL }}
          RAILWAY_STATUS_SHARED_SECRET: ${{ secrets.RAILWAY_STATUS_SHARED_SECRET || secrets.DELIVERY_STATUS_SHARED_SECRET }}
          DELIVERY_RECEIPT_KIND: photo_smoke
          TRACE_ID: ${{ steps.photo_smoke.outputs.trace_id }}
          ALERT_ID: ${{ steps.photo_smoke.outputs.alert_id }}
          RELEASE_ID: ${{ steps.photo_smoke.outputs.release_id }}
          SNAPSHOT_ID: ${{ steps.photo_smoke.outputs.snapshot_id }}
          DELIVERY_MODE: ${{ steps.photo_smoke.outputs.delivery_mode }}
          DELIVERY_STATUS: ${{ steps.photo_smoke.outputs.delivery_status }}
          DELIVERED_COUNT: ${{ steps.photo_smoke.outputs.delivered_count }}
          FAILED_COUNT: ${{ steps.photo_smoke.outputs.failed_count }}
          RENDERER_ERROR_TYPE: ${{ steps.photo_smoke.outputs.renderer_error_type }}
          FAILED_RECIPIENT_HASHES: ""
        run: python -m src.delivery_callback
