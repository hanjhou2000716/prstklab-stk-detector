name: Gmail history sync (Supabase)

on:
  workflow_dispatch:
    inputs:
      history_id:
        description: Pub/Sub history cursor (for an operator retry)
        required: false
        type: string
      latest_financialjuice:
        description: Reprocess exactly the newest FinancialJuice mail without moving the cursor
        required: false
        type: boolean
      notify:
        description: Allow fresh eligible observations to trigger the official event monitor
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [gmail-history-sync]
  schedule:
    # Pub/Sub remains the low-latency path. This bounded cursor reconciliation
    # catches a missed webhook without creating a second parser or ledger.
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: gmail-history-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GMAIL_WATCH_TOPIC: ${{ vars.GMAIL_WATCH_TOPIC }}
      GMAIL_WATCH_LABEL_IDS: ${{ vars.GMAIL_WATCH_LABEL_IDS || 'INBOX' }}
      GMAIL_OAUTH_STATE: ${{ vars.GMAIL_OAUTH_STATE || 'configured' }}
      GMAIL_PUBSUB_AUDIENCE: ${{ vars.GMAIL_PUBSUB_AUDIENCE }}
      GMAIL_PUBSUB_SERVICE_ACCOUNT: ${{ vars.GMAIL_PUBSUB_SERVICE_ACCOUNT }}
      GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
      GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      NOTIFY: ${{ github.event_name == 'workflow_dispatch' && (inputs.notify == true && 'true' || 'false') || github.event_name == 'repository_dispatch' && (github.event.client_payload.notify == false || github.event.client_payload.notify == 'false') && 'false' || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-production.txt
      - name: Install parser dependencies
        run: python -m pip install -r requirements-production.txt
      - name: Sync bounded history into canonical parser
        env:
          HISTORY_ID: ${{ inputs.history_id || github.event.client_payload.history_id || '' }}
        run: |
          set -o pipefail
          args=()
          if [ -n "${HISTORY_ID:-}" ]; then args+=(--history-id "$HISTORY_ID"); fi
          if [ "${{ inputs.latest_financialjuice || github.event.client_payload.latest_financialjuice || false }}" = "true" ]; then args+=(--latest-financialjuice); fi
          args+=(--notify "$NOTIFY")
          python scripts/sync_gmail_supabase.py "${args[@]}" | tee gmail-sync-result.json
      - name: Validate Gmail sync result contract
        if: success()
        id: contract
        run: |
          test -s gmail-sync-result.json
          jq -e '
            type == "object" and
            (.status | type) == "string" and
            (.processed | type) == "number" and
            (.failed | type) == "number" and
            (.accepted_new_count | type) == "number" and
            (.material_candidate_count | type) == "number" and
            (.priority_candidate_count | type) == "number" and
            (.candidate_diagnostics | type) == "object" and
            (.recovery_status | type) == "string" and
            (.retryable | type) == "boolean" and
            (.request_attempts | type) == "number" and
            (.consecutive_failure_count | type) == "number" and
            (.priority_event_refs == null or (.priority_event_refs | type) == "array") and
            ((.cursor_preserved | type) == "boolean" or (.cursor_preserved == null))
          ' gmail-sync-result.json >/dev/null
      - name: Fail when FJ pending state cannot be saved
        if: success()
        run: |
          pending_state_errors="$(jq -r 'if ((.candidate_diagnostics.counts.priority_pending_state_error // 0) | type) == "number" then (.candidate_diagnostics.counts.priority_pending_state_error // 0) else 0 end' gmail-sync-result.json)"
          if [ "$pending_state_errors" -gt 0 ]; then
            echo "FinancialJuice pending state could not be saved; refusing silent loss."
            exit 1
          fi
      - name: Trigger realtime event monitor for new reviewed email
        if: success()
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          material_candidates="$(jq -r 'if (.material_candidate_count | type) == "number" then .material_candidate_count else 0 end' gmail-sync-result.json)"
          priority_candidates="$(jq -r 'if (.priority_candidate_count | type) == "number" then .priority_candidate_count else 0 end' gmail-sync-result.json)"
          priority_detected="$(jq -r 'if ((.candidate_diagnostics.counts.priority_candidate_detected // 0) | type) == "number" then (.candidate_diagnostics.counts.priority_candidate_detected // 0) else 0 end' gmail-sync-result.json)"
          pending_refs="$(jq -c '.priority_pending_refs // .candidate_diagnostics.priority_pending_refs // []' gmail-sync-result.json)"
          event_refs="$(jq -c '.priority_event_refs // .candidate_diagnostics.priority_event_refs // []' gmail-sync-result.json)"
          candidate_ready="false"
          if [ "$material_candidates" -gt 0 ] || [ "$priority_candidates" -gt 0 ] || [ "$priority_detected" -gt 0 ] || [ "$pending_refs" != "[]" ] || [ "$event_refs" != "[]" ]; then candidate_ready="true"; fi
          recovery_status="$(jq -r '.recovery_status // "unknown"' gmail-sync-result.json)"
          if [ "$candidate_ready" = "true" ] && [ "$recovery_status" != "retry_pending" ] && [ "$recovery_status" != "persistent_failure" ] && [ "$NOTIFY" = "true" ] && [ "${{ inputs.latest_financialjuice || github.event.client_payload.latest_financialjuice || false }}" != "true" ]; then
            gh api --method POST "repos/$GH_REPO/dispatches" \
              -f event_type=official-event-check \
              -f 'client_payload[reason]=gmail-reviewed-observation' \
              -f 'client_payload[notify]=true' \
              -f "client_payload[priority_candidate_detected]=$priority_detected" \
              -f "client_payload[priority_pending_refs]=$pending_refs" \
              -f "client_payload[priority_event_refs]=$event_refs"
            echo "triggered=true" >> "$GITHUB_OUTPUT"
          else
            echo "triggered=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish Gmail notification decision
        if: always()
        env:
          DISPATCH_TRIGGERED: ${{ steps.dispatch.outputs.triggered || 'false' }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome || 'skipped' }}
          RESULT_CONTRACT_OUTCOME: ${{ steps.contract.outcome || 'skipped' }}
        run: |
          processed="0"
          accepted_new="0"
          material_candidates="0"
          priority_candidates="0"
          duplicate="0"
          candidate_reason=""
          manual_replay="0"
          failed="0"
          status="unavailable"
          storage_error=""
          diagnostic_reason=""
          pending_state_errors="0"
          retry_count="0"
          recovery_status="unknown"
          retryable="false"
          request_attempts="0"
          consecutive_failures="0"
          first_failure_at=""
          cursor_preserved="unknown"
          next_retry_at=""
          escalation_reason=""
          if [ -s gmail-sync-result.json ]; then
            processed="$(jq -r 'if (.processed | type) == "number" then .processed else 0 end' gmail-sync-result.json)"
            accepted_new="$(jq -r 'if (.accepted_new_count | type) == "number" then .accepted_new_count else 0 end' gmail-sync-result.json)"
            material_candidates="$(jq -r 'if (.material_candidate_count | type) == "number" then .material_candidate_count else 0 end' gmail-sync-result.json)"
            priority_candidates="$(jq -r 'if (.priority_candidate_count | type) == "number" then .priority_candidate_count else 0 end' gmail-sync-result.json)"
            duplicate="$(jq -r 'if (.duplicate_count | type) == "number" then .duplicate_count elif (.duplicate | type) == "number" then .duplicate else 0 end' gmail-sync-result.json)"
            candidate_reason="$(jq -r '.candidate_diagnostics.primary_reason // ""' gmail-sync-result.json)"
            manual_replay="$(jq -r 'if ((.candidate_diagnostics.counts.manual_replay // 0) | type) == "number" then (.candidate_diagnostics.counts.manual_replay // 0) else 0 end' gmail-sync-result.json)"
            failed="$(jq -r 'if (.failed | type) == "number" then .failed else 0 end' gmail-sync-result.json)"
            status="$(jq -r '.status // "unknown"' gmail-sync-result.json)"
            storage_error="$(jq -r '.storage_error // ""' gmail-sync-result.json)"
            diagnostic_reason="$(jq -r '.diagnostic_reason // ""' gmail-sync-result.json)"
            pending_state_errors="$(jq -r 'if ((.candidate_diagnostics.counts.priority_pending_state_error // 0) | type) == "number" then (.candidate_diagnostics.counts.priority_pending_state_error // 0) else 0 end' gmail-sync-result.json)"
            retry_count="$(jq -r 'if (.supabase_retry_count | type) == "number" then .supabase_retry_count else 0 end' gmail-sync-result.json)"
            recovery_status="$(jq -r '.recovery_status // "unknown"' gmail-sync-result.json)"
            retryable="$(jq -r 'if (.retryable | type) == "boolean" then .retryable else false end' gmail-sync-result.json)"
            request_attempts="$(jq -r 'if (.request_attempts | type) == "number" then .request_attempts else 0 end' gmail-sync-result.json)"
            consecutive_failures="$(jq -r 'if (.consecutive_failure_count | type) == "number" then .consecutive_failure_count else 0 end' gmail-sync-result.json)"
            first_failure_at="$(jq -r '.first_failure_at // ""' gmail-sync-result.json)"
            cursor_preserved="$(jq -r 'if (.cursor_preserved | type) == "boolean" then .cursor_preserved else "unknown" end' gmail-sync-result.json)"
            next_retry_at="$(jq -r '.next_retry_at // ""' gmail-sync-result.json)"
            escalation_reason="$(jq -r '.escalation_reason // ""' gmail-sync-result.json)"
          fi
          if [ "$RESULT_CONTRACT_OUTCOME" = "failure" ]; then
            notification_status="failed"
            notification_reason="sync_result_contract_invalid"
          elif [ ! -s gmail-sync-result.json ]; then
            notification_status="failed"
            notification_reason="sync_result_missing"
          elif [ "$recovery_status" = "retry_pending" ]; then
            notification_status="degraded"
            notification_reason="transient_sync_failure_retry_pending"
          elif [ "$pending_state_errors" -gt 0 ]; then
            notification_status="failed"
            notification_reason="priority_pending_state_error"
          elif [ "$recovery_status" = "persistent_failure" ] || [ "$status" = "cursor_read_failed" ]; then
            notification_status="failed"
            notification_reason="${escalation_reason:-${diagnostic_reason:-gmail_cursor_read_failed}}:${storage_error:-unknown}"
          elif [ "$NOTIFY" != "true" ]; then
            notification_status="not_requested"
            notification_reason="manual_notification_opt_in_required"
          elif [ "${{ inputs.latest_financialjuice || github.event.client_payload.latest_financialjuice || false }}" = "true" ] || [ "$manual_replay" -gt 0 ]; then
            notification_status="diagnostic_only"
            notification_reason="manual_replay"
          elif [ "$DISPATCH_TRIGGERED" = true ]; then
            notification_status="dispatch_requested"
            notification_reason="new_reviewed_email_accepted"
          elif [ "$failed" -gt 0 ]; then
            notification_status="failed"
            notification_reason="gmail_sync_failed"
          elif [ "$material_candidates" -gt 0 ] || [ "$priority_candidates" -gt 0 ]; then
            if [ "$DISPATCH_OUTCOME" != "success" ]; then
              notification_status="failed"
              notification_reason="downstream_dispatch_failure"
            else
              notification_status="dispatch_requested"
              notification_reason="new_reviewed_email_accepted"
            fi
          elif [ "$accepted_new" -gt 0 ] && [ "$material_candidates" -eq 0 ] && [ "$priority_candidates" -eq 0 ]; then
            notification_status="no_candidate"
            notification_reason="accepted_new_but_candidate_rejected:${candidate_reason:-unspecified}"
          elif [ "$duplicate" -gt 0 ]; then
            notification_status="no_new_content"
            notification_reason="duplicate_email"
          else
            notification_status="no_new_content"
            notification_reason="no_new_reviewed_email"
          fi
          if [ "$material_candidates" -gt 0 ] || [ "$priority_candidates" -gt 0 ]; then
            candidate_type="financialjuice_or_creator"
            notification_expected="true"
          else
            candidate_type="none"
            notification_expected="false"
          fi
          {
            echo "## Gmail notification decision"
            echo "- scan_status: ${status}"
            echo "- candidate_type: ${candidate_type}"
            echo "- notification_expected: ${notification_expected}"
            echo "- notification_status: ${notification_status}"
            echo "- notification_reason: ${notification_reason}"
            echo "- processed_count: ${processed}"
            echo "- accepted_new_count: ${accepted_new}"
            echo "- material_candidate_count: ${material_candidates}"
            echo "- priority_candidate_count: ${priority_candidates}"
            echo "- priority_candidate_detected: $(jq -r '.candidate_diagnostics.counts.priority_candidate_detected // 0' gmail-sync-result.json 2>/dev/null || echo 0)"
            echo "- summary_semantics_incomplete: $(jq -r '.candidate_diagnostics.counts.summary_semantics_incomplete // 0' gmail-sync-result.json 2>/dev/null || echo 0)"
            echo "- priority_pending_count: $(jq -r '(.priority_pending_refs // .candidate_diagnostics.priority_pending_refs // []) | length' gmail-sync-result.json 2>/dev/null || echo 0)"
            echo "- priority_event_count: $(jq -r '(.priority_event_refs // .candidate_diagnostics.priority_event_refs // []) | length' gmail-sync-result.json 2>/dev/null || echo 0)"
            echo "- duplicate_count: ${duplicate}"
            echo "- supabase_retry_count: ${retry_count}"
            echo "- recovery_status: ${recovery_status}"
            echo "- retryable: ${retryable}"
            echo "- request_attempts: ${request_attempts}"
            echo "- consecutive_failure_count: ${consecutive_failures}"
            echo "- first_failure_at: ${first_failure_at:-none}"
            echo "- cursor_preserved: ${cursor_preserved}"
            echo "- next_retry_at: ${next_retry_at:-none}"
            echo "- escalation_reason: ${escalation_reason:-none}"
            echo "- workflow_run_id: $GITHUB_RUN_ID"
            echo "- workflow_sha: $GITHUB_SHA"
            echo "- storage_error: ${storage_error:-none}"
            echo "- diagnostic_reason: ${diagnostic_reason:-none}"
            echo "- priority_pending_state_errors: ${pending_state_errors}"
            echo "- priority_pending_error_reasons: $(jq -c '.priority_pending_error_reasons // []' gmail-sync-result.json 2>/dev/null || echo '[]')"
            echo "- candidate_diagnostics: $(jq -c '.candidate_diagnostics // {}' gmail-sync-result.json 2>/dev/null || echo '{}')"
            echo "- delivered_count: unknown"
            echo "- failed_count: ${failed}"
          } >> "$GITHUB_STEP_SUMMARY"
