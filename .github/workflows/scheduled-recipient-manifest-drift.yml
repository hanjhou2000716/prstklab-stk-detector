name: Scheduled recipient manifest drift check

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-recipient-manifest-drift
  cancel-in-progress: false

jobs:
  drift:
    name: Compare active subscriber hashes (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install the shared subscription resolver dependency
        run: python -m pip install -r requirements-production.txt
      - name: Check for recipient drift without changing configuration
        env:
          SCHEDULED_RECIPIENT_SET_MANIFEST: ${{ vars.SCHEDULED_RECIPIENT_SET_MANIFEST || '' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SCHEDULED_RECIPIENT_SET_MANIFEST" ]; then
            {
              echo "## Scheduled recipient manifest drift (read-only)"
              echo
              echo "- status: not_configured"
              echo "- reason: repository manifest variable is not initialized"
              echo "- no configuration was changed"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python -m scripts.check_scheduled_recipient_manifest
