name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - '!site/data/**'
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Pages control-plane outages are handled as a degraded deployment by the
    # retry action.  Release-gate and artifact contract failures remain hard
    # failures so invalid data can never look like a successful deployment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install release-gate dependencies
        run: python -m pip install -r requirements-production.txt
      - name: Restore latest immutable data release
        run: |
          python -m src.data_release --restore --branch data-release --include site/data
      - name: Build cache-busted static assets
        run: |
          python -m src.build_assets --root site --build-sha "$GITHUB_SHA"
      - name: Validate static asset contract
        run: |
          python -m src.asset_contract --root site
      - name: Validate release before Pages upload
        run: |
          python -m src.release_gate --manifest site/data/release-manifest.json
      - name: 設定 GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: true
      - name: 上傳儀表板
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
      - name: 部署
        id: deployment
        uses: ./.github/actions/deploy-pages-retry
