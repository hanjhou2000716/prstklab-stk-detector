name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - '!site/data/**'
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Pages control-plane outages are handled as a degraded deployment by the
    # retry action.  Release-gate and artifact contract failures remain hard
    # failures so invalid data can never look like a successful deployment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install release-gate dependencies
        run: python -m pip install -r requirements-production.txt
      - name: Restore newest valid immutable data release
        id: release
        run: |
          # Explicitly refresh the remote-tracking ref and restore the data
          # tree from that ref.  The checkout action can retain a stale
          # remote-tracking ref when a data-only branch is updated between
          # workflow runs; silently validating main's invalid placeholder
          # would make Pages fail with no useful diagnostic.
          git fetch --no-tags origin refs/heads/data-release:refs/remotes/origin/data-release
          python -m src.data_release --restore --branch data-release --include site/data
          git restore --source=origin/data-release --worktree -- site/data/
          # The data branch may contain a market/event snapshot before the
          # matching production research scan. Walk immutable history and
          # select the newest valid release; if none is valid, keep the
          # currently published Pages release instead of failing/emailing.
          # The previous inline guard (manifest.get("status") != "ready") is
          # now enforced for every candidate by src.pages_release.
          python -m src.pages_release --branch data-release --max-commits 100 --require-production-research
      - name: Report preserved Pages release
        if: steps.release.outputs.publish != 'true'
        run: |
          echo "::warning::no_valid_production_release; preserving the currently published Pages release"
          echo "pages_publish=skipped"
      - name: Build cache-busted static assets
        if: steps.release.outputs.publish == 'true'
        env:
          # Keep the Pages→Worker boundary usable when the optional repository
          # variable has not been added yet.  An explicitly configured value
          # still wins; the default is the already deployed canonical Worker.
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL || 'https://prstk-api.hanjhou2000716.workers.dev' }}
        run: |
          python -m src.build_assets --root site --build-sha "$GITHUB_SHA"
      - name: Validate static asset contract
        if: steps.release.outputs.publish == 'true'
        run: |
          python -m src.asset_contract --root site
      - name: Validate release before Pages upload
        if: steps.release.outputs.publish == 'true'
        run: |
          # GITHUB_OUTPUT makes release_gate intentionally quiet; unset it in
          # this diagnostic step so a failed gate leaves actionable errors in
          # the Actions log while retaining fail-closed behaviour.
          env -u GITHUB_OUTPUT python -m src.release_gate --manifest site/data/release-manifest.json --require-production-research
      - name: Audit production artifacts before Pages upload
        if: steps.release.outputs.publish == 'true'
        run: python -m src.runtime_audit --require-production
      - name: 設定 GitHub Pages
        if: steps.release.outputs.publish == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: true
      - name: 上傳儀表板
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
      - name: 部署
        id: deployment
        if: steps.release.outputs.publish == 'true'
        uses: ./.github/actions/deploy-pages-retry
        with:
          fallback_url: ${{ vars.DASHBOARD_URL }}
