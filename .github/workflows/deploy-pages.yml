name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - '!site/data/**'
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # GitHub Actions service outages must not generate a repeated failure storm.
    # A Pages outage is degraded availability; downstream notification workflows
    # retain their own release gate and never send without a verified URL.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: 上傳儀表板
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: 部署
        id: deployment
        uses: ./.github/actions/deploy-pages-retry
