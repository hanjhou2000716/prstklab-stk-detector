name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - '!site/data/**'
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # GitHub Actions service outages must not generate a repeated failure storm.
    # A Pages outage is degraded availability; downstream notification workflows
    # retain their own release gate and never send without a verified URL.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Restore latest immutable data release
        run: |
          python -m src.data_release --restore --branch data-release --include site/data
      - name: Validate release before Pages upload
        run: |
          python -m pip install -r requirements.txt
          python -m src.release_gate --manifest site/data/release-manifest.json
      - name: 設定 GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: true
      - name: 上傳儀表板
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
      - name: 部署
        id: deployment
        uses: ./.github/actions/deploy-pages-retry
