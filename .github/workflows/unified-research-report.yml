name: Unified Taiwan-US research report
on:
  workflow_dispatch:
    inputs:
      taiwan_limit:
        description: Taiwan public symbols per research scan
        required: true
        default: '0'
      us_limit:
        description: US large-cap symbols per research scan
        required: true
        default: '0'
      batch_size:
        description: Symbols per public-data request
        required: true
        default: '50'
      mops_max_refresh:
        description: Taiwan MOPS historical records to refresh per run
        required: true
        # Keep the work incremental, but finish a 0050+0051 pool in days
        # rather than weeks. The job remains bounded by the 55-minute limit.
        default: '24'
  repository_dispatch:
    types: [unified-research-report]
  schedule:
    # Weekdays 13:30 Taiwan time. This leaves a 55-minute window before the
    # 14:45 post-close brief refreshes and deploys the newest research output.
    - cron: '30 5 * * 1-5'
permissions:
  contents: write
concurrency:
  group: unified-research-report
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TAIWAN_LIMIT: ${{ inputs.taiwan_limit || github.event.client_payload.taiwan_limit || '0' }}
      US_LIMIT: ${{ inputs.us_limit || github.event.client_payload.us_limit || '0' }}
      BATCH_SIZE: ${{ inputs.batch_size || github.event.client_payload.batch_size || '50' }}
      MOPS_MAX_REFRESH: ${{ inputs.mops_max_refresh || github.event.client_payload.mops_max_refresh || '24' }}
      NEWS_CACHE_PATH: site/data/news-cache.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: 台股動能研究掃描
        continue-on-error: true
        run: python -m src.run_taiwan_momentum_scan --limit "$TAIWAN_LIMIT" --batch-size "$BATCH_SIZE" --offset 0 --universe-file data/runtime-taiwan-universe.json
      - name: 美股動能研究掃描
        continue-on-error: true
        run: python -m src.run_us_momentum_scan --limit "$US_LIMIT" --batch-size "$BATCH_SIZE"
      - name: 台股裸 K 結構研究掃描
        continue-on-error: true
        run: python -m src.run_taiwan_price_action_scan --limit "$TAIWAN_LIMIT" --batch-size "$BATCH_SIZE" --offset 0 --universe-file data/runtime-taiwan-universe.json
      - name: 美股裸 K 結構研究掃描
        continue-on-error: true
        run: python -m src.run_us_price_action_scan --limit "$US_LIMIT" --batch-size "$BATCH_SIZE"
      - name: 台股三維共振研究掃描
        continue-on-error: true
        run: python -m src.run_resonance_scan --market taiwan --limit "$TAIWAN_LIMIT" --batch-size "$BATCH_SIZE" --offset 0 --universe-file data/runtime-taiwan-universe.json
      - name: 美股三維共振研究掃描
        continue-on-error: true
        run: python -m src.run_resonance_scan --market us --limit "$US_LIMIT" --batch-size "$BATCH_SIZE"
      - name: 台股品質價值覆核
        continue-on-error: true
        run: python -m src.run_value_quality_scan --market taiwan --batch-size "$BATCH_SIZE" --mops-max-refresh "$MOPS_MAX_REFRESH"
      - name: 美股品質價值覆核
        continue-on-error: true
        run: python -m src.run_value_quality_scan --market us --batch-size "$BATCH_SIZE"
      - run: python -m src.run_research_report
      - run: python -m src.refresh_market_data
      - name: 保存最新公開研究摘要
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/research-report.json site/data/market.json site/data/news-cache.json
          git add -f data/taiwan-mops-pristine-history.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh public research report"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "無法在三次嘗試內回存研究摘要。"
              exit 1
            fi

            git fetch origin main
            git rebase -X theirs origin/main
          done
      - uses: actions/upload-artifact@v4
        with:
          name: unified-research-report
          path: |
            data/*scan*.csv
            data/*summary*.json
            data/taiwan-mops-pristine-history.json
            site/data/research-report.json
