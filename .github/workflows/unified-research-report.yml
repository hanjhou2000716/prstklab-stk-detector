name: Unified Taiwan-US research report
on:
  workflow_dispatch:
    inputs:
      taiwan_limit:
        description: Taiwan public symbols per research scan
        required: true
        default: '0'
      us_limit:
        description: US large-cap symbols per research scan
        required: true
        default: '0'
      batch_size:
        description: Symbols per public-data request
        required: true
        default: '50'
      worker_timeout_seconds:
        description: Per-strategy worker timeout before recording a data gap
        required: true
        default: '240'
      mops_max_refresh:
        description: Taiwan MOPS historical records to refresh per run
        required: true
        # A bounded batch is required in production.  Zero means "verify the
        # complete pool" and can spend the entire job timeout on a cold cache;
        # scheduled runs must advance the cache without blocking publication.
        default: '50'
      scan_mode:
        description: production publishes; smoke/debug only upload an isolated artifact
        required: true
        type: choice
        options: [production, smoke, debug]
        default: production
      backtest_release_path:
        description: optional point-in-time walk-forward artifact to bind to this research release
        required: false
        default: ''
      target_market:
        description: Research market for this run; auto follows the scheduled exchange close
        required: false
        type: choice
        options: [auto, taiwan, us, both]
        default: auto
      trading_date:
        description: Optional exchange trading date for a manual catch-up run (YYYY-MM-DD)
        required: false
        default: ''
      target_strategy:
        description: Strategy to scan; resume_incomplete selects only incomplete strategies
        required: false
        type: choice
        options: [all, momentum, price_action, resonance, value]
        default: all
      research_action:
        description: Research action for this run
        required: false
        type: choice
        options: [scan, resume_incomplete, repair_state]
        default: scan
      repair_source_run_id:
        description: Validated historical research run used only by repair_state
        required: false
        default: '33953751631'
  repository_dispatch:
    types: [unified-research-report]
  schedule:
    # Taiwan close (15:30 Taipei). The US checks cover daylight and standard
    # time; research_schedule.py validates the exchange session and slot.
    - cron: '30 7 * * 1-5'
    - cron: '0 18 * * 1-6'
    - cron: '0 19 * * 1-6'
    - cron: '0 20 * * 1-6'
    - cron: '0 21 * * 1-6'
    - cron: '0 22 * * 1-6'
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  # All workflows that publish data-release share one writer lock.  Keeping
  # research in a separate group allowed a refresh/brief workflow to race its
  # immutable snapshot commit and produce non-fast-forward or mixed releases.
  # group: unified-research-report is superseded by the shared writer lock.
  group: main-data-writer-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  # actions/upload-pages-artifact@v3 (pinned SHA is used by the deployment step)
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TAIWAN_LIMIT: ${{ inputs.taiwan_limit || github.event.client_payload.taiwan_limit || '0' }}
      US_LIMIT: ${{ inputs.us_limit || github.event.client_payload.us_limit || '0' }}
      BATCH_SIZE: ${{ inputs.batch_size || github.event.client_payload.batch_size || '50' }}
      MOPS_MAX_REFRESH: ${{ inputs.mops_max_refresh || github.event.client_payload.mops_max_refresh || '50' }}
      SCAN_MODE: ${{ inputs.scan_mode || github.event.client_payload.scan_mode || 'production' }}
      BACKTEST_RELEASE_PATH: ${{ inputs.backtest_release_path || github.event.client_payload.backtest_release_path || '' }}
      TARGET_MARKET: ${{ inputs.target_market || github.event.client_payload.target_market || 'auto' }}
      TRADING_DATE: ${{ inputs.trading_date || github.event.client_payload.trading_date || '' }}
      TARGET_STRATEGY: ${{ inputs.target_strategy || github.event.client_payload.target_strategy || 'all' }}
      RESEARCH_ACTION: ${{ inputs.research_action || github.event.client_payload.research_action || 'scan' }}
      REPAIR_SOURCE_RUN_ID: ${{ inputs.repair_source_run_id || github.event.client_payload.repair_source_run_id || '33953751631' }}
      SCHEDULE_CRON: ${{ github.event.schedule || '' }}
      NEWS_CACHE_PATH: site/data/news-cache.json
      SEC_FACTS_CACHE_PATH: data/sec-companyfacts-cache.json
      DATA_RELEASE_BRANCH: data-release
      RAW_OBSERVATION_ROOT: data/raw-observations
      RAW_OBSERVATION_REQUIRED: "true"
      WORKER_TIMEOUT_SECONDS: ${{ inputs.worker_timeout_seconds || github.event.client_payload.worker_timeout_seconds || '240' }}
      VALUE_INTERNAL_BUDGET_SECONDS: '480'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Wait for production writer queue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m src.writer_queue
      - name: Restore last immutable data release
        run: python -m src.data_release --restore --branch "$DATA_RELEASE_BRANCH" --include site/data --include data/raw-observations --include data/taiwan-mops-pristine-history.json --include data/sec-companyfacts-cache.json
      - name: Save last successful research snapshot
        run: |
          mkdir -p research-artifacts
          if [[ -s site/data/research-report.json ]]; then
            cp site/data/research-report.json research-artifacts/research-report-previous.json
          fi
      - name: Download validated repair source
        if: env.RESEARCH_ACTION == 'repair_state'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research-artifacts/repair-source
          gh run download "$REPAIR_SOURCE_RUN_ID" --name unified-research-report --dir research-artifacts/repair-source
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path
          root = Path("research-artifacts/repair-source")
          candidates = sorted(root.rglob("research-report-latest.json")) + sorted(root.rglob("research-report.json"))
          if not candidates:
              raise SystemExit("validated repair source report was not found")
          source = candidates[0]
          payload = json.loads(source.read_text(encoding="utf-8"))
          if not isinstance(payload, dict) or not payload.get("sources"):
              raise SystemExit("validated repair source report is empty")
          if payload.get("scan_mode") != "production" or len(payload.get("sources", [])) != 8:
              raise SystemExit("validated repair source is not the eight-strategy production matrix")
          from src.production_acceptance import (
              production_research_contract_errors,
              production_strategy_matrix_errors,
          )
          errors = sorted(set(
              production_research_contract_errors(payload)
              + production_strategy_matrix_errors(payload)
          ))
          if errors:
              raise SystemExit("repair source failed production validation: " + "; ".join(errors))
          shutil.copyfile(source, "research-artifacts/repair-source-report.json")
          print(f"repair source: {source}")
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: Resolve exchange target and research slot
        id: research_slot
        run: |
          target="$TARGET_MARKET"
          if [ "$target" = "auto" ]; then
            case "$SCHEDULE_CRON" in
              "30 7 * * 1-5") target="taiwan" ;;
              "0 18 *"|"0 19 *"|"0 20 *"|"0 21 *"|"0 22 *") target="us" ;;
              *) target="both" ;;
            esac
          fi
          echo "TARGET_MARKET=$target" >> "$GITHUB_ENV"
          python - "$target" "${{ github.event_name }}" "$TRADING_DATE" <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          from datetime import UTC, datetime, date
          from src.research_schedule import due_slot
          target, event, requested_date = sys.argv[1:]
          markets = ("taiwan", "us") if target == "both" else (target,)
          if requested_date:
              date.fromisoformat(requested_date)
          if event == "workflow_dispatch" and requested_date:
              slots = [{"market": market, "trading_date": requested_date, "slot_key": f"{market}:{requested_date}:close-research"} for market in markets]
          else:
              slots = [item for market in markets if (item := due_slot(market))]
              if event == "workflow_dispatch" and not slots:
                  today = datetime.now(UTC).date().isoformat()
                  slots = [{"market": market, "trading_date": today, "slot_key": f"{market}:{today}:close-research"} for market in markets]
          print(f"target_market={target}")
          print(f"due={'true' if slots else 'false'}")
          print(f"slot_key={','.join(item['slot_key'] for item in slots)}")
          PY
          echo "RESEARCH_DUE=$(grep '^due=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "RESEARCH_SLOT_KEY=$(grep '^slot_key=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)" >> "$GITHUB_ENV"
      - name: Resolve strategy selection
        if: env.RESEARCH_DUE == 'true'
        run: |
          python - "$TARGET_MARKET" "$TARGET_STRATEGY" "$RESEARCH_ACTION" research-artifacts/research-report-previous.json <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          market, requested, action, previous_path = sys.argv[1:]
          allowed = {"all", "momentum", "price_action", "resonance", "value"}
          actions = {"scan", "resume_incomplete", "repair_state"}
          if requested not in allowed:
              raise SystemExit(f"invalid target_strategy={requested}")
          if action not in actions:
              raise SystemExit(f"invalid research_action={action}")
          markets = {"taiwan", "us"} if market == "both" else {market}
          run = {name: requested in {"all", name} for name in allowed if name != "all"}
          if action == "repair_state":
              run = {name: False for name in run}
          elif action == "resume_incomplete" and requested == "all":
              run = {name: False for name in run}
              try:
                  previous = json.loads(Path(previous_path).read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError):
                  previous = {}
              for source in previous.get("sources", []) if isinstance(previous, dict) else []:
                  if not isinstance(source, dict) or str(source.get("market")) not in markets:
                      continue
                  strategy = str(source.get("strategy") or "")
                  if strategy not in run:
                      continue
                  needs_retry = (
                      source.get("scan_state") != "complete"
                      or source.get("historical_fallback") is True
                      or source.get("strategy_version_state") in {"historical", "unavailable"}
                      or source.get("candidate_state") in {"building", "data_gap", "data_unavailable", "failed"}
                  )
                  run[strategy] = run[strategy] or needs_retry
          for name, enabled in run.items():
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
                  handle.write(f"RUN_{name.upper()}={'true' if enabled else 'false'}\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"RESEARCH_ACTION={action}\nTARGET_STRATEGY={requested}\n")
          print("strategy selection:", ", ".join(name for name, enabled in run.items() if enabled) or "none")
          PY
      - name: Clear previous research scan artifacts for target market
        if: env.RESEARCH_DUE == 'true' && env.RESEARCH_ACTION != 'repair_state'
        run: |
          # Never let a target-market retry reuse its own previous CSV.  The
          # other market is intentionally preserved in the public report as a
          # last-successful historical version when this run is single-market.
          # Legacy contract: rm -f data/*-scan*.csv data/*-summary*.json
          python - "$TARGET_MARKET" <<'PY'
          import sys
          from pathlib import Path
          target = sys.argv[1]
          enabled = ("momentum", "price_action", "resonance", "value")
          file_stems = {"momentum": "momentum", "price_action": "price-action", "resonance": "resonance", "value": "value"}
          import os
          strategies = [name for name in enabled if os.environ.get(f"RUN_{name.upper()}") == "true"]
          markets = ("taiwan", "us") if target == "both" else (target,)
          prefixes = tuple(f"{market}-{file_stems[strategy]}-" for market in markets for strategy in strategies)
          for path in Path("data").glob("*"):
              if path.is_file() and any(path.name.startswith(prefix) and ("-scan" in path.name or "-summary" in path.name) for prefix in prefixes):
                  path.unlink()
          PY
          : > research-artifacts/scan-failures.ndjson
      - name: 台股動能研究掃描
        if: env.RESEARCH_DUE == 'true' && env.RUN_MOMENTUM == 'true' && (env.TARGET_MARKET == 'taiwan' || env.TARGET_MARKET == 'both')
        run: python -m src.research_worker_runner --retries 1 --timeout-seconds "$WORKER_TIMEOUT_SECONDS" --market taiwan --strategy momentum --ledger research-artifacts/scan-failures.ndjson -- python -m src.run_taiwan_momentum_scan --limit "$TAIWAN_LIMIT" --batch-size "$BATCH_SIZE" --offset 0 --universe-file data/runtime-taiwan-universe.json
      - name: 美股動能研究掃描
        if: env.RESEARCH_DUE == 'true' && env.RUN_MOMENTUM == 'true' && (env.TARGET_MARKET == 'us' || env.TARGET_MARKET == 'both')
        run: python -m src.research_worker_runner --retries 1 --timeout-seconds "$WORKER_TIMEOUT_SECONDS" --market us --strategy momentum --ledger research-artifacts/scan-failures.ndjson -- python -m src.run_us_momentum_scan --limit "$US_LIMIT" --batch-size "$BATCH_SIZE"
      - name: 台股裸 K 結構研究掃描
        if: env.RESEARCH_DUE == 'true' && env.RUN_PRICE_ACTION == 'true' && (env.TARGET_MARKET == 'taiwan' || env.TARGET_MARKET == 'both')
        run: python -m src.research_worker_runner --retries 1 --timeout-seconds "$WORKER_TIMEOUT_SECONDS" --market taiwan --strategy price_action --ledger research-artifacts/scan-failures.ndjson -- python -m src.run_taiwan_price_action_scan --limit "$TAIWAN_LIMIT" --batch-size "$BATCH_SIZE" --offset 0 --universe-file data/runtime-taiwan-universe.json
      - name: 美股裸 K 結構研究掃描
        if: env.RESEARCH_DUE == 'true' && env.RUN_PRICE_ACTION == 'true' && (env.TARGET_MARKET == 'us' || env.TARGET_MARKET == 'both')
        run: python -m src.research_worker_runner --retries 1 --timeout-seconds "$WORKER_TIMEOUT_SECONDS" --market us --strategy price_action --ledger research-artifacts/scan-failures.ndjson -- python -m src.run_us_price_action_scan --limit "$US_LIMIT" --batch-size "$BATCH_SIZE"
      - name: 台股三維共振研究掃描
        if: env.RESEARCH_DUE == 'true' && env.RUN_RESONANCE == 'true' && (env.TARGET_MARKET == 'taiwan' || env.TARGET_MARKET == 'both')
        run: python -m src.research_worker_runner --retries 1 --timeout-seconds "$WORKER_TIMEOUT_SECONDS" --market taiwan --strategy resonance --ledger research-artifacts/scan-failures.ndjson -- python -m src.run_resonance_scan --market taiwan --limit "$TAIWAN_LIMIT" --batch-size "$BATCH_SIZE" --offset 0 --universe-file data/runtime-taiwan-universe.json
      - name: 美股三維共振研究掃描
        if: env.RESEARCH_DUE == 'true' && env.RUN_RESONANCE == 'true' && (env.TARGET_MARKET == 'us' || env.TARGET_MARKET == 'both')
        run: python -m src.research_worker_runner --retries 1 --timeout-seconds "$WORKER_TIMEOUT_SECONDS" --market us --strategy resonance --ledger research-artifacts/scan-failures.ndjson -- python -m src.run_resonance_scan --market us --limit "$US_LIMIT" --batch-size "$BATCH_SIZE"
      - name: 台股品質價值覆核
        if: env.RESEARCH_DUE == 'true' && env.RUN_VALUE == 'true' && (env.TARGET_MARKET == 'taiwan' || env.TARGET_MARKET == 'both')
        env:
          WORKER_TIMEOUT_SECONDS: '600'
        run: python -m src.research_worker_runner --retries 1 --timeout-seconds "$WORKER_TIMEOUT_SECONDS" --market taiwan --strategy value --ledger research-artifacts/scan-failures.ndjson -- python -m src.run_value_quality_scan --market taiwan --batch-size "$BATCH_SIZE" --mops-max-refresh "$MOPS_MAX_REFRESH" --time-budget-seconds "$VALUE_INTERNAL_BUDGET_SECONDS" --diagnostics-path research-artifacts/taiwan-value-diagnostics.json
      - name: 美股品質價值覆核
        if: env.RESEARCH_DUE == 'true' && env.RUN_VALUE == 'true' && (env.TARGET_MARKET == 'us' || env.TARGET_MARKET == 'both')
        run: python -m src.research_worker_runner --retries 1 --timeout-seconds "$WORKER_TIMEOUT_SECONDS" --market us --strategy value --ledger research-artifacts/scan-failures.ndjson -- python -m src.run_value_quality_scan --market us --batch-size "$BATCH_SIZE"
      - name: Build research report with optional backtest identity
        if: env.RESEARCH_DUE == 'true'
        run: |
          # Bind the published research snapshot to the exact Actions run and
          # checkout commit.  The report contract still falls back safely for
          # local runs, but production artifacts must never be anonymous.
          args=(
            --scan-mode "$SCAN_MODE"
            --run-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            --source-commit-sha "$GITHUB_SHA"
            --previous-report research-artifacts/research-report-previous.json
            --target-market "$TARGET_MARKET"
            --target-strategy "$TARGET_STRATEGY"
            --research-action "$RESEARCH_ACTION"
            --slot-key "$RESEARCH_SLOT_KEY"
          )
          if [[ -n "$BACKTEST_RELEASE_PATH" ]]; then
            args+=(--backtest-release "$BACKTEST_RELEASE_PATH")
          fi
          if [[ "$RESEARCH_ACTION" == "repair_state" ]]; then
            args+=(--repair-source-report research-artifacts/repair-source-report.json)
          fi
          python -m src.run_research_report "${args[@]}" --scan-failures research-artifacts/scan-failures.ndjson
      - name: Gate research publication and preserve previous success
        id: research_gate
        if: env.SCAN_MODE == 'production' && env.RESEARCH_DUE == 'true'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from src.production_acceptance import (
              production_research_contract_errors,
              production_strategy_matrix_errors,
          )
          from src.research_fallback import mark_stale_research_fallback
          report = json.loads(Path("site/data/research-report.json").read_text(encoding="utf-8"))
          contract_errors = sorted(set(
              production_research_contract_errors(report)
              + production_strategy_matrix_errors(report)
          ))
          eligible = (
              (report.get("production_eligible") is True or report.get("publication_state") == "mixed_strategy")
              and report.get("publish_eligible") is True
              and not contract_errors
          )
          cache_required = any(
              item.get("eligible") is not True and not item.get("unscanned_in_run")
              for item in report.get("strategy_publication", [])
              if isinstance(item, dict)
          )
          Path("research-artifacts/research-report-latest.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          summary_lines = ["## 研究策略更新", "", f"- publication_state: `{report.get('publication_state')}`", f"- target_market: `{report.get('target_market')}`", "", "| 市場 | 策略 | 狀態 | 發布 | 歷史版本 | 阻擋原因 |", "|---|---|---|---|---|---|"]
          source_by_key = {(str(item.get('market')), str(item.get('strategy'))): item for item in report.get('sources', []) if isinstance(item, dict)}
          for item in report.get('strategy_publication', []):
              key = (str(item.get('market')), str(item.get('strategy')))
              source = source_by_key.get(key, {})
              reason = str(item.get('blocking_reason') or source.get('blocking_reason') or '').replace('|', '/')[:160]
              summary_lines.append(f"| {key[0]} | {key[1]} | {source.get('scan_state', item.get('state'))} | {'yes' if item.get('eligible') else 'no'} | {'yes' if item.get('historical_fallback') else 'no'} | {reason} |")
          Path(os.environ.get("GITHUB_STEP_SUMMARY", "research-artifacts/research-summary.md")).write_text("\n".join(summary_lines) + "\n", encoding="utf-8")
          output = Path(os.environ["GITHUB_OUTPUT"])
          if eligible:
              output.open("a", encoding="utf-8").write("publish=true\n")
              output.open("a", encoding="utf-8").write("fallback=false\n")
              print("Research scan is complete and eligible for publication.")
          else:
              previous = Path("research-artifacts/research-report-previous.json")
              reason = report.get("blocking_reason") or (contract_errors[0] if contract_errors else "research scan is incomplete")
              if previous.is_file():
                  previous_report = json.loads(previous.read_text(encoding="utf-8"))
                  fallback = mark_stale_research_fallback(previous_report, reason)
                  Path("site/data/research-report.json").write_text(
                      json.dumps(fallback, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
                  )
                  # Keep the fallback only as a diagnostic artifact. A new
                  # market refresh must never be repackaged with old research
                  # and published as a ready release.
                  output.open("a", encoding="utf-8").write("publish=false\n")
                  output.open("a", encoding="utf-8").write("fallback=true\n")
                  print(f"::warning::{reason}; no public release will be published")
              else:
                  output.open("a", encoding="utf-8").write("publish=false\n")
                  output.open("a", encoding="utf-8").write("fallback=false\n")
                  print("::warning::research scan is incomplete and no previous successful snapshot exists")
          output.open("a", encoding="utf-8").write(f"cache_required={'true' if cache_required else 'false'}\n")
          if cache_required:
              print("::warning::incomplete strategy cache must be persisted for the next continuation run")
          PY
      - name: Recheck production revision before persistence
        if: env.SCAN_MODE == 'production'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m src.writer_queue --settle-seconds 0 --poll-seconds 10
      - name: Persist incremental research caches
        if: env.SCAN_MODE == 'production' && (steps.research_gate.outputs.publish != 'true' || steps.research_gate.outputs.cache_required == 'true')
        run: |
          # Any incomplete strategy must persist its verified records even when
          # the other strategies form a valid mixed public release.  This is a
          # cache-only publication and never writes site/data or a
          # Telegram-eligible release.
          python -m src.data_release --publish --branch "$DATA_RELEASE_BRANCH" \
            --include data/taiwan-mops-pristine-history.json \
            --include data/sec-companyfacts-cache.json \
            --include data/raw-observations \
            --message "chore: persist bounded research caches"
      - run: python -m src.refresh_market_data
      - name: Build release manifest
        if: env.SCAN_MODE == 'production' && steps.research_gate.outputs.publish == 'true'
        run: |
          if [[ "${{ steps.research_gate.outputs.fallback }}" == "true" ]]; then
            args=(--allow-stale-research --research-fallback-reason "research scan incomplete; stale fallback")
          else
            args=(--require-production-research)
          fi
          python -m src.release_manifest "${args[@]}"
      - name: 保存最新公開研究摘要
        if: env.SCAN_MODE != 'production' || steps.research_gate.outputs.publish == 'true'
        run: |
          if [[ "$SCAN_MODE" == "production" ]]; then
            python -m src.data_release --publish --branch "$DATA_RELEASE_BRANCH" --include site/data --include data/raw-observations --include data/taiwan-mops-pristine-history.json --include data/sec-companyfacts-cache.json --message "chore: refresh public research report"
          else
            echo "scan_mode=$SCAN_MODE: isolated artifact only; skipping data-release publication"
          fi
      - name: Build and validate cache-busted static assets
        if: env.SCAN_MODE == 'production' && steps.research_gate.outputs.publish == 'true'
        run: |
          python -m src.build_assets --root site --build-sha "$GITHUB_SHA"
          python -m src.asset_contract --root site
      - name: Configure GitHub Pages
        if: env.SCAN_MODE == 'production' && steps.research_gate.outputs.publish == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload Pages artifact
        if: env.SCAN_MODE == 'production' && steps.research_gate.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        if: env.SCAN_MODE == 'production' && steps.research_gate.outputs.publish == 'true'
        uses: ./.github/actions/deploy-pages-retry
