name: Unified Taiwan-US research report
on:
  workflow_dispatch:
    inputs:
      taiwan_limit:
        description: Taiwan public symbols per research scan
        required: true
        default: '0'
      us_limit:
        description: US large-cap symbols per research scan
        required: true
        default: '0'
      batch_size:
        description: Symbols per public-data request
        required: true
        default: '50'
      worker_timeout_seconds:
        description: Per-strategy worker timeout before recording a data gap
        required: true
        default: '240'
      scan_mode:
        description: production publishes; smoke/debug only upload an isolated artifact
        required: true
        type: choice
        options: [production, smoke, debug]
        default: production
      backtest_release_path:
        description: optional point-in-time walk-forward artifact to bind to this research release
        required: false
        default: ''
      target_market:
        description: Research market for this run; auto follows the scheduled exchange close
        required: false
        type: choice
        options: [auto, taiwan, us, both]
        default: auto
      trading_date:
        description: Optional exchange trading date for a manual catch-up run (YYYY-MM-DD)
        required: false
        default: ''
      target_strategy:
        description: Strategy to scan; resume_incomplete selects only incomplete strategies
        required: false
        type: choice
        options: [all, momentum, price_action, resonance, value]
        default: all
      research_action:
        description: Research action for this run
        required: false
        type: choice
        options: [scan, resume_incomplete, repair_state]
        default: scan
  repository_dispatch:
    types: [unified-research-report]
  schedule:
    # Taiwan close (15:30 Taipei). The US checks cover daylight and standard
    # time; research_schedule.py validates the exchange session and slot.
    - cron: '30 7 * * 1-5'
    - cron: '0 18 * * 1-6'
    - cron: '0 19 * * 1-6'
    - cron: '0 20 * * 1-6'
    - cron: '0 21 * * 1-6'
    - cron: '0 22 * * 1-6'
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  # All workflows that publish data-release share one writer lock.  Keeping
  # research in a separate group allowed a refresh/brief workflow to race its
  # immutable snapshot commit and produce non-fast-forward or mixed releases.
  # group: unified-research-report is superseded by the shared writer lock.
  group: main-data-writer-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  # actions/upload-pages-artifact@v3 (pinned SHA is used by the deployment step)
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TAIWAN_LIMIT: ${{ inputs.taiwan_limit || github.event.client_payload.taiwan_limit || '0' }}
      US_LIMIT: ${{ inputs.us_limit || github.event.client_payload.us_limit || '0' }}
      BATCH_SIZE: ${{ inputs.batch_size || github.event.client_payload.batch_size || '50' }}
      MOPS_MAX_REFRESH: ${{ github.event.client_payload.mops_max_refresh || '50' }}
      SCAN_MODE: ${{ inputs.scan_mode || github.event.client_payload.scan_mode || 'production' }}
      BACKTEST_RELEASE_PATH: ${{ inputs.backtest_release_path || github.event.client_payload.backtest_release_path || '' }}
      TARGET_MARKET: ${{ inputs.target_market || github.event.client_payload.target_market || 'auto' }}
      TRADING_DATE: ${{ inputs.trading_date || github.event.client_payload.trading_date || '' }}
      TARGET_STRATEGY: ${{ inputs.target_strategy || github.event.client_payload.target_strategy || 'all' }}
      RESEARCH_ACTION: ${{ inputs.research_action || github.event.client_payload.research_action || (github.event_name == 'schedule' && 'resume_incomplete') || 'scan' }}
      REPAIR_SOURCE_RUN_ID: ${{ github.event.client_payload.repair_source_run_id || '33953751631' }}
      SCHEDULE_CRON: ${{ github.event.schedule || '' }}
      NEWS_CACHE_PATH: site/data/news-cache.json
      SEC_FACTS_CACHE_PATH: data/sec-companyfacts-cache.json
      DATA_RELEASE_BRANCH: data-release
      RAW_OBSERVATION_ROOT: data/raw-observations
      RAW_OBSERVATION_REQUIRED: "true"
      WORKER_TIMEOUT_SECONDS: ${{ inputs.worker_timeout_seconds || github.event.client_payload.worker_timeout_seconds || '240' }}
      VALUE_INTERNAL_BUDGET_SECONDS: '480'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Restore last immutable data release
        run: python -m src.data_release --restore --branch "$DATA_RELEASE_BRANCH" --include site/data --include data/raw-observations --include data/taiwan-mops-pristine-history.json --include data/taiwan-official-financial-cache.json --include data/research-attempts.json --include data/sec-companyfacts-cache.json
      - name: Capture prepared release base
        id: prepared_base
        run: |
          git fetch --no-tags origin "refs/heads/${DATA_RELEASE_BRANCH}:refs/remotes/origin/${DATA_RELEASE_BRANCH}"
          echo "data_release_sha=$(git rev-parse "refs/remotes/origin/${DATA_RELEASE_BRANCH}")" >> "$GITHUB_OUTPUT"
      - name: Save last successful research snapshot
        run: |
          mkdir -p research-artifacts
          if [[ -s site/data/research-report.json ]]; then
            cp site/data/research-report.json research-artifacts/research-report-previous.json
          fi
      - name: Download validated repair source
        if: env.RESEARCH_ACTION == 'repair_state'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research-artifacts/repair-source
          gh run download "$REPAIR_SOURCE_RUN_ID" --name unified-research-report --dir research-artifacts/repair-source
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path
          root = Path("research-artifacts/repair-source")
          candidates = sorted(root.rglob("research-report-latest.json")) + sorted(root.rglob("research-report.json"))
          if not candidates:
              raise SystemExit("validated repair source report was not found")
          source = candidates[0]
          payload = json.loads(source.read_text(encoding="utf-8"))
          if not isinstance(payload, dict) or not payload.get("sources"):
              raise SystemExit("validated repair source report is empty")
          if payload.get("scan_mode") != "production" or len(payload.get("sources", [])) != 8:
              raise SystemExit("validated repair source is not the eight-strategy production matrix")
          from src.production_acceptance import (
              production_research_contract_errors,
              production_strategy_matrix_errors,
          )
          errors = sorted(set(
              production_research_contract_errors(payload)
              + production_strategy_matrix_errors(payload)
          ))
          if errors:
              raise SystemExit("repair source failed production validation: " + "; ".join(errors))
          shutil.copyfile(source, "research-artifacts/repair-source-report.json")
          print(f"repair source: {source}")
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: Resolve exchange target and research slot
        id: research_slot
        run: |
          target="$TARGET_MARKET"
          if [ "$target" = "auto" ]; then
            case "$SCHEDULE_CRON" in
              "30 7 * * 1-5") target="taiwan" ;;
              "0 18 * * 1-6"|"0 19 * * 1-6"|"0 20 * * 1-6"|"0 21 * * 1-6"|"0 22 * * 1-6") target="us" ;;
              *) target="both" ;;
            esac
          fi
          echo "TARGET_MARKET=$target" >> "$GITHUB_ENV"
          python - "$target" "${{ github.event_name }}" "$TRADING_DATE" <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          from datetime import UTC, datetime, date
          from src.research_schedule import due_slot
          target, event, requested_date = sys.argv[1:]
          markets = ("taiwan", "us") if target == "both" else (target,)
          if requested_date:
              date.fromisoformat(requested_date)
          if event == "workflow_dispatch" and requested_date:
              slots = [{"market": market, "trading_date": requested_date, "slot_key": f"{market}:{requested_date}:close-research"} for market in markets]
          else:
              slots = [item for market in markets if (item := due_slot(market))]
              if event == "workflow_dispatch" and not slots:
                  today = datetime.now(UTC).date().isoformat()
                  slots = [{"market": market, "trading_date": today, "slot_key": f"{market}:{today}:close-research"} for market in markets]
          print(f"target_market={target}")
          print(f"due={'true' if slots else 'false'}")
          print(f"slot_key={','.join(item['slot_key'] for item in slots)}")
          PY
          echo "RESEARCH_DUE=$(grep '^due=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "RESEARCH_SLOT_KEY=$(grep '^slot_key=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)" >> "$GITHUB_ENV"
      - name: Resolve strategy selection
        id: strategy_selection
        if: env.RESEARCH_DUE == 'true'
        run: >-
          python -m src.research_selection
          --target-market "$TARGET_MARKET"
          --target-strategy "$TARGET_STRATEGY"
          --action "$RESEARCH_ACTION"
          --slot-key "$RESEARCH_SLOT_KEY"
          --previous-report research-artifacts/research-report-previous.json
          --attempts data/research-attempts.json
      - name: Clear previous research scan artifacts for target market
        if: env.RESEARCH_DUE == 'true' && env.RESEARCH_ACTION != 'repair_state'
        run: |
          # Never let a target-market retry reuse its own previous CSV.  The
          # other market is intentionally preserved in the public report as a
          # last-successful historical version when this run is single-market.
          # Legacy contract: rm -f data/*-scan*.csv data/*-summary*.json
          python - "$TARGET_MARKET" <<'PY'
          import sys
          from pathlib import Path
          target = sys.argv[1]
          enabled = ("momentum", "price_action", "resonance", "value")
          file_stems = {"momentum": "momentum", "price_action": "price-action", "resonance": "resonance", "value": "value"}
          import os
          markets = ("taiwan", "us") if target == "both" else (target,)
          prefixes = tuple(
              f"{market}-{file_stems[strategy]}-"
              for market in markets for strategy in enabled
              if os.environ.get(f"RUN_{market.upper()}_{strategy.upper()}") == "true"
          )
          for path in Path("data").glob("*"):
              if path.is_file() and any(path.name.startswith(prefix) and ("-scan" in path.name or "-summary" in path.name) for prefix in prefixes):
                  path.unlink()
          PY
          : > research-artifacts/scan-failures.ndjson
      - name: 台股動能研究掃描
        if: env.RESEARCH_DUE == 'true' && env.RUN_TAIWAN_MOMENTUM == 'true'
        id: scan_tw_momentum
        run: python -m src.research_worker_runner --retries 1 --timeout-seconds "$WORKER_TIMEOUT_SECONDS" --market taiwan --strategy momentum --ledger research-artifacts/scan-failures.ndjson -- python -m src.run_taiwan_momentum_scan --limit "$TAIWAN_LIMIT" --batch-size "$BATCH_SIZE" --offset 0 --universe-file data/runtime-taiwan-universe.json
      - name: 美股動能研究掃描
        if: env.RESEARCH_DUE == 'true' && env.RUN_US_MOMENTUM == 'true'
        id: scan_us_momentum
        run: python -m src.research_worker_runner --retries 1 --timeout-seconds "$WORKER_TIMEOUT_SECONDS" --market us --strategy momentum --ledger research-artifacts/scan-failures.ndjson -- python -m src.run_us_momentum_scan --limit "$US_LIMIT" --batch-size "$BATCH_SIZE"
      - name: 台股裸 K 結構研究掃描
        if: env.RESEARCH_DUE == 'true' && env.RUN_TAIWAN_PRICE_ACTION == 'true'
        id: scan_tw_price_action
        run: python -m src.research_worker_runner --retries 1 --timeout-seconds "$WORKER_TIMEOUT_SECONDS" --market taiwan --strategy price_action --ledger research-artifacts/scan-failures.ndjson -- python -m src.run_taiwan_price_action_scan --limit "$TAIWAN_LIMIT" --batch-size "$BATCH_SIZE" --offset 0 --universe-file data/runtime-taiwan-universe.json
      - name: 美股裸 K 結構研究掃描
        if: env.RESEARCH_DUE == 'true' && env.RUN_US_PRICE_ACTION == 'true'
        id: scan_us_price_action
        run: python -m src.research_worker_runner --retries 1 --timeout-seconds "$WORKER_TIMEOUT_SECONDS" --market us --strategy price_action --ledger research-artifacts/scan-failures.ndjson -- python -m src.run_us_price_action_scan --limit "$US_LIMIT" --batch-size "$BATCH_SIZE"
      - name: 台股三維共振研究掃描
        if: env.RESEARCH_DUE == 'true' && env.RUN_TAIWAN_RESONANCE == 'true'
        id: scan_tw_resonance
        run: python -m src.research_worker_runner --retries 1 --timeout-seconds "$WORKER_TIMEOUT_SECONDS" --market taiwan --strategy resonance --ledger research-artifacts/scan-failures.ndjson -- python -m src.run_resonance_scan --market taiwan --limit "$TAIWAN_LIMIT" --batch-size "$BATCH_SIZE" --offset 0 --universe-file data/runtime-taiwan-universe.json
      - name: 美股三維共振研究掃描
        if: env.RESEARCH_DUE == 'true' && env.RUN_US_RESONANCE == 'true'
        id: scan_us_resonance
        run: python -m src.research_worker_runner --retries 1 --timeout-seconds "$WORKER_TIMEOUT_SECONDS" --market us --strategy resonance --ledger research-artifacts/scan-failures.ndjson -- python -m src.run_resonance_scan --market us --limit "$US_LIMIT" --batch-size "$BATCH_SIZE"
      - name: 台股品質價值覆核
        if: env.RESEARCH_DUE == 'true' && env.RUN_TAIWAN_VALUE == 'true'
        id: scan_tw_value
        env:
          WORKER_TIMEOUT_SECONDS: '600'
        run: python -m src.research_worker_runner --retries 1 --timeout-seconds "$WORKER_TIMEOUT_SECONDS" --market taiwan --strategy value --ledger research-artifacts/scan-failures.ndjson -- python -m src.run_value_quality_scan --market taiwan --batch-size "$BATCH_SIZE" --mops-max-refresh "$MOPS_MAX_REFRESH" --time-budget-seconds "$VALUE_INTERNAL_BUDGET_SECONDS" --diagnostics-path research-artifacts/taiwan-value-diagnostics.json
      - name: 美股品質價值覆核
        if: env.RESEARCH_DUE == 'true' && env.RUN_US_VALUE == 'true'
        id: scan_us_value
        run: python -m src.research_worker_runner --retries 1 --timeout-seconds "$WORKER_TIMEOUT_SECONDS" --market us --strategy value --ledger research-artifacts/scan-failures.ndjson -- python -m src.run_value_quality_scan --market us --batch-size "$BATCH_SIZE"
      - name: Build research report with optional backtest identity
        if: env.RESEARCH_DUE == 'true'
        run: |
          # Bind the published research snapshot to the exact Actions run and
          # checkout commit.  The report contract still falls back safely for
          # local runs, but production artifacts must never be anonymous.
          args=(
            --scan-mode "$SCAN_MODE"
            --run-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            --source-commit-sha "$GITHUB_SHA"
            --previous-report research-artifacts/research-report-previous.json
            --target-market "$TARGET_MARKET"
            --target-strategy "$TARGET_STRATEGY"
            --research-action "$RESEARCH_ACTION"
            --slot-key "$RESEARCH_SLOT_KEY"
            --selected-strategies "$SCANNED_STRATEGIES"
            --selected-pairs "$SCANNED_PAIRS"
          )
          if [[ -n "$BACKTEST_RELEASE_PATH" ]]; then
            args+=(--backtest-release "$BACKTEST_RELEASE_PATH")
          fi
          if [[ "$RESEARCH_ACTION" == "repair_state" ]]; then
            args+=(--repair-source-report research-artifacts/repair-source-report.json)
          fi
          python -m src.run_research_report "${args[@]}" --scan-failures research-artifacts/scan-failures.ndjson
      - name: Gate research publication and preserve previous success
        id: research_gate
        if: env.SCAN_MODE == 'production' && env.RESEARCH_DUE == 'true'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from src.production_acceptance import (
              production_research_contract_errors,
              production_strategy_matrix_errors,
          )
          from src.research_fallback import mark_stale_research_fallback
          report = json.loads(Path("site/data/research-report.json").read_text(encoding="utf-8"))
          contract_errors = sorted(set(
              production_research_contract_errors(report)
              + production_strategy_matrix_errors(report)
          ))
          eligible = (
              (report.get("production_eligible") is True or report.get("publication_state") == "mixed_strategy")
              and report.get("publish_eligible") is True
              and not contract_errors
          )
          cache_required = any(
              item.get("eligible") is not True and not item.get("unscanned_in_run")
              for item in report.get("strategy_publication", [])
              if isinstance(item, dict)
          )
          Path("research-artifacts/research-report-latest.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          summary_lines = ["## 研究策略更新", "", f"- publication_state: `{report.get('publication_state')}`", f"- target_market: `{report.get('target_market')}`", "", "| 市場 | 策略 | 狀態 | 發布 | 歷史版本 | 阻擋原因 |", "|---|---|---|---|---|---|"]
          source_by_key = {(str(item.get('market')), str(item.get('strategy'))): item for item in report.get('sources', []) if isinstance(item, dict)}
          for item in report.get('strategy_publication', []):
              key = (str(item.get('market')), str(item.get('strategy')))
              source = source_by_key.get(key, {})
              reason = str(item.get('blocking_reason') or source.get('blocking_reason') or '').replace('|', '/')[:160]
              summary_lines.append(f"| {key[0]} | {key[1]} | {source.get('scan_state', item.get('state'))} | {'yes' if item.get('eligible') else 'no'} | {'yes' if item.get('historical_fallback') else 'no'} | {reason} |")
          Path(os.environ.get("GITHUB_STEP_SUMMARY", "research-artifacts/research-summary.md")).write_text("\n".join(summary_lines) + "\n", encoding="utf-8")
          output = Path(os.environ["GITHUB_OUTPUT"])
          if eligible:
              output.open("a", encoding="utf-8").write("publish=true\n")
              output.open("a", encoding="utf-8").write("fallback=false\n")
              print("Research scan is complete and eligible for publication.")
          else:
              previous = Path("research-artifacts/research-report-previous.json")
              reason = report.get("blocking_reason") or (contract_errors[0] if contract_errors else "research scan is incomplete")
              if previous.is_file():
                  previous_report = json.loads(previous.read_text(encoding="utf-8"))
                  fallback = mark_stale_research_fallback(previous_report, reason)
                  Path("site/data/research-report.json").write_text(
                      json.dumps(fallback, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
                  )
                  # Keep the fallback only as a diagnostic artifact. A new
                  # market refresh must never be repackaged with old research
                  # and published as a ready release.
                  output.open("a", encoding="utf-8").write("publish=false\n")
                  output.open("a", encoding="utf-8").write("fallback=true\n")
                  print(f"::warning::{reason}; no public release will be published")
              else:
                  output.open("a", encoding="utf-8").write("publish=false\n")
                  output.open("a", encoding="utf-8").write("fallback=false\n")
                  print("::warning::research scan is incomplete and no previous successful snapshot exists")
          output.open("a", encoding="utf-8").write(f"cache_required={'true' if cache_required else 'false'}\n")
          if cache_required:
              print("::warning::incomplete strategy cache must be persisted for the next continuation run")
          PY
      - name: Refresh market data for prepared release
        if: env.SCAN_MODE == 'production' && env.RESEARCH_DUE == 'true'
        run: python -m src.refresh_market_data
      - name: Record publication admission
        id: publication_admission
        if: env.SCAN_MODE == 'production' && env.RESEARCH_DUE == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m src.writer_queue --create-admission
      - name: Upload publication admission evidence
        id: publication_admission_artifact
        if: steps.publication_admission.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: writer-publication-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: writer-publication-admission.json
          if-no-files-found: error
          retention-days: 14
      - name: Recheck production revision before persistence
        id: writer_queue
        if: env.SCAN_MODE == 'production' && steps.publication_admission_artifact.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m src.writer_queue --settle-seconds 0 --poll-seconds 10
      - name: Revalidate prepared release base
        id: prepared_release
        if: steps.writer_queue.outputs.should_continue == 'true'
        run: |
          git fetch --no-tags origin "refs/heads/${DATA_RELEASE_BRANCH}:refs/remotes/origin/${DATA_RELEASE_BRANCH}"
          current_sha="$(git rev-parse "refs/remotes/origin/${DATA_RELEASE_BRANCH}")"
          if [ "$current_sha" != "${{ steps.prepared_base.outputs.data_release_sha }}" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "reason=stale_prepared_release" >> "$GITHUB_OUTPUT"
            echo "::notice::Prepared research snapshot was based on an older immutable release; publication deferred to the next run."
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "reason=prepared_release_current" >> "$GITHUB_OUTPUT"
          fi
      - name: Persist research attempt lease
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && env.RESEARCH_DUE == 'true' && env.SCAN_MODE == 'production' && env.RESEARCH_ACTION != 'repair_state'
        id: persist_research_attempt
        run: |
          python -m src.data_release --publish --branch "$DATA_RELEASE_BRANCH" \
            --include data/research-attempts.json \
            --expected-base-sha "${{ steps.prepared_base.outputs.data_release_sha }}" \
            --message "chore: persist research slot attempt"
      - name: Persist incremental research caches
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && env.SCAN_MODE == 'production' && (steps.research_gate.outputs.publish != 'true' || steps.research_gate.outputs.cache_required == 'true')
        id: persist_incremental_caches
        run: |
          # Any incomplete strategy must persist its verified records even when
          # the other strategies form a valid mixed public release.  This is a
          # cache-only publication and never writes site/data or a
          # Telegram-eligible release.
          python -m src.data_release --publish --branch "$DATA_RELEASE_BRANCH" \
            --include data/taiwan-mops-pristine-history.json \
            --include data/taiwan-official-financial-cache.json \
            --include data/research-attempts.json \
            --include data/sec-companyfacts-cache.json \
            --include data/raw-observations \
            --expected-base-sha "${{ steps.persist_research_attempt.outputs.data_release_published_sha || steps.prepared_base.outputs.data_release_sha }}" \
            --message "chore: persist bounded research caches"
      - name: Build release manifest
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && env.SCAN_MODE == 'production' && steps.research_gate.outputs.publish == 'true'
        run: |
          if [[ "${{ steps.research_gate.outputs.fallback }}" == "true" ]]; then
            args=(--allow-stale-research --research-fallback-reason "research scan incomplete; stale fallback")
          else
            args=(--require-production-research)
          fi
          python -m src.release_manifest "${args[@]}"
      - name: 保存最新公開研究摘要
        if: env.SCAN_MODE != 'production' || (steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && steps.research_gate.outputs.publish == 'true')
        run: |
          if [[ "$SCAN_MODE" == "production" ]]; then
            python -m src.data_release --publish --branch "$DATA_RELEASE_BRANCH" --include site/data --include data/raw-observations --include data/taiwan-mops-pristine-history.json --include data/taiwan-official-financial-cache.json --include data/research-attempts.json --include data/sec-companyfacts-cache.json \
              --expected-base-sha "${{ steps.persist_incremental_caches.outputs.data_release_published_sha || steps.persist_research_attempt.outputs.data_release_published_sha || steps.prepared_base.outputs.data_release_sha }}" \
              --message "chore: refresh public research report"
          else
            echo "scan_mode=$SCAN_MODE: isolated artifact only; skipping data-release publication"
          fi
      - name: Build and validate cache-busted static assets
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && env.SCAN_MODE == 'production' && steps.research_gate.outputs.publish == 'true'
        run: |
          python -m src.build_assets --root site --build-sha "$GITHUB_SHA"
          python -m src.asset_contract --root site
      - name: Configure GitHub Pages
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && env.SCAN_MODE == 'production' && steps.research_gate.outputs.publish == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload Pages artifact
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && env.SCAN_MODE == 'production' && steps.research_gate.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && env.SCAN_MODE == 'production' && steps.research_gate.outputs.publish == 'true'
        uses: ./.github/actions/deploy-pages-retry
        with:
          phase: unified_research_report
      - name: Verify public research release after deployment
        if: steps.writer_queue.outputs.should_continue == 'true' && steps.prepared_release.outputs.current == 'true' && env.SCAN_MODE == 'production' && steps.research_gate.outputs.publish == 'true' && steps.deployment.outputs.available == 'true'
        id: public_release_gate
        run: >-
          python -m src.release_gate
          --manifest site/data/release-manifest.json
          --public-url "${{ steps.deployment.outputs.page_url }}"
          --public-timeout-seconds 180
          --public-delay 2
          --public-max-delay 20
          >> "$GITHUB_OUTPUT"
      - name: Finalize Pages deployment public observation
        if: always() && steps.deployment.outputs.binding_path != ''
        uses: ./.github/actions/finalize-pages-deployment-binding
        with:
          binding_path: ${{ steps.deployment.outputs.binding_path }}
          phase: unified_research_report
          gate_outcome: ${{ steps.public_release_gate.outcome || 'not_run' }}
          gate_allowed: ${{ steps.public_release_gate.outputs.allowed || 'false' }}
          gate_status: ${{ steps.public_release_gate.outputs.gate_status || 'not_run' }}
          expected_release_id: ${{ steps.public_release_gate.outputs.expected_release_id || steps.public_release_gate.outputs.release_id || '' }}
          actual_release_id: ${{ steps.public_release_gate.outputs.actual_release_id || steps.public_release_gate.outputs.release_id || '' }}
          expected_snapshot_id: ${{ steps.public_release_gate.outputs.expected_snapshot_id || steps.public_release_gate.outputs.snapshot_id || '' }}
          actual_snapshot_id: ${{ steps.public_release_gate.outputs.actual_snapshot_id || steps.public_release_gate.outputs.snapshot_id || '' }}
          http_status: ${{ steps.public_release_gate.outputs.http_status || '' }}
          attempts: ${{ steps.public_release_gate.outputs.attempts || '[]' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unified-research-report
          path: |
            data/*scan*.csv
            data/*summary*.json
            data/taiwan-mops-pristine-history.json
            data/taiwan-official-financial-cache.json
            data/research-attempts.json
            data/sec-companyfacts-cache.json
            site/data/research-report.json
            research-artifacts
      - name: Publish writer queue decision
        if: always()
        env:
          QUEUE_STATUS: ${{ steps.writer_queue.outputs.queue_status || 'not_required' }}
          QUEUE_REASON: ${{ steps.writer_queue.outputs.reason || 'not_required' }}
          PREPARED_RELEASE_STATUS: ${{ steps.prepared_release.outputs.reason || 'not_required' }}
        run: |
          notification_status="not_applicable"
          notification_reason="${QUEUE_REASON}"
          if [ "${QUEUE_STATUS}" = "superseded" ]; then
            notification_status="suppressed"
            notification_reason="stale_workflow_superseded"
          elif [ "${PREPARED_RELEASE_STATUS}" = "stale_prepared_release" ]; then
            notification_status="suppressed"
            notification_reason="stale_prepared_release"
          fi
          {
            echo "## Writer queue decision"
            echo "- queue_status: ${QUEUE_STATUS}"
            echo "- reason: ${QUEUE_REASON}"
            echo "- prepared_release_status: ${PREPARED_RELEASE_STATUS}"
            echo "- notification_status: ${notification_status}"
            echo "- notification_reason: ${notification_reason}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve run-bound research incident result
        id: research_terminal
        if: always()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
          SCAN_MODE: ${{ env.SCAN_MODE }}
          RESEARCH_DUE: ${{ env.RESEARCH_DUE }}
          RESEARCH_NOOP: ${{ env.RESEARCH_NOOP || 'false' }}
          RESEARCH_SELECTION_STATUS: ${{ env.RESEARCH_SELECTION_STATUS || 'unknown' }}
          RESEARCH_SELECTION_REASON: ${{ env.RESEARCH_SELECTION_REASON || '' }}
          RESEARCH_SELECTION_PATH: research-artifacts/research-selection.json
          RESEARCH_REPORT_PATH: site/data/research-report.json
          OUTCOME_TW_MOMENTUM: ${{ steps.scan_tw_momentum.outcome || 'skipped' }}
          OUTCOME_US_MOMENTUM: ${{ steps.scan_us_momentum.outcome || 'skipped' }}
          OUTCOME_TW_PRICE_ACTION: ${{ steps.scan_tw_price_action.outcome || 'skipped' }}
          OUTCOME_US_PRICE_ACTION: ${{ steps.scan_us_price_action.outcome || 'skipped' }}
          OUTCOME_TW_RESONANCE: ${{ steps.scan_tw_resonance.outcome || 'skipped' }}
          OUTCOME_US_RESONANCE: ${{ steps.scan_us_resonance.outcome || 'skipped' }}
          OUTCOME_TW_VALUE: ${{ steps.scan_tw_value.outcome || 'skipped' }}
          OUTCOME_US_VALUE: ${{ steps.scan_us_value.outcome || 'skipped' }}
          QUEUE_STATUS: ${{ steps.writer_queue.outputs.queue_status || 'not_required' }}
          QUEUE_ERROR_CODE: ${{ steps.writer_queue.outputs.queue_error_code || '' }}
          RESEARCH_GATE_OUTCOME: ${{ steps.research_gate.outcome || 'skipped' }}
          RESEARCH_GATE_PUBLISH: ${{ steps.research_gate.outputs.publish || 'false' }}
          RESEARCH_GATE_FALLBACK: ${{ steps.research_gate.outputs.fallback || 'false' }}
          RESEARCH_GATE_REASON: ${{ steps.research_gate.outputs.reason || '' }}
          PREPARED_RELEASE_OUTCOME: ${{ steps.prepared_release.outcome || 'skipped' }}
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome || 'skipped' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          mode = os.environ.get("SCAN_MODE", "unknown")
          queue_status = os.environ.get("QUEUE_STATUS", "unknown")
          due = os.environ.get("RESEARCH_DUE") == "true"
          no_op = os.environ.get("RESEARCH_NOOP") == "true"
          selection_status = os.environ.get("RESEARCH_SELECTION_STATUS", "unknown")
          selection_reason = os.environ.get("RESEARCH_SELECTION_REASON", "")
          def read_json(path):
              try:
                  value = json.loads(Path(path).read_text(encoding="utf-8"))
                  return value if isinstance(value, dict) else {}
              except (OSError, UnicodeError, json.JSONDecodeError):
                  return {}
          selection = read_json(os.environ.get("RESEARCH_SELECTION_PATH", ""))
          report = read_json(os.environ.get("RESEARCH_REPORT_PATH", ""))
          required_pairs = sorted(set(
              str(item) for item in selection.get("required_market_strategy_pairs", [])
              if isinstance(item, str) and ":" in item
          ))
          selected_pairs = sorted(set(
              str(item) for item in os.environ.get("SCANNED_PAIRS", "").split(",") if ":" in item
          ))
          current_pairs = sorted(set(
              str(item) for item in selection.get("already_current_pairs", [])
              if isinstance(item, str) and ":" in item
          ))
          suppressed_pairs = selection.get("suppressed_market_strategy_pairs", {})
          suppressed_pairs = suppressed_pairs if isinstance(suppressed_pairs, dict) else {}
          step_outcomes = {
              "taiwan:momentum": os.environ.get("OUTCOME_TW_MOMENTUM", "skipped"),
              "us:momentum": os.environ.get("OUTCOME_US_MOMENTUM", "skipped"),
              "taiwan:price_action": os.environ.get("OUTCOME_TW_PRICE_ACTION", "skipped"),
              "us:price_action": os.environ.get("OUTCOME_US_PRICE_ACTION", "skipped"),
              "taiwan:resonance": os.environ.get("OUTCOME_TW_RESONANCE", "skipped"),
              "us:resonance": os.environ.get("OUTCOME_US_RESONANCE", "skipped"),
              "taiwan:value": os.environ.get("OUTCOME_TW_VALUE", "skipped"),
              "us:value": os.environ.get("OUTCOME_US_VALUE", "skipped"),
          }
          sources = {
              (str(row.get("market") or ""), str(row.get("strategy") or "")): row
              for row in report.get("sources", []) if isinstance(row, dict)
          }
          publication = {
              (str(row.get("market") or ""), str(row.get("strategy") or "")): row
              for row in report.get("strategy_publication", []) if isinstance(row, dict)
          }
          pair_dispositions = {}
          for pair in sorted(set(required_pairs + selected_pairs + current_pairs)):
              market, strategy = pair.split(":", 1)
              source = sources.get((market, strategy), {})
              publish = publication.get((market, strategy), {})
              outcome = step_outcomes.get(pair, "skipped")
              fallback = source.get("historical_fallback") is True or publish.get("historical_fallback") is True
              if pair in suppressed_pairs:
                  state = "suppressed_by_attempt_policy"
              elif fallback:
                  state = "historical_fallback"
              elif pair in current_pairs and pair not in required_pairs and pair not in selected_pairs:
                  state = "already_current"
              elif pair in selected_pairs and outcome == "skipped":
                  state = "selected_but_not_started"
              elif pair in selected_pairs and outcome not in {"success", "skipped"}:
                  state = f"worker_{outcome}"
              elif str(source.get("scan_state") or "").casefold() == "complete":
                  try:
                      candidate_count = int(source.get("candidates"))
                  except (TypeError, ValueError):
                      candidate_count = -1
                  state = "complete_scan_zero_candidates" if candidate_count == 0 else "complete_scan"
              elif pair in required_pairs and pair not in selected_pairs:
                  state = "required_but_not_selected"
              elif pair in selected_pairs:
                  state = "scan_result_unverified"
              else:
                  state = "not_run"
              pair_dispositions[pair] = {
                  "state": state,
                  "step_outcome": outcome,
                  "candidate_count": source.get("candidates"),
                  "scan_state": str(source.get("scan_state") or "unknown"),
                  "blocking_reason": str(source.get("blocking_reason") or publish.get("blocking_reason") or suppressed_pairs.get(pair) or "")[:160],
              }
          unstarted_required_pairs = [
              pair for pair in required_pairs
              if pair in selected_pairs and step_outcomes.get(pair, "skipped") == "skipped"
          ]
          gate_outcome = os.environ.get("RESEARCH_GATE_OUTCOME", "unknown")
          gate_publish = os.environ.get("RESEARCH_GATE_PUBLISH") == "true"
          gate_fallback = os.environ.get("RESEARCH_GATE_FALLBACK") == "true"
          degraded = not no_op and (
              os.environ.get("JOB_STATUS") == "failure"
              or selection_status in {"blocked", "scan_selected_with_suppressed_pairs"}
              or bool(unstarted_required_pairs)
              or queue_status == "failed"
              or os.environ.get("PREPARED_RELEASE_OUTCOME") == "failure"
              or os.environ.get("DEPLOYMENT_OUTCOME") == "failure"
              or gate_outcome == "failure"
              or (due and (not gate_publish or gate_fallback))
          )
          if mode != "production":
              business_status = "not_applicable"
              reason = "non_production_scan"
          elif no_op:
              business_status = "healthy"
              reason = selection_reason or "research_slot_already_current"
          else:
              business_status = "degraded" if degraded else "healthy"
              reason = (
                  "research_due_market_strategy_pairs_suppressed"
                  if selection_status == "scan_selected_with_suppressed_pairs"
                  else os.environ.get("QUEUE_ERROR_CODE", "")
              )
              if not reason and selection_status == "blocked":
                  reason = selection_reason or "research_strategy_selection_blocked"
              if not reason and queue_status == "failed":
                  reason = "writer_queue_failed"
              if not reason and gate_outcome == "failure":
                  reason = "research_gate_failed"
              if not reason and due and (not gate_publish or gate_fallback):
                  reason = "production_research_not_current"
              if not reason and os.environ.get("PREPARED_RELEASE_OUTCOME") == "failure":
                  reason = "prepared_release_revalidation_failed"
              if not reason and os.environ.get("DEPLOYMENT_OUTCOME") == "failure":
                  reason = "pages_deployment_failed"
              if not reason and os.environ.get("JOB_STATUS") == "failure":
                  reason = "workflow_job_failed"
          from src.research_terminal import normalize_research_reason
          reason, reason_detail = normalize_research_reason(reason[:200])
          record = {
              "schema_version": "unified-research-terminal-v1",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "sha": os.environ["GITHUB_SHA"],
              "production_run": mode == "production",
              "business_status": business_status,
              "reason": reason[:200],
              "reason_detail": reason_detail,
              "stages": {
                  "writer_queue": queue_status,
                  "writer_queue_error_code": os.environ.get("QUEUE_ERROR_CODE", ""),
                  "research_gate": gate_outcome,
                  "research_publish": gate_publish,
                  "research_fallback": gate_fallback,
                  "research_selection": os.environ.get("RESEARCH_SELECTION_STATUS", "unknown"),
                  "research_selection_reason": os.environ.get("RESEARCH_SELECTION_REASON", ""),
                  "required_market_strategy_pairs": required_pairs,
                  "selected_market_strategy_pairs": selected_pairs,
                  "already_current_pairs": current_pairs,
                  "executed_market_strategy_pairs": sorted(
                      pair for pair, outcome in step_outcomes.items() if outcome != "skipped"
                  ),
                  "strategy_step_outcomes": step_outcomes,
                  "strategy_pair_dispositions": pair_dispositions,
                  "unstarted_required_pairs": unstarted_required_pairs,
                  "research_noop": no_op,
                  "prepared_release": os.environ.get("PREPARED_RELEASE_OUTCOME", "unknown"),
                  "deployment": os.environ.get("DEPLOYMENT_OUTCOME", "unknown"),
              },
          }
          Path("unified-research-terminal.json").write_text(
              json.dumps(record, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(record, sort_keys=True))
          PY
      - name: Upload run-bound research incident result
        if: always() && steps.research_terminal.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unified-research-terminal-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: unified-research-terminal.json
          if-no-files-found: error
          retention-days: 90
