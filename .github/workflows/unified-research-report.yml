name: Unified Taiwan-US research report
on:
  workflow_dispatch:
    inputs:
      taiwan_limit:
        description: Taiwan public symbols per research scan
        required: true
        default: '0'
      us_limit:
        description: US large-cap symbols per research scan
        required: true
        default: '0'
      batch_size:
        description: Symbols per public-data request
        required: true
        default: '50'
      mops_max_refresh:
        description: Taiwan MOPS historical records to refresh per run
        required: true
        # Keep the work incremental, but finish a 0050+0051 pool in days
        # rather than weeks. The job remains bounded by the 55-minute limit.
        default: '24'
  repository_dispatch:
    types: [unified-research-report]
  schedule:
    # Run at 10:00 Taiwan time. GitHub-hosted schedules can be delayed during
    # load spikes; starting well before the 14:45 post-close brief gives the
    # bounded MOPS/value scan enough room to publish a fresh release.
    - cron: '0 2 * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: unified-research-report
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TAIWAN_LIMIT: ${{ inputs.taiwan_limit || github.event.client_payload.taiwan_limit || '0' }}
      US_LIMIT: ${{ inputs.us_limit || github.event.client_payload.us_limit || '0' }}
      BATCH_SIZE: ${{ inputs.batch_size || github.event.client_payload.batch_size || '50' }}
      MOPS_MAX_REFRESH: ${{ inputs.mops_max_refresh || github.event.client_payload.mops_max_refresh || '24' }}
      NEWS_CACHE_PATH: site/data/news-cache.json
      SEC_FACTS_CACHE_PATH: data/sec-companyfacts-cache.json
      DATA_RELEASE_BRANCH: data-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last immutable data release
        run: python -m src.data_release --restore --branch "$DATA_RELEASE_BRANCH" --include site/data --include data/taiwan-mops-pristine-history.json --include data/sec-companyfacts-cache.json
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: Clear previous research scan artifacts
        run: |
          # Never let a failed/partial scan reuse a CSV or summary from an
          # earlier release.  Missing outputs are rendered as an explicit
          # data gap by run_research_report instead of stale candidates.
          rm -f data/*-scan*.csv data/*-summary*.json
      - name: 台股動能研究掃描
        continue-on-error: true
        run: python -m src.run_taiwan_momentum_scan --limit "$TAIWAN_LIMIT" --batch-size "$BATCH_SIZE" --offset 0 --universe-file data/runtime-taiwan-universe.json
      - name: 美股動能研究掃描
        continue-on-error: true
        run: python -m src.run_us_momentum_scan --limit "$US_LIMIT" --batch-size "$BATCH_SIZE"
      - name: 台股裸 K 結構研究掃描
        continue-on-error: true
        run: python -m src.run_taiwan_price_action_scan --limit "$TAIWAN_LIMIT" --batch-size "$BATCH_SIZE" --offset 0 --universe-file data/runtime-taiwan-universe.json
      - name: 美股裸 K 結構研究掃描
        continue-on-error: true
        run: python -m src.run_us_price_action_scan --limit "$US_LIMIT" --batch-size "$BATCH_SIZE"
      - name: 台股三維共振研究掃描
        continue-on-error: true
        run: python -m src.run_resonance_scan --market taiwan --limit "$TAIWAN_LIMIT" --batch-size "$BATCH_SIZE" --offset 0 --universe-file data/runtime-taiwan-universe.json
      - name: 美股三維共振研究掃描
        continue-on-error: true
        run: python -m src.run_resonance_scan --market us --limit "$US_LIMIT" --batch-size "$BATCH_SIZE"
      - name: 台股品質價值覆核
        continue-on-error: true
        run: python -m src.run_value_quality_scan --market taiwan --batch-size "$BATCH_SIZE" --mops-max-refresh "$MOPS_MAX_REFRESH"
      - name: 美股品質價值覆核
        continue-on-error: true
        run: python -m src.run_value_quality_scan --market us --batch-size "$BATCH_SIZE"
      - run: python -m src.run_research_report
      - run: python -m src.refresh_market_data
      - name: Build release manifest
        run: python -m src.release_manifest
      - name: 保存最新公開研究摘要
        run: |
          python -m src.data_release --publish --branch "$DATA_RELEASE_BRANCH" --include site/data --include data/taiwan-mops-pristine-history.json --include data/sec-companyfacts-cache.json --message "chore: refresh public research report"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: ./.github/actions/deploy-pages-retry
      - uses: actions/upload-artifact@v4
        with:
          name: unified-research-report
          path: |
            data/*scan*.csv
            data/*summary*.json
            data/taiwan-mops-pristine-history.json
            data/sec-companyfacts-cache.json
            site/data/research-report.json
