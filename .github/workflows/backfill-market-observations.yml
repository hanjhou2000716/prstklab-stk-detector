name: Backfill market observation backup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MARKET_BACKUP_ENABLED: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install market dependencies
        run: python -m pip install -r requirements.txt
      - name: Backfill official normalized history
        run: python scripts/backfill_market_observations.py | tee market-backfill-result.json
      - name: Publish safe summary
        if: always()
        run: |
          {
            echo '## Market observation backup backfill'
            jq -r '"- status: \(.status // "unknown")", "- counts: \(.counts // {})", "- error_count: \((.errors // []) | length)"' market-backfill-result.json 2>/dev/null || echo '- status: failed_before_result'
          } >> "$GITHUB_STEP_SUMMARY"
