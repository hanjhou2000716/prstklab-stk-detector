name: Full Taiwan momentum scan
on:
  workflow_dispatch:
jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        offset: [0, 1000, 2000]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - run: python -m src.run_taiwan_momentum_scan --limit 1000 --batch-size 50 --offset ${{ matrix.offset }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: taiwan-momentum-segment-${{ matrix.offset }}
          path: data/taiwan-momentum-*
  aggregate:
    needs: scan
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: taiwan-momentum-segment-*
          path: data/segments
      - run: python -m src.merge_momentum_results data/segments
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: taiwan-momentum-combined
          path: data/taiwan-momentum-combined.*
