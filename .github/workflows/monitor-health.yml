name: Railway monitor health

on:
  repository_dispatch:
    types: [monitor-health]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: main-data-writer
  cancel-in-progress: false

jobs:
  publish-monitor-health:
    # Health publishing is best-effort; a control-plane outage must not create
    # repeated failure notifications or be mistaken for a data health result.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      MONITOR_HEALTH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
      DATA_RELEASE_BRANCH: data-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last immutable data release
        run: python -m src.data_release --restore --branch "$DATA_RELEASE_BRANCH" --include site/data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Merge Railway diagnostics
        run: python -m src.monitor_health --payload "$MONITOR_HEALTH_PAYLOAD" --snapshot site/data/market.json --state site/data/monitor-health.json
      - name: Commit monitor diagnostics
        run: |
          python -m src.release_manifest
          python -m src.data_release --publish --branch "$DATA_RELEASE_BRANCH" --include site/data --message "chore: publish monitor health diagnostics"
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: ./.github/actions/deploy-pages-retry
