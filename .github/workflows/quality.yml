name: Quality and delivery dry-run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-dry-run:
    runs-on: ubuntu-latest
    env:
      # Deliberate non-secret values used only by the local validation.
      TELEGRAM_CHAT_IDS: ci-recipient-a,ci-recipient-b
      DASHBOARD_URL: https://example.test/prstklab-stk-detector/
      TELEGRAM_BOT_TOKEN: ""
      RAILWAY_STATUS_URL: ""
      RAILWAY_STATUS_SHARED_SECRET: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pip install uv
          uv sync --locked --all-groups
      - name: Reset coverage data
        run: uv run coverage erase
      - name: Run full unit tests and publish coverage report
        # The full repository report remains visible so legacy coverage debt is
        # measurable, but this release gate is enforced on the newly integrated
        # contract, lifecycle, renderer, delivery and release modules below.
        run: uv run pytest -q --cov=src --cov-report=term-missing --cov-report=xml
      - name: Enforce core release and delivery coverage gate
        run: >-
          uv run pytest -q
          --cov=src.alert_budget
          --cov=src.alert_caption
          --cov=src.alert_contract
          --cov=src.alert_lifecycle
          --cov=src.material_change
          --cov=src.alert_card_renderer
          --cov=src.telegram_client
          --cov=src.deep_link_router
          --cov=src.artifact_contract
          --cov=src.release_manifest
          --cov=src.release_gate
          --cov=src.system_dry_run
          --cov-report=term-missing
          --cov-fail-under=80
      - name: Ruff baseline (new violations fail)
        run: uv run ruff check src/data_release.py tests/test_data_release.py
      - name: Mypy baseline (new module)
        run: uv run mypy src/data_release.py
      - name: Compile Python modules
        run: python -m compileall -q src railway-monitor
      - name: Validate checked-in Mini App artifacts
        run: python -m src.runtime_audit
      - name: Validate Telegram delivery configuration without network access
        run: python -m src.delivery_smoke_test
      - name: Offline release-to-delivery dry run
        run: python -m src.system_dry_run
