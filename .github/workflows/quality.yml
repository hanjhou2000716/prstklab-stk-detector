name: Quality and delivery dry-run

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Deliberate non-secret values used only by the local validation.
      TELEGRAM_CHAT_IDS: ci-recipient-a,ci-recipient-b
      DASHBOARD_URL: https://example.test/prstklab-stk-detector/
      TELEGRAM_BOT_TOKEN: ""
      RAILWAY_STATUS_URL: ""
      RAILWAY_STATUS_SHARED_SECRET: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pip install uv
          uv sync --locked --all-groups
          uv run python -m playwright install --with-deps chromium
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v2
        with:
          version: 2.39.2
      - name: Reset coverage data
        run: uv run coverage erase
      - name: Run full unit tests and publish coverage report
        # CLI wrappers are covered by subprocess/E2E jobs; library modules
        # remain in the project-wide 80% floor configured in pyproject.toml.
        run: uv run pytest -q --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Enforce core release and delivery coverage gate
        # The full pytest run above already populated .coverage for every
        # source module.  Reporting a filtered subset enforces the stricter
        # core floor without executing the complete suite a second time.
        run: >-
          uv run coverage report
          --include=src/alert_budget.py,src/alert_caption.py,src/alert_contract.py,src/alert_lifecycle.py,src/material_change.py,src/alert_card_renderer.py,src/telegram_client.py,src/deep_link_router.py,src/artifact_contract.py,src/release_manifest.py,src/release_gate.py,src/system_dry_run.py
          --fail-under=90
      - name: Ruff full source and test gate
        run: uv run ruff check src tests
      - name: Verify Railway shared classifier bundle
        run: python scripts/sync_railway_shared_classifier.py --check
      - name: Verify Railway canonical external-parser bundle
        run: python scripts/sync_railway_canonical_parser.py --check
      - name: Verify canonical overlap and generated bundle provenance
        run: python scripts/verify_canonical_overlap.py
      - name: Verify Gate-Driven requirement and evidence registry
        run: python scripts/verify_gate_evidence.py
      - name: Verify offline Supabase migration contract without production credentials
        run: python scripts/validate_local_migration_contract.py
      - name: Validate GitHub Actions workflow syntax
        run: docker run --rm -w /repo -v "$GITHUB_WORKSPACE:/repo" rhysd/actionlint:1.7.7 .github/workflows/*.yml
      - name: Run disposable local Supabase migration integration test
        run: python scripts/local_supabase_migration_test.py
      - name: Verify Creator, FinancialJuice and news intelligence contracts
        run: python scripts/verify_intelligence_contracts.py
      - name: Mypy full source gate
        run: uv run mypy src
      - name: Compile Python modules
        run: python -m compileall -q src railway-monitor
      - name: Validate checked-in Mini App artifacts
        run: python -m src.runtime_audit
      - name: Validate Telegram delivery configuration without network access
        run: python -m src.delivery_smoke_test
      - name: Offline release-to-delivery dry run
        run: python -m src.system_dry_run
      - name: Offline production release-to-delivery acceptance
        # Use the locked environment that installed Chromium above.  Running
        # the system Python here can load a different Playwright version and
        # fail to find the matching browser even though installation passed.
        run: uv run python -m src.production_e2e
      - name: Publish CI provenance
        if: always()
        run: |
          {
            echo "## CI provenance"
            echo "- trigger: ${{ github.event_name }}"
            echo "- run_id: ${{ github.run_id }}"
            echo "- run_sha: ${{ github.sha }}"
            echo "- ref: ${{ github.ref }}"
            echo "- pull_request: ${{ github.event.pull_request.number || 'none' }}"
          } >> "$GITHUB_STEP_SUMMARY"
