name: Quality and delivery dry-run

on:
  push:
    branches: [main, "validation/**"]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-dry-run:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Deliberate non-secret values used only by the local validation.
      TELEGRAM_CHAT_IDS: ci-recipient-a,ci-recipient-b
      DASHBOARD_URL: https://example.test/prstklab-stk-detector/
      TELEGRAM_BOT_TOKEN: ""
      RAILWAY_STATUS_URL: ""
      RAILWAY_STATUS_SHARED_SECRET: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pip install uv
          uv sync --locked --all-groups
      - name: Install pinned actionlint and ShellCheck
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          action_version="1.7.7"
          action_archive="actionlint_${action_version}_linux_amd64.tar.gz"
          action_base="https://github.com/rhysd/actionlint/releases/download/v${action_version}"
          curl -fsSL "$action_base/$action_archive" -o "$temp_dir/$action_archive"
          curl -fsSL "$action_base/actionlint_${action_version}_checksums.txt" -o "$temp_dir/checksums.txt"
          action_hash="$(awk -v file="$action_archive" '$NF == file { print $1; exit }' "$temp_dir/checksums.txt")"
          test -n "$action_hash"
          printf '%s  %s\n' "$action_hash" "$temp_dir/$action_archive" | sha256sum --check -
          tar -xzf "$temp_dir/$action_archive" -C "$temp_dir"
          sudo install "$temp_dir/actionlint" /usr/local/bin/actionlint
          shell_archive="shellcheck-v0.11.0.linux.x86_64.tar.xz"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/$shell_archive" -o "$temp_dir/$shell_archive"
          printf '%s  %s\n' "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198" "$temp_dir/$shell_archive" | sha256sum --check -
          tar -xJf "$temp_dir/$shell_archive" -C "$temp_dir"
          sudo install "$temp_dir/shellcheck-v0.11.0/shellcheck" /usr/local/bin/shellcheck
          actionlint -version
          shellcheck --version
      - name: Install Playwright browser for integration tests
        run: uv run python -m playwright install --with-deps chromium
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v2
        with:
          version: 2.39.2
      - name: Run complete shared local and CI quality preflight
        id: quality_preflight
        env:
          QUALITY_PREFLIGHT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: uv run python scripts/quality_preflight.py --full
      - name: Publish CI provenance
        if: always()
        run: |
          {
            echo "## CI provenance"
            echo "- trigger: ${{ github.event_name }}"
            echo "- run_id: ${{ github.run_id }}"
            echo "- run_attempt: ${{ github.run_attempt }}"
            echo "- workflow_tested_sha: ${{ github.sha }}"
            echo "- ref: ${{ github.ref }}"
            echo "- pull_request: ${{ github.event.pull_request.number || 'none' }}"
            echo "- pull_request_head_sha: ${{ github.event.pull_request.head.sha || 'none' }}"
            echo "- pull_request_base_sha: ${{ github.event.pull_request.base.sha || 'none' }}"
            echo "- shared_quality_preflight_outcome: ${{ steps.quality_preflight.outcome || 'not_run' }}"
            echo "- shared_quality_preflight_failed_gate: ${{ steps.quality_preflight.outputs.failed_gate || 'unknown' }}"
            echo "- job_outcome: ${{ job.status }}"
            echo "- run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}"
            echo "- read_only_run_triage: uv run python scripts/inspect_quality_run.py --repo ${{ github.repository }} --run-id ${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
