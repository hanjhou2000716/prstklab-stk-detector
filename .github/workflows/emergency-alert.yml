name: Emergency market alert

on:
  workflow_dispatch:
    inputs:
      category:
        description: Alert category
        required: true
        type: choice
        options: [fed, macro, policy, conflict, energy, semiconductor, market, black_swan, material_positive]
      summary:
        description: Watch-sized summary; the final Telegram message must stay within 30 characters
        required: true
        type: string
  repository_dispatch:
    types: [external-market-alert]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: main-data-writer
  cancel-in-progress: false

jobs:
  send-emergency-alert:
    # Keep transient Actions/Pages control-plane failures from becoming a
    # repeated email storm; release-gated Telegram delivery remains fail-closed.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      CATEGORY: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.category || inputs.category }}
      SUMMARY: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.summary || inputs.summary }}
      EXTERNAL_SOURCE: ${{ github.event.client_payload.source || '' }}
      EXTERNAL_EVENT_ID: ${{ github.event.client_payload.event_id || '' }}
      EXTERNAL_OCCURRED_AT: ${{ github.event.client_payload.occurred_at || '' }}
      EXTERNAL_EVIDENCE: ${{ toJson(github.event.client_payload.evidence || fromJson('[]')) }}
      EXTERNAL_SIGNATURE: ${{ github.event.client_payload.signature || '' }}
      EXTERNAL_OFFICIAL_CONFIRMED: ${{ github.event.client_payload.official_confirmed || '' }}
      EXTERNAL_MARKET_SYNC_CONFIRMED: ${{ github.event.client_payload.market_sync_confirmed || '' }}
      EXTERNAL_RISK_LEVEL: ${{ github.event.client_payload.risk_level || '' }}
      EXTERNAL_MARKET_SYNC: ${{ toJson(github.event.client_payload.market_sync || fromJson('[]')) }}
      EXTERNAL_ALERT_SHARED_SECRET: ${{ secrets.EXTERNAL_ALERT_SHARED_SECRET }}
      NEWS_CACHE_PATH: site/data/news-cache.json
      MANIFEST_PATH: site/data/release-manifest.json
      DATA_RELEASE_BRANCH: data-release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Restore last immutable data release
        run: python -m src.data_release --restore --branch "$DATA_RELEASE_BRANCH" --include site/data
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Validate signed external alert
        id: external
        if: github.event_name == 'repository_dispatch'
        run: >
          python -m src.external_alert
          --category "$CATEGORY"
          --summary "$SUMMARY"
          --source "$EXTERNAL_SOURCE"
          --event-id "$EXTERNAL_EVENT_ID"
          --occurred-at "$EXTERNAL_OCCURRED_AT"
          --evidence "$EXTERNAL_EVIDENCE"
          --signature "$EXTERNAL_SIGNATURE"
          --shared-secret "$EXTERNAL_ALERT_SHARED_SECRET"
          >> "$GITHUB_OUTPUT"
      - name: Restore external event lock
        id: idempotency
        if: github.event_name == 'repository_dispatch'
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: .external-alert-lock
          key: external-alert-${{ steps.external.outputs.event_key }}
      - name: Refresh public market snapshot
        if: github.event_name == 'workflow_dispatch' || steps.idempotency.outputs.cache-hit != 'true'
        run: python -m src.refresh_market_data
      - name: Add verified external alert to Mini App data
        if: github.event_name == 'repository_dispatch' && steps.idempotency.outputs.cache-hit != 'true'
        run: >
          python -m src.external_alert
          --category "$CATEGORY"
          --summary "$SUMMARY"
          --source "$EXTERNAL_SOURCE"
          --event-id "$EXTERNAL_EVENT_ID"
          --occurred-at "$EXTERNAL_OCCURRED_AT"
          --evidence "$EXTERNAL_EVIDENCE"
          --signature "$EXTERNAL_SIGNATURE"
          --shared-secret "$EXTERNAL_ALERT_SHARED_SECRET"
          --snapshot site/data/market.json
      - name: Commit refreshed Mini App data
        if: github.event_name == 'workflow_dispatch' || steps.idempotency.outputs.cache-hit != 'true'
        run: |
          python -m src.canonical_release_publisher --branch "$DATA_RELEASE_BRANCH" --include site/data \
            --message "chore: refresh emergency market alert"
      - name: Configure GitHub Pages
        if: github.event_name == 'workflow_dispatch' || steps.idempotency.outputs.cache-hit != 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' || steps.idempotency.outputs.cache-hit != 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
      - name: Deploy Pages
        if: github.event_name == 'workflow_dispatch' || steps.idempotency.outputs.cache-hit != 'true'
        id: deployment
        uses: ./.github/actions/deploy-pages-retry
      - name: Verify deployed release before emergency delivery
        if: (github.event_name == 'workflow_dispatch' || steps.idempotency.outputs.cache-hit != 'true') && steps.deployment.outputs.available == 'true'
        continue-on-error: true
        id: release_gate
        run: |
          python -m src.release_gate \
            --manifest "$MANIFEST_PATH" \
            --public-url "${{ steps.deployment.outputs.page_url }}" \
            --public-attempts 12 \
            --public-delay 5 \
            >> "$GITHUB_OUTPUT"
      - name: Record delivery gate when Pages is unavailable
        if: (github.event_name == 'workflow_dispatch' || steps.idempotency.outputs.cache-hit != 'true') && steps.deployment.outputs.available != 'true'
        run: echo "Pages unavailable; Telegram delivery intentionally skipped (fail closed)."
      - name: Send Telegram emergency alert
        if: steps.release_gate.outputs.allowed == 'true'
        id: send
        env:
          TRACE_ID: ${{ github.event.client_payload.trace_id || format('manual-{0}', github.run_id) }}
          RELEASE_ID: ${{ steps.release_gate.outputs.release_id }}
          SNAPSHOT_ID: ${{ steps.release_gate.outputs.snapshot_id }}
        run: python -m src.emergency_alert --category "$CATEGORY" --summary "$SUMMARY"
      - name: Report Telegram delivery outcome
        if: always() && (github.event_name == 'workflow_dispatch' || steps.idempotency.outputs.cache-hit != 'true')
        run: |
          echo "trace_id=${{ steps.send.outputs.trace_id }}"
          echo "delivery_status=${{ steps.send.outputs.delivery_status }}"
          echo "delivered_count=${{ steps.send.outputs.delivered_count }} failed_count=${{ steps.send.outputs.failed_count }}"
      - name: Persist Telegram delivery receipt to Railway
        if: always() && (github.event_name == 'workflow_dispatch' || steps.idempotency.outputs.cache-hit != 'true')
        continue-on-error: true
        env:
          RAILWAY_STATUS_URL: ${{ vars.RAILWAY_STATUS_URL }}
          RAILWAY_STATUS_SHARED_SECRET: ${{ secrets.RAILWAY_STATUS_SHARED_SECRET }}
          TRACE_ID: ${{ steps.send.outputs.trace_id }}
          RELEASE_ID: ${{ steps.send.outputs.release_id || steps.release_gate.outputs.release_id }}
          SNAPSHOT_ID: ${{ steps.send.outputs.snapshot_id || steps.release_gate.outputs.snapshot_id }}
          DELIVERY_STATUS: ${{ steps.send.outputs.delivery_status }}
          DELIVERED_COUNT: ${{ steps.send.outputs.delivered_count }}
          FAILED_COUNT: ${{ steps.send.outputs.failed_count }}
          FAILED_RECIPIENT_HASHES: ${{ steps.send.outputs.failed_recipient_hashes }}
        run: python -m src.delivery_callback
      - name: Mark verified external event as sent
        if: success() && github.event_name == 'repository_dispatch' && steps.idempotency.outputs.cache-hit != 'true'
        run: touch .external-alert-lock
      - name: Save external event lock
        if: success() && github.event_name == 'repository_dispatch' && steps.idempotency.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: .external-alert-lock
          key: external-alert-${{ steps.external.outputs.event_key }}
