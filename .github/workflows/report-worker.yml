name: Async report worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Supabase report_jobs UUID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: report-job-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install report engine dependencies
        run: python -m pip install -r requirements.txt
      - name: Process asynchronous report job
        run: python -m jobs.process_report_job --job-id "${{ inputs.job_id }}"
