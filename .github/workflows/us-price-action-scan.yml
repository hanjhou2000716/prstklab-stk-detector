name: Manual US Price Action scan
on:
  workflow_dispatch:
    inputs:
      limit:
        description: US large-cap symbols to scan (0 means full public list)
        required: true
        default: '100'
      batch_size:
        description: Symbols per public-data request
        required: true
        default: '50'
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - run: python -m src.run_us_price_action_scan --limit ${{ inputs.limit }} --batch-size ${{ inputs.batch_size }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: us-price-action-scan
          path: data/us-price-action-*
