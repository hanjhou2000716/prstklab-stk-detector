name: Deploy GitHub Pages with identity verification
description: Select this run's Pages artifact, create one official Pages deployment, and verify its returned deployment identity.
inputs:
  build_version:
    description: Compatibility input; Pages build identity is the reserved source GITHUB_SHA.
    required: false
    default: ""
  timeout:
    description: Maximum time in milliseconds to observe the identity-bound Pages deployment.
    required: false
    default: "180000"
  retry_delay_seconds:
    description: Seconds to wait before retrying a transient Pages deployment failure.
    required: false
    default: "30"
  fallback_url:
    description: Public dashboard URL to use when deploy-pages does not expose page_url.
    required: false
    default: ""
  artifact_name:
    description: Pages artifact name to deploy.
    required: false
    default: "github-pages"
outputs:
  page_url:
    description: URL returned by the successful Pages deployment.
    value: ${{ steps.select-url.outputs.page_url }}
  available:
    description: Whether a Pages deployment completed successfully.
    value: ${{ steps.select-url.outputs.available }}
  recoverable:
    description: Whether this run has a trusted deployment ID that may be rechecked without creating another deployment.
    value: ${{ steps.select-url.outputs.recoverable }}
  request_outcome:
    description: Whether the deployment create request was not started, rejected, unknown, or created.
    value: ${{ steps.select-url.outputs.request_outcome }}
  reason:
    description: Stable reason when Pages is temporarily unavailable.
    value: ${{ steps.select-url.outputs.reason }}
  error_code:
    description: Stable Pages API or transport failure category.
    value: ${{ steps.select-url.outputs.error_code }}
  error:
    description: Sanitized Pages API diagnostic for workflow summaries.
    value: ${{ steps.select-url.outputs.error }}
  deployment_id:
    description: Deployment ID returned by the GitHub Pages create API.
    value: ${{ steps.select-url.outputs.deployment_id }}
  deployment_status_url:
    description: Status URL returned by the GitHub Pages create API.
    value: ${{ steps.select-url.outputs.deployment_status_url }}
  deployment_status_url_shape:
    description: Sanitized shape of the returned status URL, without logging its value.
    value: ${{ steps.select-url.outputs.deployment_status_url_shape }}
  artifact_id:
    description: Unique Pages artifact ID selected from this workflow run.
    value: ${{ steps.select-url.outputs.artifact_id }}
  build_version:
    description: Pages build version sent to the GitHub Pages deployment API.
    value: ${{ steps.select-url.outputs.build_version }}
  source_revision:
    description: Source commit used to build the Pages artifact.
    value: ${{ steps.select-url.outputs.source_revision }}
runs:
  using: composite
  steps:
    - name: Create and verify the exact run artifact deployment
      id: deployment
      continue-on-error: true
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PAGES_ARTIFACT_NAME: ${{ inputs.artifact_name }}
        PAGES_BUILD_VERSION: ${{ inputs.build_version || github.sha }}
      run: |
        set -euo pipefail
        timeout_seconds="$(( ${{ inputs.timeout }} / 1000 ))"
        python -m src.pages_deployment \
          --mode deploy \
          --expected-build-version "$PAGES_BUILD_VERSION" \
          --timeout-seconds "$timeout_seconds" >> "$GITHUB_OUTPUT"

    - name: Select trusted deployment outputs
      id: select-url
      shell: bash
      env:
        DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
        DEPLOY_AVAILABLE: ${{ steps.deployment.outputs.available || 'false' }}
        DEPLOY_RECOVERABLE: ${{ steps.deployment.outputs.recoverable || 'false' }}
        DEPLOY_REQUEST_OUTCOME: ${{ steps.deployment.outputs.request_outcome || 'unknown' }}
        DEPLOY_URL: ${{ steps.deployment.outputs.page_url || '' }}
        DEPLOY_ID: ${{ steps.deployment.outputs.deployment_id || '' }}
        DEPLOY_STATUS_URL: ${{ steps.deployment.outputs.deployment_status_url || '' }}
        DEPLOY_STATUS_URL_SHAPE: ${{ steps.deployment.outputs.deployment_status_url_shape || '' }}
        DEPLOY_ARTIFACT_ID: ${{ steps.deployment.outputs.artifact_id || '' }}
        DEPLOY_BUILD_VERSION: ${{ steps.deployment.outputs.deployment_build_version || inputs.build_version || github.sha }}
        DEPLOY_SOURCE_REVISION: ${{ steps.deployment.outputs.source_revision || github.sha }}
        DEPLOY_ERROR: ${{ steps.deployment.outputs.error || '' }}
        DEPLOY_ERROR_CODE: ${{ steps.deployment.outputs.error_code || '' }}
        FALLBACK_URL: ${{ inputs.fallback_url }}
      run: |
        set -euo pipefail
        if [ "${DEPLOY_OUTCOME:-}" = "success" ] && [ "$DEPLOY_AVAILABLE" = "true" ] && [ -n "$DEPLOY_ID" ] && [ -n "$DEPLOY_STATUS_URL" ]; then
          deployed_url="$DEPLOY_URL"
          reason="available"
        else
          deployed_url=""
          reason="pages_deployment_unavailable"
          echo "::warning::Pages deployment identity was not verified; notification delivery remains blocked (${DEPLOY_ERROR_CODE:-pages_deployment_unavailable}). ${DEPLOY_ERROR}"
        fi
        page_url="${deployed_url:-$FALLBACK_URL}"
        printf 'page_url=%s\n' "$page_url" >> "$GITHUB_OUTPUT"
        printf 'available=%s\n' "$([ -n "$deployed_url" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        printf 'recoverable=%s\n' "$([ "$DEPLOY_RECOVERABLE" = "true" ] && [ -n "$DEPLOY_ID" ] && [ -n "$DEPLOY_STATUS_URL" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        printf 'request_outcome=%s\n' "$DEPLOY_REQUEST_OUTCOME" >> "$GITHUB_OUTPUT"
        printf 'reason=%s\n' "$reason" >> "$GITHUB_OUTPUT"
        printf 'error_code=%s\n' "$([ -n "$deployed_url" ] && echo '' || echo "${DEPLOY_ERROR_CODE:-pages_deployment_unavailable}")" >> "$GITHUB_OUTPUT"
        printf 'error=%s\n' "${DEPLOY_ERROR:-}" >> "$GITHUB_OUTPUT"
        printf 'deployment_id=%s\n' "$DEPLOY_ID" >> "$GITHUB_OUTPUT"
        printf 'deployment_status_url=%s\n' "$DEPLOY_STATUS_URL" >> "$GITHUB_OUTPUT"
        printf 'deployment_status_url_shape=%s\n' "${DEPLOY_STATUS_URL_SHAPE:-unknown}" >> "$GITHUB_OUTPUT"
        printf 'artifact_id=%s\n' "$DEPLOY_ARTIFACT_ID" >> "$GITHUB_OUTPUT"
        printf 'build_version=%s\n' "$DEPLOY_BUILD_VERSION" >> "$GITHUB_OUTPUT"
        printf 'source_revision=%s\n' "$DEPLOY_SOURCE_REVISION" >> "$GITHUB_OUTPUT"
        echo "pages_deploy_outcome=${DEPLOY_OUTCOME:-unknown}"
        echo "pages_deploy_available=$([ -n "$deployed_url" ] && echo true || echo false)"
        echo "pages_deployment_status_url_shape=${DEPLOY_STATUS_URL_SHAPE:-unknown}"

    - name: Record degraded Pages status
      if: steps.select-url.outputs.available != 'true'
      shell: bash
      run: echo "Pages deployment is temporarily unavailable; no notification step may run."
